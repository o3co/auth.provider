# The defaults of `@mod/secret-hash`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
secret-hash {
	# Secret checks under way at once in this assembly, every checker it makes together; one more is unavailable at once, before any hashing.
	max-concurrent = 8
}
