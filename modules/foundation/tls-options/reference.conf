# The defaults of `@mod/tls-options`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
tls-options {
	# The least TLS version the provider's own connections take: TLSv1.2 or TLSv1.3.
	min-version = "TLSv1.2"
	# The suites they take, among TLS 1.3's and TLS 1.2's ECDHE with AES-GCM or ChaCha20-Poly1305: every one by default.
	suites = ["TLS_AES_256_GCM_SHA384","TLS_CHACHA20_POLY1305_SHA256","TLS_AES_128_GCM_SHA256","ECDHE-ECDSA-AES128-GCM-SHA256","ECDHE-RSA-AES128-GCM-SHA256","ECDHE-ECDSA-AES256-GCM-SHA384","ECDHE-RSA-AES256-GCM-SHA384","ECDHE-ECDSA-CHACHA20-POLY1305","ECDHE-RSA-CHACHA20-POLY1305"]
}
