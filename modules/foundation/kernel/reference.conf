# The defaults of `@mod/kernel`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
kernel {
	# single or multi; multi refuses a module unsafe on multiple instances
	# deployment: required
	# the lowest level logged (trace to fatal), or silent for none
	logging.level = "info"
	# whole seconds a stop given no deadline waits for its hooks; an orchestrator's grace period must be longer
	stop-seconds = 30
}
