# The defaults of `@mod/kernel`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
kernel {
	# single or multi; multi refuses a module unsafe on multiple instances
	# deployment: required
	# the lowest level logged (trace to fatal), or silent for none
	logging.level = "info"
	# how long a stop given no deadline waits for its hooks, from `1s` to `1h` in whole seconds; an orchestrator's grace period must be longer
	stop-deadline = 30s
}
