# The defaults of `@mod/audit`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
audit {
	# The receivers events go to, by name, or `none` to state that events go nowhere.
	# receivers: required
	# Each receiver's deliveries under way at once; an event past it is lost.
	max-pending = 1000
}
