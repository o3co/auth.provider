# The defaults of `@mod/external-jwt`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
external-jwt {
	# How long after its fetch a key set is still used while no new one can be had, from `1h` to `30d`.
	key-set-max-age = 1d
	# How long after its fetch a key set is used before it is fetched again, from `1m` to `30d` and no longer than `key-set-max-age`; fetches stay at least a minute apart.
	key-set-refresh = 1h
}
