# The defaults of `@mod/rate-limit`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
rate-limit {
	# What a route's request limit does when the store cannot count: `closed` answers 503, `open` lets the request through.
	fail-mode = "closed"
}
