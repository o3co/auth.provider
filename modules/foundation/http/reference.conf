# The defaults of `@mod/http`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
http {
	# The address it listens on.
	host = "127.0.0.1"
	# The port it listens on; 0 takes a free one.
	port = 8080
	# Proxies whose forwarded headers are believed: IPs without a zone, or CIDRs with one prefix length in decimal without a leading zero. Always set behind a proxy: otherwise every request's source is the proxy, and all look like one source.
	trusted-proxies = []
	# How many trusted proxies, at most, a request passes through.
	proxy-hops = 1
	# The scheme, host and port users reach this deployment at: an origin only, with no path.
	# public-origin: optional
	# The https origins whose pages may read cross-origin routes: exact, without a pattern.
	cors-origins = []
	# Accepts a plain-http `public-origin`, knowing its cookies cannot be made secure: an http `public-origin` boots only with it.
	insecure-origin = false
	# The form a trusted proxy forwards the client's certificate in: `rfc9440` (byte sequences) with `header` and `chain-header`, `pem` (one PEM block, URL-encoded or not) with `header`, or `xfcc` (Envoy's form, the chain in the same header) with `header`.
	# client-certificate.dialect: optional
	# The header holding the client's certificate: lower-case letters, digits and `-`; `pem` has no default header.
	client-certificate.header = "client-cert"
	# The header holding the chain behind the certificate, for `rfc9440`: lower-case letters, digits and `-`.
	client-certificate.chain-header = "client-cert-chain"
	# How long a client may take to send a request's headers, from 1s to 1m, such as 10s; past it the request is answered 408 and its connection closed.
	headers-timeout = 10s
	# How long a client may take to send a whole request, its body included, from 1s to 5m and no less than headers-timeout, such as 30s; past it the request is answered 408 and its connection closed.
	request-timeout = 30s
	# The most connections held open at once, from 1 to 1000000; one past it is closed as it arrives.
	max-connections = 10000
}
