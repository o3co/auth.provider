# The defaults of `@mod/outbound`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
outbound {
	# The hosts requests may reach by name; `.name` covers the name and the names under it.
	allow = []
	# Whether requests may reach any host at a public address, instead of naming hosts in `allow`.
	allow-any-public = false
	# The hosts requests never reach, checked before `allow`; `.name` covers the name and the names under it. An address listed is refused also where a name resolves to it.
	deny = []
	# The `host:port` pairs plain http may reach at loopback addresses.
	plain-loopback = []
	# The `host:port` pairs plain http may reach for a URL of the operator's own configuration, at private or loopback addresses alone (10/8, 172.16/12, 192.168/16, 100.64/10, fc00::/7, 127/8, ::1, never a metadata address); every answer must be private or loopback, and the host is still checked against `deny` and `allow`. What goes there, passwords, tokens, credentials and keys, is in the clear: list only peers on a network trusted against reading and changing it.
	plain-internal = []
	# The largest response body a request takes, from 1B to 16MiB.
	max-response-size = 64KiB
	# The largest response body a request for signed material takes, from 1B to 16MiB.
	signed-max-response-size = 1MiB
	# The one deadline covering a request's resolving, connecting, headers and body, from 1ms to 1m.
	timeout = 5s
	# The hosts a URL from the operator's own configuration may reach at a private address (10/8, 172.16/12, 192.168/16, 100.64/10, fc00::/7); `.name` covers the name and the names under it.
	internal-hosts = []
	# Requests under way at once; one more is unavailable at once.
	max-concurrent = 16
	# Whether to boot while a proxy variable is set and no proxy is configured; the variables are never read.
	direct-despite-proxy = false
	# The proxy every https request goes through by CONNECT, but to direct hosts; it resolves names and checks their addresses.
	# proxy: optional
	# The Proxy-Authorization value the proxy asks for, such as `Basic …`: printable ASCII on one line.
	# proxy-authorization: optional
	# The hosts reached directly while a proxy is set; `.name` covers the name and the names under it.
	direct-hosts = []
	# The `host:port` pairs of `plain-loopback` or `plain-internal` whose name is resolved to IPv4 addresses alone, for plain http to that host and port: only those answers are checked and reached, and IPv6 ones are neither. For a network answering a name with an IPv4 address and an IPv6 one that does not reach, as ECS Service Connect writes both in the hosts file. Each names its host by name.
	plain-ipv4 = []
	# Where names are resolved, as the system resolves them: `helper`, in helper processes a request's deadline ends; `in-process`, here, where no deadline stops a lookup.
	resolution = "helper"
	# Names resolving at once, the outside party's half among them; one more is unavailable at once. Four by default, never more than max-concurrent.
	# max-lookups: optional
}
