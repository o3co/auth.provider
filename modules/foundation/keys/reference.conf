# The defaults of `@mod/keys`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
keys {
	# The key id tokens signed with this key carry, unique in the ring.
	# signing.kid: required
	# The algorithm the provider signs with.
	# signing.alg: required
	# The signing key, as a PKCS8 PEM.
	# signing.private-key: required when signing.alg is EdDSA, ES256 or RS256
	# The HMAC secret for HS256, its bytes the HMAC key, read as `secret-encoding` names; unset, as hex where the value is whole bytes of hex, else as base64 (64 hex characters are base64 too, so hex is read first). At least 32 bytes, of at least 8 byte values, however read.
	# signing.secret: required when signing.alg is HS256
	# How `secret` is read: `hex`, `base64` (strict) or `utf8`, the text's own bytes, as 0.17 and policy-verifier read it; a value not of the reading named is refused. Unset, hex or else base64.
	# signing.secret-encoding: optional when signing.alg is HS256
	# The key id of the key that signs next, unique in the ring.
	# next.kid: required when next is set
	# The algorithm the next key will sign with.
	# next.alg: required when next is set
	# The next key's public half, as PEM; a private PEM is taken too.
	# next.public-key: required when next is set
	# Past signing keys that still verify tokens until each one's `expires-at`.
	previous = []
}
