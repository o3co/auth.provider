# The defaults of `@mod/refresh-store`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
refresh-store {
	# How many refresh token families a session's set keeps; past it, one is pushed out and revoked.
	families-per-session = 1000
	# How many access tokens a family's set keeps; past it, one is pushed out and revoked.
	tokens-per-family = 1000
	# How many shards the list of families to settle is spread over.
	settle-shards = 1024
	# How many families to settle one shard holds at most.
	settles-per-shard = 1000
}
