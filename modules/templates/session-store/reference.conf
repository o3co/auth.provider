# The defaults of `@mod/session-store`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
session-store {
	# How many shards the list of sessions still closing is spread over.
	closing-shards = 1024
	# How many sessions still closing one shard holds at most.
	closings-per-shard = 1000
	# How many sessions a subject's listing keeps; past it, the one ending first is pushed out and logged.
	sessions-per-subject = 100
}
