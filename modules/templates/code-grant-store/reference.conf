# The defaults of `@mod/code-grant-store`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
code-grant-store {
	# How many shards the list of codes to revoke is spread over.
	void-shards = 1024
	# How many codes to revoke one shard holds at most.
	voids-per-shard = 1000
}
