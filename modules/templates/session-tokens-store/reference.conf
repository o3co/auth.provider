# The defaults of `@mod/session-tokens-store`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
session-tokens-store {
	# How many token references a session's set keeps; past it, one is pushed out and its token revoked.
	references-per-session = 1000
	# How many shards the sessions pending a push-out are spread over.
	pending-shards = 64
	# How many pending sessions one shard holds; an add to a full shard is refused.
	pending-per-shard = 1000
}
