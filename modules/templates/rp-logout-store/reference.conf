# The defaults of `@mod/rp-logout-store`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
rp-logout-store {
	# How many clients a session's set keeps; past it, one is pushed out and logged.
	clients-per-session = 64
	# How many shards the logout notices not yet delivered are spread over.
	notice-shards = 64
	# How many undelivered notices one shard holds; an add to a full shard is refused.
	notices-per-shard = 1000
}
