# The defaults of `@mod/federation-grants-store`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
federation-grants-store {
	# How many first-time intents a client may have waiting for one subject; past it, the one ending first is pushed out.
	pending-per-client-and-subject = 16
	# How many grants a subject's listing keeps; past it, the one ending first is pushed out.
	grants-per-subject = 100
}
