# The defaults of `@mod/mtls`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
mtls {
	# How a client certificate binds: `self-signed` binds any certificate that parses; `pki` checks a path to an anchor.
	# mode: required
	# The trust anchors, as PEM text holding one certificate each.
	# anchors: optional
	# At most this many certificates between the leaf and an anchor.
	max-intermediates = 4
	# The fewest bits an RSA key in the path may have; 2048 at least.
	min-rsa-bits = 2048
	# Where revocation is asked: `disabled` confirms none; `crl`, `ocsp` or `both` ask what a certificate names.
	# revocation.mode: optional
	# Required: whether an outage refuses the binding, or binds with a warning.
	# revocation.on-unavailable: optional
	# Required: the only hosts revocation material is fetched from; `.name` covers the name and the names under it.
	# revocation.hosts: optional
	# Whether an OCSP request carries a nonce.
	revocation.nonce = true
	# How far ahead of this host's clock revocation material may say it was issued, from 0s to 1h.
	revocation.skew = 5m
	# How long an OCSP answer without a next update is taken, from 1s to 1d.
	revocation.ocsp-fresh = 10m
	# How long a CRL is kept at most, its next update aside, from 1s to 1d.
	revocation.crl-ttl = 1h
	# How long a source that failed is not asked again, from 1s to 1h.
	revocation.failure-lifetime = 30s
	# How many CRLs are kept.
	revocation.crl-entries = 256
	# How many OCSP answers are kept.
	revocation.ocsp-entries = 1024
	# How long one fetch may take, from 1ms to 1m.
	revocation.timeout = 3s
	# How many sources one check may fetch from; past them, what is left is unconfirmed.
	revocation.max-fetches = 4
}
