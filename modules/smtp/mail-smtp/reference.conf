# The defaults of `@mod/mail-smtp`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
mail-smtp {
	# host: required
	port = 587
	security = "starttls"
	# from: required
	# user: optional
	# password: optional
	# How long a whole send may take, from 100ms to 10m.
	deadline = 40s
	concurrent-sends = 20
}
