# The defaults of `@mod/mail-smtp`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
mail-smtp {
	# The relay's host name or address.
	# host: required
	# The relay's port, from 1 to 65535.
	port = 587
	# How the connection is secured: STARTTLS after connecting, TLS from the first byte, or none, only to a loopback host.
	security = "starttls"
	# The sender: one mailbox, alone or after a display name.
	# from: required
	# The account the relay signs in, beside `password`.
	# user: optional
	# The account's password, beside `user`.
	# password: optional
	# How long a whole send may take, from 100ms to 10m.
	deadline = 40s
	# Sends under way at once on a host, from 1 to 1000.
	concurrent-sends = 20
}
