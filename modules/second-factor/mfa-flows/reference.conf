# The defaults of `@mod/mfa-flows`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
mfa-flows {
	# How long a transaction waits for its factor, from 1m to 30m in whole seconds, such as `10m`.
	transaction-lifetime = 10m
	attempts-per-transaction = 5
	requests = 60
	# The window `requests` is counted over, from 1s to 1d in whole seconds, such as `5m`.
	window = 5m
	lockout.threshold = 5
	# The first hold after `threshold` failures, in whole seconds, such as `15m`.
	lockout.backoff = 15m
	# The longest hold, the first doubling up to it, in whole seconds, such as `1d`.
	lockout.max-backoff = 1d
	lockout.budget = 10
	# The window `budget` is counted over, in whole seconds, such as `7d`.
	lockout.budget-window = 7d
	lockout.hard-limit = 100
	# How long a run of failures is remembered without one, in whole seconds, such as `1d`.
	lockout.memory = 1d
	# Seconds, read in place of `backoff`, which replaces it; giving both refuses boot.
	# lockout.backoff-seconds: optional
	# Seconds, read in place of `max-backoff`, which replaces it; giving both refuses boot.
	# lockout.max-backoff-seconds: optional
	# Seconds, read in place of `budget-window`, which replaces it; giving both refuses boot.
	# lockout.budget-window-seconds: optional
	# Seconds, read in place of `memory`, which replaces it; giving both refuses boot.
	# lockout.memory-seconds: optional
	# Seconds, read in place of `transaction-lifetime`, which replaces it; giving both refuses boot.
	# transaction-seconds: optional
	# Seconds, read in place of `window`, which replaces it; giving both refuses boot.
	# window-seconds: optional
}
