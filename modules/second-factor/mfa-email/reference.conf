# The defaults of `@mod/mfa-email`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
mfa-email {
	# Whether a code by mail adds `mfa`; by default it is a second factor of its own amr only.
	adds-second-factor = false
	# How long a code by mail lives, from 1m to 30m, for an enrolment or a sign-in; the proof before a first binding keeps its ten minutes.
	code-lifetime = 10m
}
