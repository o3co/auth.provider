# The defaults of `@mod/mfa-email`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
mfa-email {
	# Whether a code by mail adds `mfa` and so meets a required second factor; by default it is a way back of its own amr only.
	adds-second-factor = false
	# How long a code by mail lives, from 1m to 30m, for an enrolment or a sign-in.
	code-lifetime = 10m
}
