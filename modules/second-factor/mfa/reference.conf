# The defaults of `@mod/mfa`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
mfa {
	# "required" (the default) asks every login for a counting factor; "optional" only of those who hold one.
	mode = "required"
	# How recently a second factor must have been proved to change credentials, from `30s` to `1h` in whole seconds.
	manage-within = 5m
	# How many factors a subject may hold, recovery codes included.
	max-factors = 10
}
