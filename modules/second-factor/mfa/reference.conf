# The defaults of `@mod/mfa`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
mfa {
	# "required" (the default) asks every login for a counting factor; "optional" only of those who hold one.
	mode = "required"
	# How many factors a subject may hold, recovery codes included.
	max-factors = 10
}
