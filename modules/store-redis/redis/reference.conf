# The defaults of `@mod/redis`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
redis {
	# The Redis server to connect to.
	# url: required
	# What every key the store writes begins with.
	prefix = "store"
	# How long connecting to Redis may take, at least 100ms.
	connect-timeout = 2s
	# How long a confirmation waits for every replica to have a write, from 1ms to 1m.
	replication-timeout = 1s
	# How long one Redis command may take, from 10ms to 1m.
	command-timeout = 1s
	# Required when a space asks for replication or confirmed reads. "replicas": every write must reach the replicas, and Redis itself must refuse writes without them. "none": the operator states there is no failover at all, accepting that a failover would lose writes.
	# replication: optional
	# "none": the operator states the server does not fsync every write, accepting that a crash loses the latest writes, among them spent assertion and proof ids and lockout records. Without it, a durable space needs appendonly yes and appendfsync always.
	# durability: optional
	# The server's maxmemory-policy, as it is set there.
	# server-settings.maxmemory-policy: optional
	# Whether the server keeps an append-only file.
	# server-settings.appendonly: optional
	# How often the server fsyncs its append-only file.
	# server-settings.appendfsync: optional
	# The replicas the server needs before it takes a write.
	# server-settings.min-replicas-to-write: optional
	# How many seconds behind a replica may be and still count for writes.
	# server-settings.min-replicas-max-lag: optional
}
