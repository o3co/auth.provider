# The defaults of `@mod/redis`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
redis {
	# The Redis server to connect to.
	# url: required
	# What every key the store writes begins with.
	prefix = "store"
	# How long connecting to Redis may take, in milliseconds.
	connect-timeout-ms = 2000
	# How long a confirmation waits for every replica to have a write, in milliseconds.
	replication-timeout-ms = 1000
	# How long one Redis command may take, in milliseconds.
	command-timeout-ms = 1000
	# Required when a space asks for replication or confirmed reads. "replicas": every write must reach the replicas, and Redis itself must refuse writes without them. "none": the operator states there is no failover at all, accepting that a failover would lose writes.
	# replication: optional
}
