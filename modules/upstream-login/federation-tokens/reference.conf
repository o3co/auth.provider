# The defaults of `@mod/federation-tokens`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
federation-tokens {
	# A token this close to its end is refreshed before it is handed over, from 0s to 1h.
	refresh-before = 30s
	# The longest a token is taken to live, from 1m to 365d: caps what an upstream says, and stands for an answer that says nothing.
	max-lifetime = 1d
	# How long a refresh's lock lasts unless kept, as it is every half of this while the refresh runs, and how long another request waits for it, from 1s to 1m.
	lock-lifetime = 5s
	# Requests allowed per source in each window.
	requests = 60
	# The window `requests` counts in, from 1s to 1h.
	window = 1m
}
