# The defaults of `@mod/federation`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
federation {
	# Each IdP by name (1 to 32 lowercase letters, digits and `-`, not starting with `-`): its `type`, `upstream-amr` (the upstream's amr values mapped to ours; none by default; mapping one to `mfa`, say, trusts the upstream's claim for that amr and any acr it satisfies, such as `urn:o3co:acr:mfa`) and the type's own settings.
	idps = {}
	# The https URL a login lands on when it named no return target; the public origin's root by default.
	# landing: optional
	# How long a round trip, or a held login's tokens, may wait.
	transaction-seconds = 600
	# Starts and callbacks allowed per source in each window.
	requests = 60
	# The window `requests` counts in.
	window-seconds = 60
}
