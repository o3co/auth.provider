# The defaults of `@mod/federation`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
federation {
	# Each IdP by name (1 to 32 lowercase letters, digits and `-`, not starting with `-`): its `type`, `upstream-amr` (the upstream's amr values mapped to ours; none by default; mapping one to `mfa`, say, trusts the upstream's claim for that amr and any acr it satisfies, such as `urn:o3co:acr:mfa`) and the type's own settings. With none, every login answers not found, and each boot warns `federation.no_idps`.
	idps = {}
	# The https URL a login lands on when it named no return target; the public origin's root by default.
	# landing: optional
	# The page a browser goes to when a gate holds its login, to go on there: on the public origin, as it reads the held login with this deployment's cookies; https, or http on a loopback host. Without it, a held login is answered 403 with the gate's answer.
	# held-page: optional
	# How long a round trip, or a held login's tokens, may wait, from 1m to 1h.
	transaction-lifetime = 10m
	# Starts and callbacks allowed per source in each window.
	requests = 60
	# The window `requests` counts in, from 1s to 1h.
	window = 1m
}
