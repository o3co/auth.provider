# The defaults of `@mod/mfa-witness-http`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
mfa-witness-http {
	# Where whether a subject carries the mark is read. At the same origin as the other two URLs. Plain http is reached only where outbound's policy names it.
	# read-url: required
	# Where the mark is set to a token unless one is set. At the same origin as the other two URLs. Plain http is reached only where outbound's policy names it.
	# enroll-url: required
	# Where the mark is removed. At the same origin as the other two URLs. Plain http is reached only where outbound's policy names it.
	# clear-url: required
	# A bare bearer token (RFC 6750 b64token) of at least 32 bytes of key material, sent on every call.
	# credential: required
	# How long a call may take, from 1ms to 1m, narrowing outbound's cap; a write's deadline is its sending time plus this.
	timeout = 5s
	# The largest answer read, from 1B to 16MiB, narrowing outbound's cap.
	# max-response-size: optional
}
