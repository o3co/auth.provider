# Values that boot this module for a test or a conformance run, never for a deployment.
signer-keys-http {
	issuer = "https://devices.example.invalid"
	keys-url = "https://ledger.example.invalid/signer-keys"
}
outbound.allow += ledger.example.invalid
# jwt-bearer refuses keys contributed for an issuer it does not name.
jwt-bearer.issuers += { issuer = "https://devices.example.invalid", subject = as-is }
