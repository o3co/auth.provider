# The defaults of `@mod/signer-keys-http`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
signer-keys-http {
	# The `iss` it answers for: one of jwt-bearer's `issuers` with no keys of its own.
	# issuer: required
	# Where a signer's keys are looked up. Plain http is reached only where outbound's policy names it.
	# keys-url: required
	# A bare bearer token (RFC 6750 b64token) of at least 32 bytes of key material.
	# credential: optional
	# How long a lookup may take, from 1ms to 1m, narrowing outbound's cap.
	# timeout: optional
	# The largest answer read, from 1B to 16MiB, narrowing outbound's cap.
	# max-response-size: optional
}
