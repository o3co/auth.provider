# The defaults of `@mod/users-http`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
users-http {
	# Where a password is verified; without it, no password matches. Plain http is reached only where outbound's policy names it.
	# verify-url: optional
	# Where a user is looked up by subject; without it, every lookup by subject is unanswerable. Plain http is reached only where outbound's policy names it.
	# subject-url: optional
	# A bare bearer token (RFC 6750 b64token) of at least 32 bytes of key material.
	# credential: optional
	# How long a call may take, from 1ms to 1m, narrowing outbound's cap.
	# timeout: optional
	# The largest answer read, from 1B to 16MiB, narrowing outbound's cap.
	# max-response-size: optional
}
