# Values that boot this module for a test or a conformance run, never for a deployment.
subject-revocation-http {
	credential = TRIAL-FRESH-32-BYTES-BASE64URL
	sources = ["192.0.2.0/24"]
}
# It boots only behind a trusted proxy: one no request comes through, so every source stays as sent.
http.trusted-proxies += "192.0.2.1"
