# Values that boot this module for a test or a conformance run, never for a deployment.
jti-ledger-http {
	issuer = "https://ledgered.example.invalid"
	consume-url = "https://ledger.example.invalid/assertions/consume"
}
outbound.allow += ledger.example.invalid
# jwt-bearer refuses a ledger contributed for an issuer it does not name; its keys at its own host.
jwt-bearer.issuers += { issuer = "https://ledgered.example.invalid", subject = as-is, jwks-uri = "https://ledgered.example.invalid/jwks" }
