# The defaults of `@mod/rp-logout`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
rp-logout {
	# How long a session's clients are kept from a redemption, from 1m to 30d; at least as long as a session lives.
	remember-for = 1d
	# How long an undelivered back-channel notice is tried again, from 1m to 7d.
	notify-within = 1d
	# How often each host sweeps the kept notices, from 1s to 1h.
	sweep-interval = 1m
	# How long a logout that asks the person waits for them, from 1m to 15m: the request the logout carries to the confirmation, and the confirmation page.
	confirm-within = 5m
	# Where a browser's refused logout request is sent, with `error` and `error_description` in its query: an https URL (http only on a loopback host, with `kernel.environment = development`). Without it, every refusal is answered as JSON.
	# error-page: optional
	# Logout requests allowed per source in each window, a GET and a POST together, before any hint is checked.
	requests = 60
	# The window `requests` is counted over, from `1s` to `1d` in whole seconds.
	window = 1m
}
