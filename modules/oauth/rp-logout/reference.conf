# The defaults of `@mod/rp-logout`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
rp-logout {
	# How long a session's clients are kept from a redemption, from 1m to 30d; at least as long as a session lives.
	remember-for = 1d
	# How long an undelivered back-channel notice is tried again, from 1m to 7d.
	notify-within = 1d
	# How often each host sweeps the kept notices, from 1s to 1h.
	sweep-interval = 1m
}
