# The defaults of `@mod/client-assertion`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
client-assertion {
	# The longest lifetime a client assertion may have, in seconds.
	max-lifetime-seconds = 3600
	# How far a client's clock may be off when an assertion's times are checked, in seconds.
	clock-skew-seconds = 30
}
