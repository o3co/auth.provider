# The defaults of `@mod/client-assertion`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
client-assertion {
	# The longest lifetime a client assertion may have, from `1s` to `1d` in whole seconds.
	max-lifetime = 1h
	# How far a client's clock may be off when an assertion's times are checked, from `0s` to `5m` in whole seconds.
	clock-skew = 30s
}
