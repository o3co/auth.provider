# The defaults of `@mod/oidc`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
oidc {
	# How long an ID token lasts: a duration with a unit, e.g. 1h.
	id-token-lifetime = 1h
	# The JWS algorithm ID tokens are signed with, which `keys` must sign with: RS256 unless written. Another warns at each start, as OpenID Connect Discovery 1.0 §3 has RS256 listed.
	id-token-alg = "RS256"
}
