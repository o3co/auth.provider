# The defaults of `@mod/code-grant`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
code-grant {
	# How long a code can be redeemed, from 10s to 10m.
	code-lifetime = 10m
	# How often each host retries the revocations a code that came again left, from 1s to 1h.
	sweep-interval = 30s
	# Seconds; write `code-lifetime` instead.
	# code-seconds: optional
	# Seconds; write `sweep-interval` instead.
	# sweep-seconds: optional
}
