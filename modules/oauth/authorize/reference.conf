# The defaults of `@mod/authorize`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
authorize {
	# The login page, given the return URL as `redirect_to`: an https URL (http only on a loopback host).
	# login-page: required
	# Where a session that falls short of an acr is sent to raise its authentication: an https URL (http only on a loopback host).
	# step-up-page: optional
	# oidc-required refuses a request whose own scope does not name openid, as invalid_scope; dual lets it through with the scope it asks or the client's default.
	oidc-mode = "oidc-required"
	# Requests allowed per source in each window, over both methods together; over it, 429.
	requests = 60
	# The rate limit's window: a duration with a unit, e.g. 1m.
	window = 1m
}
