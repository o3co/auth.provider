# The defaults of `@mod/token-endpoint`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
token-endpoint {
	# Requests allowed per source in each window, before any client is authenticated.
	requests = 60
	# The window requests are counted over, from 1s to 1d.
	window = 1m
}
