# The defaults of `@mod/refresh`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
refresh {
	# How long a refresh token family lives, in seconds. Shorter is only safer, so the floor is a second, which lets tests watch a family run out.
	lifetime-seconds = 86400
	# How often the sweep finishes revocations that stopped halfway, in seconds.
	sweep-seconds = 30
	# Whether a confidential client's family is bound to its sender too. As 0.17's default: a confidential client already proves itself, so only a public one's is bound.
	bind-confidential-clients = false
}
