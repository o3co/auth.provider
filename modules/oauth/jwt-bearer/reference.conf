# The defaults of `@mod/jwt-bearer`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
jwt-bearer {
	# The trusted issuers: each with its public keys (kid, alg, SPKI PEM), its key set's URL at https on its host, or neither, its keys then contributed at `signerKeys`.
	issuers = []
	# Issuers whose assertions another module checks by its own rules, each exactly as sent: their audience is an app, not this server, so RFC 7523 §3 does not hold. Each needs the one module that checks it.
	delegated-issuers = []
	# The longest lifetime an assertion may claim, from `1s` to `1d` in whole seconds.
	max-assertion-lifetime = 1h
	# How far an assertion's times may be off this host's clock, from `0s` to `5m` in whole seconds.
	clock-skew = 30s
}
