# The defaults of `@mod/jwt-bearer`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
jwt-bearer {
	# The trusted issuers: each with its public keys (kid, alg, SPKI PEM), or its key set's URL at https on its host.
	issuers = []
	# The longest lifetime an assertion may claim, in seconds.
	max-assertion-lifetime-seconds = 3600
	# How far an assertion's times may be off this host's clock, in seconds.
	clock-skew-seconds = 30
}
