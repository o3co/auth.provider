# The defaults of `@mod/dpop`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
dpop {
	# The signing algorithms a DPoP proof may use.
	algorithms = ["ES256","ES384","EdDSA","RS256"]
	# How far a proof's `iat` may lie from the clock on either side, from `1s` to `5m` in whole seconds.
	proof-window = 1m
	# Proofs a token's subject may present at resources in each `proofs-window`, one count shared by all its clients, from 1 to 100000.
	proofs = 60
	# The window `proofs` is counted over, from `1s` to `1h` in whole seconds.
	proofs-window = 1m
	# Where a server-provided nonce is asked: never, at the token endpoint, or there and at resources.
	nonce.required = "as"
	# How often the nonce changes, from `1s` to `1h` in whole seconds; one is taken for twice this.
	nonce.ttl = 5m
	# The nonce's key, shared by every instance: base64 of 32 bytes or more; required unless never.
	# nonce.secret: optional
}
