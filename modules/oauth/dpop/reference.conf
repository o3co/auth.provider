# The defaults of `@mod/dpop`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
dpop {
	# The signing algorithms a DPoP proof may use.
	algorithms = ["ES256","ES384","EdDSA","RS256"]
	# How far a proof's `iat` may lie from the clock on either side, in seconds.
	proof-window-seconds = 60
	# Where a server-provided nonce is asked: never, at the token endpoint, or there and at resources.
	nonce.required = "never"
	# How often the nonce changes, in seconds; one is taken for twice this.
	nonce.ttl-seconds = 300
	# The nonce's key, shared by every instance: base64 of 32 bytes or more; required unless never.
	# nonce.secret: optional
}
