# The defaults of `@mod/clients-cimd`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
clients-cimd {
	# The host names a client id's document may be fetched from (.name also takes the names under it); when not empty, only these, and outbound's hosts narrow to them.
	allow = []
	# The host names a client id's document is never fetched from (.name also takes the names under it), checked before allow.
	deny = []
	# The ceiling of scopes such a client may get: a document asking none gets all of them.
	scopes = []
	# The audiences such a client's tokens may name, as the operator allows.
	audiences = []
	# The largest document fetched: a size with a unit, e.g. 5KiB.
	max-size = 5KiB
	# How long a fetch may take: a duration with a unit, e.g. 5s.
	timeout = 5s
	# How long a document is kept: a duration with a unit, e.g. 10m.
	cache-lifetime = 10m
	# How many ids the kept documents, and the kept refusals, each hold at most, from 1 to 100000; past it the one kept longest goes.
	cache-entries = 256
	# How long a refusal is remembered: a duration with a unit, e.g. 1m.
	refused-lifetime = 1m
	# How many fetches may run at once, from 1 to 1024; an id past it finds no client, without waiting.
	max-concurrent = 8
}
