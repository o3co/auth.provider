# The defaults of `@mod/token-control`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
token-control {
	# Requests allowed per source in each window, on each route, before any client is authenticated.
	requests = 60
	# The window `requests` is counted over, from `1s` to `1d` in whole seconds.
	window = 1m
}
