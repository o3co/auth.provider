# The defaults of `@mod/tokens`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
tokens {
	# How long an access token lives, from `1s` to `1d` in whole seconds; `1h` unless set.
	# access-token-lifetime: optional
	# Replaced by `access-token-lifetime`; read until 0.18.0.
	# access-token-lifetime-seconds: optional
	# Whether revoked access tokens are kept in a denylist and refused, or revocation is not supported.
	# revocation: required
	# Stated where no module checks subject revocation on access tokens.
	# subject-check: optional
}
