# The defaults of `@mod/tokens`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
tokens {
	# How long an access token lives, from when it is asked for (the issuance policies' wait included), from `2s` to `1d` in whole seconds.
	access-token-lifetime = 1h
	# Whether revoked access tokens are kept in a denylist and refused, or revocation is not supported.
	# revocation: required
	# How long the issuance policies may take together, from `1s` to `1m`; past it, the issuance is unavailable.
	issuance-timeout = 10s
	# Stated where no module checks subject revocation on access tokens.
	# subject-check: optional
	# added-claims: The limits of the claims a grant adds to an access token, as added-claims reads them, each raised only: one value holds both issuing and reading back, so lowering a raised one leaves the tokens issued while it was raised unreadable until they expire. Raise a value on every instance before any issues under it: an instance on a lower one, 0.19 included, refuses those tokens until they expire.
	# The longest name of an added claim, in code points, from 255 to 1024; raised only. Raise it on every instance before any issues under it: an instance on a lower value, 0.19 included, refuses those tokens until they expire; lowering it leaves the tokens issued under it unreadable until they expire.
	added-claims.name-length = 255
	# The longest string of an added claim, in code points, from 2048 to 8192; raised only. Raise it on every instance before any issues under it: an instance on a lower value, 0.19 included, refuses those tokens until they expire; lowering it leaves the tokens issued under it unreadable until they expire.
	added-claims.string-length = 2048
	# The most members of an object, or values of an array, in added claims, from 256 to 1024; raised only. Raise it on every instance before any issues under it: an instance on a lower value, 0.19 included, refuses those tokens until they expire; lowering it leaves the tokens issued under it unreadable until they expire.
	added-claims.members = 256
	# The most values in one set of added claims, from 1024 to 4096; raised only. Raise it on every instance before any issues under it: an instance on a lower value, 0.19 included, refuses those tokens until they expire; lowering it leaves the tokens issued under it unreadable until they expire.
	added-claims.values = 1024
	# The deepest an added claim nests, its value at depth 1, from 8 to 16; raised only. Raise it on every instance before any issues under it: an instance on a lower value, 0.19 included, refuses those tokens until they expire; lowering it leaves the tokens issued under it unreadable until they expire.
	added-claims.depth = 8
	# The largest set of added claims, as JSON in UTF-8, a size with a unit from 4KiB to 8KiB; raised only. Raise it on every instance before any issues under it: an instance on a lower value, 0.19 included, refuses those tokens until they expire; lowering it leaves the tokens issued under it unreadable until they expire.
	added-claims.size = 4KiB
}
