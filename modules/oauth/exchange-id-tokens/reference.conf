# The defaults of `@mod/exchange-id-tokens`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
exchange-id-tokens {
	# The oldest an id_token may be, from its `iat`, from 1m to 1h.
	max-age = 10m
	# How far an id_token's times may be off this host's clock, from 0s to 5m.
	clock-skew = 30s
	# The upstream's name, by which users finds the account an id_token's `sub` is linked to.
	apple.upstream = "apple"
	# This provider's client IDs, each with the id_tokens it may exchange.
	# apple.clients: optional
	# The upstream's name, by which users finds the account an id_token's `sub` is linked to.
	google.upstream = "google"
	# This provider's client IDs, each with the id_tokens it may exchange.
	# google.clients: optional
}
