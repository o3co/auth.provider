# The defaults of `@mod/device-grant`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
device-grant {
	# The deployment's page where a user enters the code.
	# verification-uri: required
	# Whether to answer also the page's address with the code filled in.
	complete-uri = false
	# How long a device code and its user code live, from `30s` to `1h` in whole seconds.
	code-lifetime = 10m
	# How long a device waits between polls of the token endpoint, from `1s` to `1m` in whole seconds.
	interval = 5s
	# Decisions a subject may try in each window, so codes cannot be guessed.
	attempts = 5
	# The window `attempts` is counted over, from `1m` to `1d` in whole seconds.
	attempts-window = 5m
	# Device authorization requests per source in each window.
	requests = 60
	# The window `requests` is counted over, from `1s` to `1d` in whole seconds.
	window = 1m
}
