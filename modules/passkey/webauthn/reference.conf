# The defaults of `@mod/webauthn`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
webauthn {
	# The relying party ID: each web origin's host, or a domain each one lies under.
	# rp-id: required
	# The relying party's name, as an authenticator shows it.
	# rp-name: required
	# The origins ceremonies may come from, matched exactly: https web origins (http only on localhost), or Android app origins.
	# origins: required
	# The pages that may frame a ceremony; none by default, so any ceremony in a frame is refused.
	top-origins = []
	# How long a ceremony's challenge can be answered, from 10s to 10m.
	challenge-lifetime = 2m
	# Whether the authenticator is asked to verify its user, as WebAuthn says it.
	user-verification = "preferred"
	# The most passkeys a subject may hold, from 1 to 100.
	max-credentials = 10
}
