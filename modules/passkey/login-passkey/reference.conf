# The defaults of `@mod/login-passkey`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
login-passkey {
	# Whether a passkey login whose user was verified proves a second factor too (amr `mfa`).
	counts-as-mfa = true
	# Requests allowed per source in each window, on each of the two routes.
	attempts = 20
	# The window `attempts` is counted over, from 1m to 1d.
	window = 15m
	# `refused-when-held`: a password login of a subject holding a passkey is refused, but in `password-exempt-group`.
	password = "allowed"
	# A group of users whose password logins `refused-when-held` lets through.
	# password-exempt-group: optional
}
