# The defaults of `@mod/mfa-webauthn`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
mfa-webauthn {
	# Whether the authenticator is asked to verify its user, as WebAuthn says it.
	user-verification = "preferred"
	# The name an authenticator shows for an account with no name to show; it names no one.
	display-name = "Account"
}
