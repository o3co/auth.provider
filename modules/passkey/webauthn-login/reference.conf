# The defaults of `@mod/webauthn-login`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
webauthn-login {
	requests = 60
	# The window `requests` is counted over, from 1s to 1d in whole seconds, written with its unit, such as `1m`.
	window = 1m
	# Seconds, read in place of `window`, which replaces it; giving both refuses boot.
	# window-seconds: optional
}
