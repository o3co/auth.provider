# The defaults of `@mod/login-password`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
login-password {
	# Login attempts allowed per source in each window, within bounds that keep guessing slow.
	attempts = 20
	# The window `attempts` is counted over, from 1m to 1d.
	window = 15m
	# Failed attempts allowed at one identifier, from any source, before each next one waits.
	account-attempts = 10
	# How long an identifier's run of failed attempts is remembered, from 1m to 1d.
	account-window = 1h
	# The longest an identifier waits between attempts, from 1s to 1h: the wait doubles to it, never locking out.
	account-max-wait = 5m
	# Seconds; write `window` instead.
	# window-seconds: optional
	# Seconds; write `account-window` instead.
	# account-window-seconds: optional
	# Seconds; write `account-max-wait` instead.
	# account-max-wait-seconds: optional
}
