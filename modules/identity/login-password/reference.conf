# The defaults of `@mod/login-password`'s section, generated by `create-app` from its schema: do not edit; run `pnpm --filter @mod/create-app run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
login-password {
	# Login attempts allowed per source in each window, within bounds that keep guessing slow.
	attempts = 20
	# The window `attempts` is counted over, in seconds.
	window-seconds = 900
	# Failed attempts allowed at one identifier, from any source, before each next one waits.
	account-attempts = 10
	# How long an identifier's run of failed attempts is remembered, in seconds.
	account-window-seconds = 3600
	# The longest an identifier waits between attempts, in seconds: the wait doubles to it, never locking out.
	account-max-wait-seconds = 300
}
