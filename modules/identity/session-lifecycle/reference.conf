# The defaults of `@mod/session-lifecycle`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
session-lifecycle {
	# How long a session lasts, counted from its opening, from 1m to 30d, such as 8h; its cookie lives as long. The lifetime in force decides on each read, so a shorter one ends sessions opened under a longer one.
	lifetime = 1h
	# How often each host goes on with pending closes, from 1s to 1h, such as 1m; a close whose participants keep failing is retried after half its age, at least this, at most an hour.
	sweep-interval = 30s
	# How long an authentication stays recent, from 30s to 1h, such as 10m; the hour is fixed, as a longer "recent" would weaken what it means. Where no entry requirement judges changing credentials (no mfa), a sign-in at a known time must be this recent to do so.
	recent-authentication = 5m
	# attributes: The caps a login's attributes are kept within, as login-attributes reads them; lowering one drops, when an open session's attributes are read back, a value past it.
	# How many groups a login may name, from 1 to 200; more, and the groups are dropped whole.
	attributes.groups-limit = 64
	# The longest group name, in UTF-8 bytes, from 1B to 1KiB; one longer, and the groups are dropped whole.
	attributes.group-limit = 256B
	# The longest picture URL, in UTF-8 bytes, from 1B to 8KiB; one longer is dropped whole.
	attributes.picture-limit = 2KiB
}
