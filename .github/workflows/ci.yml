name: CI

on:
  push:
    branches: [develop, main, 'release/**']
  pull_request:
    branches: [develop, main, 'release/**']
  # Daily audit and conformance (see the `audit` and `conformance` jobs). A
  # `schedule` event runs on the repository's default branch (main) only: the
  # audit reads main, what was released, and the conformance jobs check out
  # develop, which pull requests to develop do not run conformance on. Every
  # other job that builds or tests is gated on the event.
  schedule:
    - cron: '17 3 * * *'
  # A manual run: every job a pull request runs, and the interop jobs (see `interop-due`).
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: every job only checks out and reads this
# repository. release.yml declares its own permissions.
permissions:
  contents: read

# A newer push to a pull request supersedes the run for its older commit; every
# other event gets a group of its own, so no push to develop, main or a release
# branch is cancelled by the next one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything a change must pass on every pull request: typecheck, lint, the
  # unit tests, guard and distribution's checks (`pnpm check`), and the source
  # and history scans.
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      # Each version reports, so a failure on one is told apart from one on both.
      fail-fast: false
      matrix:
        # The lowest version engines admits, and the newest.
        node: ['24', '26']
    steps:
      # First, before anything can fail: this attempt's mark, which a re-run that does not report leaves.
      - name: Mark this attempt
        if: matrix.node == '24'
        env:
          KIND: unit
          MATRIX: ''
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          jq -n --arg run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" --arg job "$GITHUB_JOB" \
            --arg kind "$KIND" --arg matrix "$MATRIX" \
            '{attempted: ({run: $run, attempt: $attempt, job: $job, kind: $kind} + (if $matrix == "" then {} else {matrix: $matrix} end))}' \
            > "$RUNNER_TEMP/evidence/attempted-$GITHUB_JOB.json"
      - uses: actions/checkout@v4
        with:
          # The commit-message scan and the per-commit install check walk the
          # pull request's own commits.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - run: pnpm install --frozen-lockfile
      # The lowest version's run keeps the evidence of the unit tests (spec-checklist's reporter);
      # build-and-test holds both versions to passing.
      - run: pnpm check
        env:
          SPEC_EVIDENCE_DIR: ${{ matrix.node == '24' && format('{0}/evidence', runner.temp) || '' }}
      - name: Keep the evidence of the tests that ran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-checks-${{ matrix.node }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 30
      # The API site builds from the bundles as they stand, before a release
      # does it from what it published; nothing is written to the pages.
      - name: The API site builds from the bundles
        if: matrix.node == '26'
        shell: bash
        run: |
          set -euo pipefail
          pnpm bundles
          version="$(node -p "require('./package.json').version.split('-')[0]")"
          pnpm api-docs link "$PWD/dist/bundles" "$RUNNER_TEMP/api-project"
          pnpm api-docs build "$RUNNER_TEMP/api-project" "$RUNNER_TEMP/api-site" "$version"
      - name: No cross-project references or agent-workspace paths
        run: |
          set -euo pipefail
          # The pattern is assembled from parts so this file does not match itself.
          PAT="$(printf '%s' 'dpla' 'as|@dpla' 'asio')"
          PATHS=(modules docs .github README.md)
          for p in "${PATHS[@]}"; do
            if [ -e "$p" ] && grep -rEq "$PAT" "$p"; then
              echo "ERROR: prohibited cross-project reference in $p"
              grep -rnE "$PAT" "$p"
              exit 1
            fi
          done
          echo "OK: no cross-project references in scanned paths"

          # Nor a path into an agent's workspace: none of them is in this
          # repository, so a link to one is dead for every reader. `git grep`
          # reads tracked files only.
          WORKSPACE_PAT="$(printf '%s' '\.clau' 'de/|superpowers/' '(specs|plans)/|/Volu' 'mes/Work' 'space/')"
          set +e
          HITS="$(git grep -nIE "$WORKSPACE_PAT")"
          STATUS=$?
          set -e
          case "$STATUS" in
            0)
              echo "ERROR: a path into an agent workspace outside the repository — cite a PR or issue number instead:"
              echo "$HITS"
              exit 1
              ;;
            1) echo "OK: no agent-workspace paths in tracked files" ;;
            *)
              echo "ERROR: git grep failed (status ${STATUS}); nothing was scanned"
              exit 1
              ;;
          esac
      - name: No cross-project references or agent-workspace paths in PR commit messages
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PAT="$(printf '%s' 'dpla' 'as|@dpla' 'asio')"
          if [ -z "${HEAD_SHA:-}" ] || [ -z "${GITHUB_BASE_REF:-}" ]; then
            echo "PR head SHA or base branch missing; skipping commit-message scan."
            exit 0
          fi
          # The pull request's own commits: those the head has and the base
          # branch, as it stands now, does not.
          git fetch --no-tags --quiet origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "ERROR: commit $HEAD_SHA not present in checkout; cannot scan PR commit messages."
            exit 1
          fi
          RANGE=("$HEAD_SHA" --not "origin/${GITHUB_BASE_REF}")
          MATCHES="$(git log --format='%H%n%B%n---' "${RANGE[@]}" | grep -E "$PAT" || true)"
          if [ -n "$MATCHES" ]; then
            echo "ERROR: prohibited cross-project reference in PR commit messages:"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK: no cross-project references in PR commit messages"
          WORKSPACE_PAT="$(printf '%s' '\.clau' 'de/|superpowers/' '(specs|plans)/|/Volu' 'mes/Work' 'space/')"
          FOUND=0
          for sha in $(git rev-list "${RANGE[@]}"); do
            if HITS="$(git log -1 --format=%B "$sha" | grep -nE "$WORKSPACE_PAT")"; then
              echo "ERROR: $(git log -1 --format='%h %s' "$sha") — its message names a path into an agent workspace:"
              echo "$HITS"
              FOUND=1
            fi
          done
          if [ "$FOUND" -ne 0 ]; then
            echo "Reword those commits: cite a PR or issue number instead."
            exit 1
          fi
          echo "OK: no agent-workspace paths in PR commit messages"
      - name: Every commit in the PR installs (package.json parses, no conflict markers)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/check-commit-integrity.sh "$BASE_SHA" "$HEAD_SHA"

  # The tests that need Docker (Redis, and the generated apps' full runs).
  integration:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      # Each version reports, so a failure on one is told apart from one on both.
      fail-fast: false
      matrix:
        # The lowest version engines admits, and the newest.
        node: ['24', '26']
    steps:
      # First, before anything can fail: this attempt's mark, which a re-run that does not report leaves.
      - name: Mark this attempt
        if: matrix.node == '24'
        env:
          KIND: integration
          MATRIX: ''
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          jq -n --arg run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" --arg job "$GITHUB_JOB" \
            --arg kind "$KIND" --arg matrix "$MATRIX" \
            '{attempted: ({run: $run, attempt: $attempt, job: $job, kind: $kind} + (if $matrix == "" then {} else {matrix: $matrix} end))}' \
            > "$RUNNER_TEMP/evidence/attempted-$GITHUB_JOB.json"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
        env:
          SPEC_EVIDENCE_DIR: ${{ matrix.node == '24' && format('{0}/evidence', runner.temp) || '' }}
      - name: Keep the evidence of the tests that ran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-integration-${{ matrix.node }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 30

  # The required check on every branch it guards: both jobs above passed, on
  # every Node version of their matrix.
  # Renaming this job leaves branch protection waiting for a check that never
  # reports.
  build-and-test:
    if: always() && github.event_name != 'schedule'
    needs: [checks, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Both checks passed
        env:
          CHECKS: ${{ needs.checks.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          echo "checks: ${CHECKS}, integration: ${INTEGRATION}"
          [ "$CHECKS" = success ] && [ "$INTEGRATION" = success ]

  # On a push to develop: whether five merges have landed since the last
  # conformance run on develop (pull requests to develop skip conformance).
  # When they have, the conformance jobs below run on this push; the daily run
  # covers develop on quieter days.
  conformance-due:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read which earlier runs on develop ran conformance.
      actions: read
    outputs:
      due: ${{ steps.count.outputs.due }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: count
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVERY: 5
        run: |
          set -euo pipefail
          last=""
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=develop&event=push&status=completed&per_page=50" --jq '.workflow_runs[].id'); do
            ran=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" --jq '[.jobs[] | select(.name == "conformance" and (.conclusion == "success" or .conclusion == "failure"))] | length')
            if [ "$ran" != 0 ]; then
              last=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)
              break
            fi
          done
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null; then
            merges=$(git rev-list --first-parent --count "$last..$GITHUB_SHA")
          else
            merges=$EVERY
          fi
          echo "merges on develop since the last conformance run: $merges"
          if [ "$merges" -ge "$EVERY" ]; then due=true; else due=false; fi
          echo "due=$due" >> "$GITHUB_OUTPUT"

  # On a pull request to main (a release), on the release branches, once a day
  # on develop, and on a push to develop every five merges: the new system's
  # conformance and the legacy system's (0.17.0, built from this repository's
  # own v0.17.0 tag), then the scenes on each pattern's app. A release is tested
  # before it reaches main, so the push to main does not run it again. Each area
  # and each pattern runs in a job of its own; `conformance` passes only once
  # all of them have.
  #
  # What the jobs run is read from the runs spec-checklist lists (`run plan`), the
  # same runs whose evidence compliance expects: an area is a package with a
  # `conformance` script, a pattern a pattern run `conformance` prints. The plan
  # also fixes the one commit every conformance job and compliance check out, so a
  # daily run's jobs test the same develop commit.
  conformance-plan:
    needs: conformance-due
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) || (github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.conformance-due.outputs.due == 'true')) }}
    runs-on: ubuntu-latest
    outputs:
      areas: ${{ steps.plan.outputs.areas }}
      patterns: ${{ steps.plan.outputs.patterns }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The daily run tests develop, where merged work waits for the next release.
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          areas=$(pnpm --silent --filter @mod/spec-checklist run plan area)
          patterns=$(pnpm --silent --filter @mod/spec-checklist run plan pattern)
          {
            echo "areas=$areas"
            echo "patterns=$patterns"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  # One area: its scenes on the new system, then on the legacy one. A scene the
  # legacy system cannot be set up for, or answers by a decided difference, is
  # skipped; any other fails.
  conformance-area:
    needs: conformance-plan
    # A skipped conformance-due above would otherwise skip this job too.
    if: ${{ !cancelled() && needs.conformance-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.conformance-plan.outputs.areas) }}
    env:
      LEGACY_SOURCE: ${{ github.workspace }}
      LEGACY_BRANCH: v0.17.0
    steps:
      # First, before anything can fail: this attempt's mark, which a re-run that does not report leaves.
      - name: Mark this attempt
        env:
          KIND: area
          MATRIX: ${{ matrix.area }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          jq -n --arg run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" --arg job "$GITHUB_JOB" \
            --arg kind "$KIND" --arg matrix "$MATRIX" \
            '{attempted: ({run: $run, attempt: $attempt, job: $job, kind: $kind} + (if $matrix == "" then {} else {matrix: $matrix} end))}' \
            > "$RUNNER_TEMP/evidence/attempted-$GITHUB_JOB.json"
      # The runner context is not available in a job's env, so the legacy
      # build's directory is set here.
      - run: echo "LEGACY_DIR=$RUNNER_TEMP/legacy-0.17.0" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          # The commit the plan fixed: on the daily run, develop as the plan found it.
          ref: ${{ needs.conformance-plan.outputs.sha }}
          # The legacy build clones the v0.17.0 tag from this checkout.
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - name: Cache the legacy build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/legacy-0.17.0
          key: legacy-0.17.0-${{ hashFiles('modules/tooling/conformance-legacy/scripts/**') }}
      - run: pnpm install --frozen-lockfile
      - name: Build the legacy system
        run: |
          if [ ! -d "$LEGACY_DIR" ]; then
            pnpm --filter @mod/conformance-legacy run prepare-legacy
          fi
      - name: Conformance on the new system
        env:
          SPEC_EVIDENCE_DIR: ${{ runner.temp }}/evidence
        run: pnpm --filter "${{ matrix.area }}" run conformance
      # Runs where the new system failed too, so each target reports; the legacy one's evidence is
      # kept but not counted.
      - name: Conformance on the legacy system
        if: ${{ !cancelled() }}
        env:
          CONFORMANCE_TARGET: legacy
          SPEC_EVIDENCE_DIR: ${{ runner.temp }}/evidence
        run: pnpm --filter "${{ matrix.area }}" run conformance
      - name: Keep the evidence of the tests that ran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-area-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 30

  # One pattern's app, on each area it composes.
  conformance-pattern:
    needs: conformance-plan
    # A skipped conformance-due above would otherwise skip this job too.
    if: ${{ !cancelled() && needs.conformance-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pattern: ${{ fromJSON(needs.conformance-plan.outputs.patterns) }}
    steps:
      # First, before anything can fail: this attempt's mark, which a re-run that does not report leaves.
      - name: Mark this attempt
        env:
          KIND: pattern
          MATRIX: ${{ matrix.pattern }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          jq -n --arg run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" --arg job "$GITHUB_JOB" \
            --arg kind "$KIND" --arg matrix "$MATRIX" \
            '{attempted: ({run: $run, attempt: $attempt, job: $job, kind: $kind} + (if $matrix == "" then {} else {matrix: $matrix} end))}' \
            > "$RUNNER_TEMP/evidence/attempted-$GITHUB_JOB.json"
      - uses: actions/checkout@v4
        with:
          # The commit the plan fixed: on the daily run, develop as the plan found it.
          ref: ${{ needs.conformance-plan.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm conformance:patterns "${{ matrix.pattern }}"
        env:
          # Where the runner keeps a failed area's whole output (output.log), so the step below finds it.
          TMPDIR: ${{ runner.temp }}
          # Each area's run on the pattern's app inherits it and reports as `<area>@<pattern>`.
          SPEC_EVIDENCE_DIR: ${{ runner.temp }}/evidence
      - name: Keep the output of each area that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-output-${{ matrix.pattern }}
          path: ${{ runner.temp }}/conformance-*/output.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep the evidence of the tests that ran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-pattern-${{ matrix.pattern }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 30

  # Whether the interop jobs run, what they run and on which commit. They run on a pull request to
  # main, on the release branches, on the daily run (develop) and by hand, and before a merge to
  # develop where the pull request touches what they test with: the harnesses, the shared front and
  # tunnel, the conformance driver, the checklist, and the pins they hold (the suite's in
  # interop-oidf, the libraries' in interop-clients). Not on a push to develop.
  interop-due:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    outputs:
      oidf: ${{ steps.due.outputs.oidf }}
      clients: ${{ steps.due.outputs.clients }}
      oidf-plans: ${{ steps.plan.outputs.oidf-plans }}
      libraries: ${{ steps.plan.outputs.libraries }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The daily run tests develop; a pull request's diff needs its base.
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
          fetch-depth: 0
      - id: due
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ] || [ "$BASE" = main ]; then
            echo "oidf=true" >> "$GITHUB_OUTPUT"
            echo "clients=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          touches() { grep -qE "$1" <<<"$changed" && echo true || echo false; }
          shared='^modules/tooling/(conformance-front|conformance-tunnel|spec-checklist)/'
          echo "oidf=$(touches "^modules/tooling/(interop-oidf|conformance)/|$shared")" >> "$GITHUB_OUTPUT"
          echo "clients=$(touches "^modules/tooling/interop-clients/|$shared")" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "oidf-plans=$(pnpm --silent --filter @mod/spec-checklist run plan oidf-plan)"
            echo "libraries=$(pnpm --silent --filter @mod/spec-checklist run plan library)"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  # One client library: its adapter, built from the library's registry, runs each flow it runs
  # first-class against the provider (interop-clients). On a pull request to main, the release
  # branches and the daily run on develop; not on develop's every-five-merges run.
  interop-clients:
    needs: interop-due
    if: ${{ !cancelled() && needs.interop-due.outputs.clients == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        library: ${{ fromJSON(needs.interop-due.outputs.libraries) }}
    steps:
      # First, before anything can fail: this attempt's mark, which a re-run that does not report leaves.
      - name: Mark this attempt
        env:
          KIND: library
          MATRIX: ${{ matrix.library }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          jq -n --arg run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" --arg job "$GITHUB_JOB" \
            --arg kind "$KIND" --arg matrix "$MATRIX" \
            '{attempted: ({run: $run, attempt: $attempt, job: $job, kind: $kind} + (if $matrix == "" then {} else {matrix: $matrix} end))}' \
            > "$RUNNER_TEMP/evidence/attempted-$GITHUB_JOB.json"
      - uses: actions/checkout@v4
        with:
          # The commit interop-due fixed: on the daily run, develop as it found it.
          ref: ${{ needs.interop-due.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The JDK and Maven's cache, for the adapters Maven builds; the jars are checked against their pins.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: modules/tooling/interop-clients/adapters/*/pom.xml
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mod/interop-clients run library "${{ matrix.library }}"
        env:
          SPEC_EVIDENCE_DIR: ${{ runner.temp }}/evidence
      - name: Keep the evidence of the tests that ran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-library-${{ matrix.library }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 30

  # One plan of the OpenID Foundation's conformance suite against the provider (interop-oidf): the
  # suite at its pinned version in Docker, the simple-web pattern's app behind the harness's https
  # front. Its result is "OIDF (PKCE adaptation)", never a certification.
  interop-oidf:
    needs: interop-due
    if: ${{ !cancelled() && needs.interop-due.outputs.oidf == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        plan: ${{ fromJSON(needs.interop-due.outputs.oidf-plans) }}
    steps:
      # First, before anything can fail: this attempt's mark, which a re-run that does not report leaves.
      - name: Mark this attempt
        env:
          KIND: oidf-plan
          MATRIX: ${{ matrix.plan }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          jq -n --arg run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" --arg job "$GITHUB_JOB" \
            --arg kind "$KIND" --arg matrix "$MATRIX" \
            '{attempted: ({run: $run, attempt: $attempt, job: $job, kind: $kind} + (if $matrix == "" then {} else {matrix: $matrix} end))}' \
            > "$RUNNER_TEMP/evidence/attempted-$GITHUB_JOB.json"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.interop-due.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The suite's scripts run on a Python of their own, made from this one.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mod/interop-oidf run plan "${{ matrix.plan }}"
        env:
          SPEC_EVIDENCE_DIR: ${{ runner.temp }}/evidence
          OIDF_ARTIFACTS_DIR: ${{ runner.temp }}/oidf
      # The harness stops the suite however a run ends; this stops one a killed run left.
      - name: Stop any suite left running
        if: always()
        run: |
          for project in $(docker compose ls --all --quiet --filter name=o3co-oidf); do
            docker compose -p "$project" down --volumes --remove-orphans || true
          done
      - name: Keep the evidence of the tests that ran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-oidf-plan-${{ matrix.plan }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 30
      # The runner's output, the suite's export and logs, each test's log, the front's log, what the shim
      # added, and the pages the suite left for a person's review: kept on every run, a passing one too,
      # for the review a release needs.
      - name: Keep the run's records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oidf-records-${{ matrix.plan }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oidf
          if-no-files-found: ignore
          retention-days: 30

  # The check required of a release: every area and every pattern passed.
  conformance:
    needs: [conformance-due, conformance-plan, conformance-area, conformance-pattern]
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) || (github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.conformance-due.outputs.due == 'true'))
    runs-on: ubuntu-latest
    steps:
      - name: Every area and every pattern passed
        run: |
          for result in "${{ needs.conformance-plan.result }}" "${{ needs.conformance-area.result }}" "${{ needs.conformance-pattern.result }}"; do
            [ "$result" = success ] || { echo "a conformance job ended $result"; exit 1; }
          done

  # The check required of a release: every interop job that was due passed (the OIDF suite's plans,
  # the client libraries). A job that was due and was skipped or cancelled fails it.
  interop:
    needs: [interop-due, interop-oidf, interop-clients]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')))
    runs-on: ubuntu-latest
    steps:
      - name: Every interop job that was due passed
        env:
          DUE: ${{ needs.interop-due.result }}
          OIDF_DUE: ${{ needs.interop-due.outputs.oidf }}
          OIDF: ${{ needs.interop-oidf.result }}
          CLIENTS_DUE: ${{ needs.interop-due.outputs.clients }}
          CLIENTS: ${{ needs.interop-clients.result }}
        run: |
          [ "$DUE" = success ] || { echo "interop-due ended $DUE"; exit 1; }
          # Each interop job beside whether it was due: a job a later change adds goes here too.
          for job in "oidf $OIDF_DUE $OIDF" "clients $CLIENTS_DUE $CLIENTS"; do
            read -r name due result <<<"$job"
            if [ "$due" = true ] && [ "$result" != success ]; then echo "interop-$name was due and ended $result"; exit 1; fi
          done

  # On a pull request to main and on the release branches: what a release would publish.
  # `pnpm release:check` packs every bundle and the entrance as the release
  # does, the index sealed, makes an app of each pattern from them, installs it
  # from the tarballs alone, type-checks and boots it; then composes a package
  # outside the release from a registry of its own and checks the app is held
  # to what the release sealed. The tarballs are then checked to ship the root
  # LICENSE.
  release-check:
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    steps:
      # First, before anything can fail: this attempt's mark, which a re-run that does not report leaves.
      - name: Mark this attempt
        env:
          KIND: release
          MATRIX: ''
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          jq -n --arg run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" --arg job "$GITHUB_JOB" \
            --arg kind "$KIND" --arg matrix "$MATRIX" \
            '{attempted: ({run: $run, attempt: $attempt, job: $job, kind: $kind} + (if $matrix == "" then {} else {matrix: $matrix} end))}' \
            > "$RUNNER_TEMP/evidence/attempted-$GITHUB_JOB.json"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - name: Each tarball ships the root LICENSE
        run: |
          set -euo pipefail
          pnpm bundles
          .github/scripts/pack-published.sh "$RUNNER_TEMP/tarballs"
          .github/scripts/check-tarball-license.sh "$RUNNER_TEMP/tarballs" LICENSE
      # The recipes written against the published packages, built and run from the tarballs just packed.
      - name: The recipes against the packed release
        env:
          RECIPES_TARBALLS: ${{ runner.temp }}/tarballs
          SPEC_EVIDENCE_DIR: ${{ runner.temp }}/evidence
        run: pnpm --filter @mod/conformance-recipes run external
      - name: Keep the evidence of the tests that ran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-release-check-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 30

  # What this run's tests proved of the checklist's items (spec-checklist's `compliance`): it reads
  # every job's evidence, keeps this commit and run's, and tells each item's status and the expected
  # runs that did not report. It runs after every job, whatever they ended; on a pull request to main
  # and on the release branches it fails where an expected run did not report or an item is
  # failed, incomplete or unverified, and elsewhere it only tells.
  compliance:
    needs: [checks, integration, conformance-plan, conformance-area, conformance-pattern, interop-due, interop-oidf, interop-clients, release-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the conformance and interop jobs tested, where they ran; else the event's.
          ref: ${{ needs.conformance-plan.outputs.sha || needs.interop-due.outputs.sha || '' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      # Each job's evidence in a directory of its own, so no two reports share a path.
      - uses: actions/download-artifact@v4
        with:
          pattern: evidence-*
          path: ${{ runner.temp }}/evidence
      - name: Each item's status from this run's evidence
        env:
          # A release's run fails where a job it needs did not succeed, even one that ended before it marked its attempt.
          NEEDS: ${{ toJSON(needs) }}
          RELEASE: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          release=""
          if [ "$RELEASE" = true ]; then release=--release; fi
          status=0
          if [ "$RELEASE" = true ]; then
            unsucceeded=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$NEEDS")
            if [ -n "$unsucceeded" ]; then
              echo "jobs this release needs did not succeed:"
              echo "$unsucceeded"
              status=1
            fi
          fi
          pnpm --silent --filter @mod/spec-checklist run compliance "$RUNNER_TEMP/evidence" $release > "$RUNNER_TEMP/compliance.out" || status=$?
          cat "$RUNNER_TEMP/compliance.out" >> "$GITHUB_STEP_SUMMARY"
          # The summary over every specification, from the checklist alone, which the repository does not keep.
          pnpm --silent --filter @mod/spec-checklist run summary > "$RUNNER_TEMP/evidence/summary.md"
          { echo; echo "## The checklist by specification and by role"; echo; cat "$RUNNER_TEMP/evidence/summary.md"; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Keep the table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance
          path: |
            ${{ runner.temp }}/evidence/compliance.json
            ${{ runner.temp }}/evidence/compliance.md
            ${{ runner.temp }}/evidence/summary.md
          if-no-files-found: ignore
          retention-days: 90

  # Daily on the default branch, and on every push: known vulnerabilities in
  # what an app installs.
  audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=low
