name: CI

on:
  push:
    branches: [develop, main, 'release/**']
  pull_request:
    branches: [develop, main, 'release/**']
  # Daily audit and conformance (see the `audit` and `conformance` jobs). A
  # `schedule` event runs on the repository's default branch (main) only: the
  # audit reads main, what was released, and the conformance jobs check out
  # develop, which pull requests to develop do not run conformance on. Every
  # other job that builds or tests is gated on the event.
  schedule:
    - cron: '17 3 * * *'

# Least privilege for GITHUB_TOKEN: every job only checks out and reads this
# repository. release.yml declares its own permissions.
permissions:
  contents: read

# A newer push to a pull request supersedes the run for its older commit; every
# other event gets a group of its own, so no push to develop, main or a release
# branch is cancelled by the next one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything a change must pass on every pull request: typecheck, lint, the
  # unit tests, guard and distribution's checks (`pnpm check`), and the source
  # and history scans.
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      # Each version reports, so a failure on one is told apart from one on both.
      fail-fast: false
      matrix:
        # The lowest version engines admits, and the newest.
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit-message scan and the per-commit install check walk the
          # pull request's own commits.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The API site builds from the bundles as they stand, before a release
      # does it from what it published; nothing is written to the pages.
      - name: The API site builds from the bundles
        if: matrix.node == '26'
        shell: bash
        run: |
          set -euo pipefail
          pnpm bundles
          version="$(node -p "require('./package.json').version.split('-')[0]")"
          pnpm api-docs link "$PWD/dist/bundles" "$RUNNER_TEMP/api-project"
          pnpm api-docs build "$RUNNER_TEMP/api-project" "$RUNNER_TEMP/api-site" "$version"
      - name: No cross-project references or agent-workspace paths
        run: |
          set -euo pipefail
          # The pattern is assembled from parts so this file does not match itself.
          PAT="$(printf '%s' 'dpla' 'as|@dpla' 'asio')"
          PATHS=(modules docs .github README.md)
          for p in "${PATHS[@]}"; do
            if [ -e "$p" ] && grep -rEq "$PAT" "$p"; then
              echo "ERROR: prohibited cross-project reference in $p"
              grep -rnE "$PAT" "$p"
              exit 1
            fi
          done
          echo "OK: no cross-project references in scanned paths"

          # Nor a path into an agent's workspace: none of them is in this
          # repository, so a link to one is dead for every reader. `git grep`
          # reads tracked files only.
          WORKSPACE_PAT="$(printf '%s' '\.clau' 'de/|superpowers/' '(specs|plans)/|/Volu' 'mes/Work' 'space/')"
          set +e
          HITS="$(git grep -nIE "$WORKSPACE_PAT")"
          STATUS=$?
          set -e
          case "$STATUS" in
            0)
              echo "ERROR: a path into an agent workspace outside the repository — cite a PR or issue number instead:"
              echo "$HITS"
              exit 1
              ;;
            1) echo "OK: no agent-workspace paths in tracked files" ;;
            *)
              echo "ERROR: git grep failed (status ${STATUS}); nothing was scanned"
              exit 1
              ;;
          esac
      - name: No cross-project references or agent-workspace paths in PR commit messages
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PAT="$(printf '%s' 'dpla' 'as|@dpla' 'asio')"
          if [ -z "${HEAD_SHA:-}" ] || [ -z "${GITHUB_BASE_REF:-}" ]; then
            echo "PR head SHA or base branch missing; skipping commit-message scan."
            exit 0
          fi
          # The pull request's own commits: those the head has and the base
          # branch, as it stands now, does not.
          git fetch --no-tags --quiet origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "ERROR: commit $HEAD_SHA not present in checkout; cannot scan PR commit messages."
            exit 1
          fi
          RANGE=("$HEAD_SHA" --not "origin/${GITHUB_BASE_REF}")
          MATCHES="$(git log --format='%H%n%B%n---' "${RANGE[@]}" | grep -E "$PAT" || true)"
          if [ -n "$MATCHES" ]; then
            echo "ERROR: prohibited cross-project reference in PR commit messages:"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK: no cross-project references in PR commit messages"
          WORKSPACE_PAT="$(printf '%s' '\.clau' 'de/|superpowers/' '(specs|plans)/|/Volu' 'mes/Work' 'space/')"
          FOUND=0
          for sha in $(git rev-list "${RANGE[@]}"); do
            if HITS="$(git log -1 --format=%B "$sha" | grep -nE "$WORKSPACE_PAT")"; then
              echo "ERROR: $(git log -1 --format='%h %s' "$sha") — its message names a path into an agent workspace:"
              echo "$HITS"
              FOUND=1
            fi
          done
          if [ "$FOUND" -ne 0 ]; then
            echo "Reword those commits: cite a PR or issue number instead."
            exit 1
          fi
          echo "OK: no agent-workspace paths in PR commit messages"
      - name: Every commit in the PR installs (package.json parses, no conflict markers)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/check-commit-integrity.sh "$BASE_SHA" "$HEAD_SHA"

  # The tests that need Docker (Redis, and the generated apps' full runs).
  integration:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      # Each version reports, so a failure on one is told apart from one on both.
      fail-fast: false
      matrix:
        # The lowest version engines admits, and the newest.
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  # The required check on every branch it guards: both jobs above passed, on
  # every Node version of their matrix.
  # Renaming this job leaves branch protection waiting for a check that never
  # reports.
  build-and-test:
    if: always() && github.event_name != 'schedule'
    needs: [checks, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Both checks passed
        env:
          CHECKS: ${{ needs.checks.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          echo "checks: ${CHECKS}, integration: ${INTEGRATION}"
          [ "$CHECKS" = success ] && [ "$INTEGRATION" = success ]

  # On a push to develop: whether five merges have landed since the last
  # conformance run on develop (pull requests to develop skip conformance).
  # When they have, the conformance jobs below run on this push; the daily run
  # covers develop on quieter days.
  conformance-due:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read which earlier runs on develop ran conformance.
      actions: read
    outputs:
      due: ${{ steps.count.outputs.due }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: count
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVERY: 5
        run: |
          set -euo pipefail
          last=""
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=develop&event=push&status=completed&per_page=50" --jq '.workflow_runs[].id'); do
            ran=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" --jq '[.jobs[] | select(.name == "conformance" and (.conclusion == "success" or .conclusion == "failure"))] | length')
            if [ "$ran" != 0 ]; then
              last=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)
              break
            fi
          done
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null; then
            merges=$(git rev-list --first-parent --count "$last..$GITHUB_SHA")
          else
            merges=$EVERY
          fi
          echo "merges on develop since the last conformance run: $merges"
          if [ "$merges" -ge "$EVERY" ]; then due=true; else due=false; fi
          echo "due=$due" >> "$GITHUB_OUTPUT"

  # On a pull request to main (a release), on the release branches, once a day
  # on develop, and on a push to develop every five merges: the new system's
  # conformance and the legacy system's (0.17.0, built from this repository's
  # own v0.17.0 tag), then the scenes on each pattern's app. A release is tested
  # before it reaches main, so the push to main does not run it again. Each area
  # and each pattern runs in a job of its own; `conformance` passes only once
  # all of them have.
  #
  # What the jobs run, read from the repository: an area is a package with a
  # `conformance` script, and a pattern is a run `patterns --list` names.
  conformance-plan:
    needs: conformance-due
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) || (github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.conformance-due.outputs.due == 'true')) }}
    runs-on: ubuntu-latest
    outputs:
      areas: ${{ steps.plan.outputs.areas }}
      patterns: ${{ steps.plan.outputs.patterns }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The daily run tests develop, where merged work waits for the next release.
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          areas=$(jq -c -s 'map(select(.scripts.conformance) | .name)' modules/*/*/package.json)
          patterns=$(pnpm --silent --filter @mod/conformance run patterns --list)
          echo "areas=$areas" >> "$GITHUB_OUTPUT"
          echo "patterns=$patterns" >> "$GITHUB_OUTPUT"

  # One area: its scenes on the new system, then on the legacy one. A scene the
  # legacy system cannot be set up for, or answers by a decided difference, is
  # skipped; any other fails.
  conformance-area:
    needs: conformance-plan
    # A skipped conformance-due above would otherwise skip this job too.
    if: ${{ !cancelled() && needs.conformance-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.conformance-plan.outputs.areas) }}
    env:
      LEGACY_SOURCE: ${{ github.workspace }}
      LEGACY_BRANCH: v0.17.0
    steps:
      # The runner context is not available in a job's env, so the legacy
      # build's directory is set here.
      - run: echo "LEGACY_DIR=$RUNNER_TEMP/legacy-0.17.0" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          # The daily run tests develop, where merged work waits for the next release.
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
          # The legacy build clones the v0.17.0 tag from this checkout.
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - name: Cache the legacy build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/legacy-0.17.0
          key: legacy-0.17.0-${{ hashFiles('modules/tooling/conformance-legacy/scripts/**') }}
      - run: pnpm install --frozen-lockfile
      - name: Build the legacy system
        run: |
          if [ ! -d "$LEGACY_DIR" ]; then
            pnpm --filter @mod/conformance-legacy run prepare-legacy
          fi
      - name: Conformance on the new system
        run: pnpm --filter "${{ matrix.area }}" run conformance
      - name: Conformance on the legacy system
        env:
          CONFORMANCE_TARGET: legacy
        run: pnpm --filter "${{ matrix.area }}" run conformance

  # One pattern's app, on each area it composes.
  conformance-pattern:
    needs: conformance-plan
    # A skipped conformance-due above would otherwise skip this job too.
    if: ${{ !cancelled() && needs.conformance-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pattern: ${{ fromJSON(needs.conformance-plan.outputs.patterns) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The daily run tests develop, where merged work waits for the next release.
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm conformance:patterns "${{ matrix.pattern }}"

  # The check required of a release: every area and every pattern passed.
  conformance:
    needs: [conformance-due, conformance-plan, conformance-area, conformance-pattern]
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) || (github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.conformance-due.outputs.due == 'true'))
    runs-on: ubuntu-latest
    steps:
      - name: Every area and every pattern passed
        run: |
          for result in "${{ needs.conformance-plan.result }}" "${{ needs.conformance-area.result }}" "${{ needs.conformance-pattern.result }}"; do
            [ "$result" = success ] || { echo "a conformance job ended $result"; exit 1; }
          done

  # On a pull request to main and on the release branches: what a release would publish.
  # `pnpm release:check` packs every bundle and the entrance as the release
  # does, the index sealed, makes an app of each pattern from them, installs it
  # from the tarballs alone, type-checks and boots it; then composes a package
  # outside the release from a registry of its own and checks the app is held
  # to what the release sealed. The tarballs are then checked to ship the root
  # LICENSE.
  release-check:
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - name: Each tarball ships the root LICENSE
        run: |
          set -euo pipefail
          pnpm bundles
          .github/scripts/pack-published.sh "$RUNNER_TEMP/tarballs"
          .github/scripts/check-tarball-license.sh "$RUNNER_TEMP/tarballs" LICENSE
      # The recipes written against the published packages, built and run from the tarballs just packed.
      - name: The recipes against the packed release
        env:
          RECIPES_TARBALLS: ${{ runner.temp }}/tarballs
        run: pnpm --filter @mod/conformance-recipes run external

  # Daily on the default branch, and on every push: known vulnerabilities in
  # what an app installs.
  audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=low
