name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('**/package.json') }}
          restore-keys: pnpm-store-

      - run: pnpm install
      - run: pnpm run lint
      - run: pnpm run build
      - name: Check vendor names are not leaked into public .d.ts
        run: |
          set -euo pipefail
          VENDOR_NAMES='arctic|openid-client|oauth4webapi|passport'
          LEAKED=$(find packages/*/dist \( -name '*.d.ts' -o -name '*.d.mts' \) -exec grep -l -E "$VENDOR_NAMES" {} \; 2>/dev/null || true)
          if [ -n "$LEAKED" ]; then
            echo "::error::Vendor names leaked into the following public .d.ts files:"
            echo "$LEAKED" | while read -r f; do
              echo "---"
              echo "file: $f"
              grep -n -E "$VENDOR_NAMES" "$f" || true
            done
            exit 1
          fi
          echo "No vendor name leaks found in public .d.ts."
      - run: pnpm -r --if-present run typecheck
      - run: pnpm run test
