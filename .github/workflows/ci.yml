name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed by the "No cross-project references in PR commit
          # messages" step below (it walks BASE..HEAD on the PR branch). Other
          # steps don't depend on history depth.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit
      - run: pnpm run lint
      - run: pnpm run build
      - name: Vendor leak guard
        run: |
          set -euo pipefail
          # Match only module-import occurrences: `import ... from "vendor"` or `require("vendor")`.
          # JSDoc prose mentioning vendor names is allowed (it's documentation, not a type leak).
          VENDOR_NAMES='arctic|openid-client|oauth4webapi|passport'
          PATTERN='(from[[:space:]]+["'"'"']('"$VENDOR_NAMES"')["'"'"']|require\([[:space:]]*["'"'"']('"$VENDOR_NAMES"')["'"'"']|import\([[:space:]]*["'"'"']('"$VENDOR_NAMES"')["'"'"'])'
          LEAKED=$(find packages/*/dist \( -name '*.d.ts' -o -name '*.d.mts' \) -exec grep -l -E "$PATTERN" {} \; 2>/dev/null || true)
          if [ -n "$LEAKED" ]; then
            echo "::error::Vendor import statements leaked into the following public .d.mts files:"
            echo "$LEAKED" | while read -r f; do
              echo "---"
              echo "file: $f"
              grep -n -E "$PATTERN" "$f" || true
            done
            exit 1
          fi
          echo "No vendor import leaks found in public .d.mts."
      - name: No redis client imports in core
        run: |
          set -euo pipefail
          # Per A1 §11: redis client libs (ioredis, redis) are an optional peer
          # of @o3co/auth-provider-redis ONLY. They MUST NOT appear in
          # @o3co/auth-provider-core source — core stays backend-agnostic.
          PATTERN='(from[[:space:]]+["'"'"'](ioredis|redis)["'"'"']|require\([[:space:]]*["'"'"'](ioredis|redis)["'"'"']|import\([[:space:]]*["'"'"'](ioredis|redis)["'"'"'])'
          LEAKED=$(find packages/core/src \( -name '*.mts' -o -name '*.ts' \) -exec grep -l -E "$PATTERN" {} \; 2>/dev/null || true)
          if [ -n "$LEAKED" ]; then
            echo "::error::Redis client import leaked into packages/core/:"
            echo "$LEAKED" | while read -r f; do
              echo "---"
              echo "file: $f"
              grep -n -E "$PATTERN" "$f" || true
            done
            exit 1
          fi
          echo "OK: no redis client imports in packages/core/"
      - name: No legacy v0.4.x slot type references
        run: |
          set -euo pipefail
          # Phase 11 fence: removed v0.4.x slot types must not reappear in
          # source. CHANGELOG.md, spec markdown, and audit markdown are
          # excluded by the *.mts/*.ts include filter. Comment lines
          # (`// ...`, `* ...`, `/* ...`) are also filtered — historical
          # references in JSDoc and the X1/X2 invariant tests are legitimate
          # and document why the slots are absent.
          PATTERN='UserSessionStoreBase|RefreshTokenStoreBase|SingleUseTokenStore'
          HITS=$(grep -rnE "$PATTERN" packages/ templates/ create-app/ --include='*.mts' --include='*.ts' 2>/dev/null | grep -v '/dist/' | grep -vE ':[[:space:]]*(//|\*|/\*)' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Legacy v0.4.x slot types referenced in code (must be removed in v0.5.0):"
            echo "$HITS"
            exit 1
          fi
          echo "OK: no legacy v0.4.x slot types in source code"
      - name: ComponentMap namespace policy
        run: |
          set -euo pipefail
          # Per A1 §5.5: unnamespaced ComponentMap slot names are reserved for
          # o3co-published packages. Third-party augmentations MUST use a
          # namespace prefix (e.g. acme.cacheClient). This repo only contains
          # o3co packages — so any dotted slot name is a policy violation.
          OFFENDERS=$(grep -rnE 'readonly[[:space:]]+[a-zA-Z_$][a-zA-Z0-9_$]*\.[a-zA-Z_$][a-zA-Z0-9_$.]*[[:space:]]*\??:' packages/ --include='*.mts' --include='*.ts' 2>/dev/null | grep -v '/dist/' || true)
          if [ -n "$OFFENDERS" ]; then
            echo "::error::Namespaced ComponentMap slot found in o3co package (reserve unnamespaced names for o3co; third-party augmentations live outside this repo):"
            echo "$OFFENDERS"
            exit 1
          fi
          echo "OK: all in-repo ComponentMap slot names are unnamespaced"
      - name: No cross-project references
        run: |
          set -euo pipefail
          # Forbid cross-project namespace references from leaking into auth.provider sources.
          # CHANGELOG.md is intentionally NOT scanned: it carries the one-line
          # historical record of the removed DID package.
          # The pattern is assembled from parts so this file does not match itself.
          PAT="$(printf '%s' 'dpla' 'as|@dpla' 'asio')"
          PATHS=(packages create-app templates docs .github README.md README.ja.md)
          for p in "${PATHS[@]}"; do
            if [ -e "$p" ] && grep -rEq "$PAT" "$p"; then
              echo "ERROR: prohibited cross-project reference in $p"
              grep -rnE "$PAT" "$p"
              exit 1
            fi
          done
          echo "OK: no cross-project references in scanned paths"
      - name: No cross-project references in PR commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Scan PR commit messages for the same forbidden pattern.
          # File-content scan misses leaks that only live in commit bodies
          # (e.g. "moved to project X" lines), and squash-merge promotes those
          # bodies into the merge commit which becomes immutable history.
          # The pattern is assembled from parts so this workflow does not match itself.
          PAT="$(printf '%s' 'dpla' 'as|@dpla' 'asio')"
          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "PR base or head SHA missing; skipping commit-message scan."
            exit 0
          fi
          # Full history is fetched via actions/checkout fetch-depth:0 above,
          # so both SHAs are reachable. Verify defensively — if either is
          # missing, fail loudly rather than silently passing.
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              echo "ERROR: commit $sha not present in checkout; cannot scan PR commit messages."
              exit 1
            fi
          done
          MATCHES="$(git log --format='%H%n%B%n---' "$BASE_SHA..$HEAD_SHA" | grep -E "$PAT" || true)"
          if [ -n "$MATCHES" ]; then
            echo "ERROR: prohibited cross-project reference in PR commit messages:"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK: no cross-project references in PR commit messages"
      - name: Restrict ignoreExpiration use-site (Wave 1 spec §4.5 S9 security guardrail)
        run: |
          set -euo pipefail
          # Per spec §4.5: ignoreExpiration: true MUST appear at exactly ONE
          # call site — the /oauth/revoke AT path (packages/oauth/src/routes/revoke.mts).
          # Any other production code passing ignoreExpiration: true bypasses
          # token-lifetime enforcement and is a security regression.
          #
          # Exclusions:
          #   src/routes/revoke  — the sole legitimate call site (added in T8)
          #   __tests__          — test files legitimately exercise the option
          #   comment lines      — JSDoc / inline comments referencing the option
          #                        by name are documentation, not call sites
          OFFENDERS=$(grep -rn "ignoreExpiration:[[:space:]]*true" packages/ \
            --include="*.mts" --include="*.ts" \
            | grep -v "src/routes/revoke" \
            | grep -v "__tests__" \
            | grep -vE ":[[:space:]]*(//|\*|/\*)" \
            || true)
          if [ -n "$OFFENDERS" ]; then
            echo "::error::ignoreExpiration: true found outside the /oauth/revoke AT path:"
            echo "$OFFENDERS"
            exit 1
          fi
          echo "OK: no ignoreExpiration: true call sites outside revoke handler or tests"
      - run: pnpm -r --if-present run typecheck
      # Run each package's suite one package at a time on CI. The runner is
      # 2-vCPU; running multiple packages' vitest workers (plus redis
      # testcontainers) concurrently over-subscribes the runner and surfaces
      # loaded-runner flakes (ephemeral-port pressure, timing-margin misses,
      # slow container port binding). Serializing packages bounds total
      # concurrency to one package's worker pool. Local `pnpm run test` stays
      # fully parallel — this cap is CI-only. Within a package, vitest still
      # parallelizes test files.
      - run: pnpm -r --workspace-concurrency=1 run test
      - run: pnpm -r --filter "./packages/**" --if-present --workspace-concurrency=1 run test:coverage

      - name: Upload coverage to Codecov (core)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/core/coverage/coverage-final.json
          flags: core
          disable_search: true
          fail_ci_if_error: false

      - name: Upload coverage to Codecov (foundation)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/foundation/coverage/coverage-final.json
          flags: foundation
          disable_search: true
          fail_ci_if_error: false

      - name: Upload coverage to Codecov (oauth)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/oauth/coverage/coverage-final.json
          flags: oauth
          disable_search: true
          fail_ci_if_error: false

      - name: Upload coverage to Codecov (session)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/session/coverage/coverage-final.json
          flags: session
          disable_search: true
          fail_ci_if_error: false

  publish-readiness:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Pack all @o3co/auth-provider-* packages
        run: |
          set -euo pipefail
          # Per project_v050_publish_readiness_gap memory: simulate the
          # post-publish state by tarballing every workspace package and
          # exercising the standalone template against the tarballs (rather
          # than the workspace:* resolution that local builds use). Catches
          # "template references symbols not in the published tarball"
          # before tag push.
          #
          # Use `pnpm pack` (not `npm pack`): npm pack does not rewrite
          # `workspace:*` ranges, so the tarball's package.json would still
          # carry workspace: protocol — which npm install in the scratch
          # dir cannot resolve (EUNSUPPORTEDPROTOCOL). pnpm pack rewrites
          # workspace:* to the resolved version (0.0.0 in this repo).
          mkdir -p /tmp/tarballs
          for pkg in packages/*/; do
            name=$(node -p "require('./${pkg}package.json').name")
            case "$name" in
              @o3co/auth-provider-*)
                pushd "$pkg" >/dev/null
                pnpm pack --pack-destination /tmp/tarballs
                popd >/dev/null
                ;;
              *)
                echo "skipping $name (not @o3co/auth-provider-*)"
                ;;
            esac
          done
          ls -la /tmp/tarballs

      - name: Pack create-app
        run: |
          set -euo pipefail
          # @o3co/create-auth-provider is published alongside @o3co/auth-provider-*
          # via `pnpm -r publish` in release.yml. Pack it into the same tarball
          # destination so the assertion step below covers it too.
          # The tarball filename (`o3co-create-auth-provider-*.tgz`) is distinct
          # from the packages tarballs (`o3co-auth-provider-*-*.tgz`).
          pushd create-app >/dev/null
          pnpm pack --pack-destination /tmp/tarballs
          popd >/dev/null
          echo "create-app tarball:"
          ls -la /tmp/tarballs/o3co-create-auth-provider-*.tgz

      - name: Assert no __tests__ in published tarballs
        run: |
          set -euo pipefail
          # Per CC-4 (SC-1 + SC-2 + SC-M2): compiled test artifacts must not ship
          # in any published tarball. The scope is `dist/__tests__/` — legitimate
          # scaffold content at `package/templates/standalone/src/__tests__/`
          # (create-app tarball only) is consumer-facing template source and
          # MUST stay shipped.
          FAILED=0
          for tgz in /tmp/tarballs/*.tgz; do
            HITS=$(tar -tzf "$tgz" | grep -E '/dist/.*__tests__' || true)
            if [ -n "$HITS" ]; then
              echo "::error::$tgz contains __tests__ artifacts in dist/:"
              echo "$HITS"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
          echo "OK: no __tests__ artifacts in any published tarball's dist/"

      - name: Check versions.json sync
        run: node create-app/scripts/check-versions-json.mjs

      - name: Build templates/standalone against packed tarballs
        run: |
          set -euo pipefail
          SCRATCH=$(mktemp -d)
          cp -R templates/standalone "$SCRATCH/standalone"
          pushd "$SCRATCH/standalone" >/dev/null
          # Rewrite workspace:* in direct deps to file: tarball URLs AND add
          # an `overrides` block pinning every workspace package to its
          # tarball. The overrides block is required so transitive workspace
          # deps (e.g. oauth -> core) resolve from /tmp/tarballs rather than
          # being fetched from the public npm registry, where these versions
          # do not exist yet.
          node -e "
            const fs = require('fs');
            const path = require('path');
            const dir = process.argv[1];
            const tarballs = fs.readdirSync(dir).filter(f => f.endsWith('.tgz'));
            const { execSync } = require('child_process');
            const map = new Map();
            for (const f of tarballs) {
              const full = path.join(dir, f);
              const pkgJson = execSync('tar -xzOf ' + full + ' package/package.json').toString();
              map.set(JSON.parse(pkgJson).name, 'file:' + full);
            }
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (const section of ['dependencies', 'peerDependencies', 'devDependencies']) {
              if (!pkg[section]) continue;
              for (const [name, spec] of Object.entries(pkg[section])) {
                if (map.has(name)) pkg[section][name] = map.get(name);
              }
            }
            pkg.overrides = pkg.overrides || {};
            for (const [name, spec] of map) pkg.overrides[name] = spec;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          " /tmp/tarballs
          # Use npm rather than pnpm here: pnpm in workspace context would
          # try to re-resolve; standalone npm install consumes the file:
          # tarballs straight (with overrides forcing transitives too).
          npm install --no-package-lock --omit=optional
          npm run build
          popd >/dev/null
          echo "OK: templates/standalone builds against packed tarballs"
