name: API site

# A release's API, built from the bundles it published as an app installs
# them (modules/tooling/api-docs), into its minor's dir of the repository's
# pages. Called by the release after it publishes; run by hand with a
# released tag to build one again.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'A released tag, e.g. v0.19.2 (no prerelease)'
        required: true
        type: string

# The build reads alone; the push alone writes, and runs none of the build's code.
permissions:
  contents: read

# Two releases never write the pages at once; neither is cancelled.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  # The site built where nothing can write: the release's code and what it published run here.
  build:
    name: Build the API site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The push takes the site by this id, never by a name another job could make again.
    outputs:
      site: ${{ steps.site.outputs.artifact-id }}
      # The pages commit the site is built on: the push goes onto it, or not at all.
      pages: ${{ steps.pages.outputs.commit }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: The tag is a release
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${TAG} is not a release's tag (vX.Y.Z); a prerelease has no API site"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The names the release published (published-packages.sh reads them
      # from the build), each installed from npm at this version, so the site
      # reads the very bytes an operator installs. npm may take a while to
      # serve what was just published: a failed install is tried again.
      - name: The published bundles, as an app installs them
        shell: bash
        run: |
          set -euo pipefail
          pnpm bundles
          project="$RUNNER_TEMP/api-project"
          mkdir -p "$project"
          echo '{ "private": true }' > "$project/package.json"
          specs=()
          while IFS=$'\t' read -r name _; do
            specs+=("${name}@${VERSION}")
          done < <(.github/scripts/published-packages.sh)
          for attempt in 1 2 3 4 5; do
            if (cd "$project" && npm install --ignore-scripts --no-audit --no-fund "${specs[@]}"); then
              exit 0
            fi
            [ "$attempt" -lt 5 ] || exit 1
            sleep 60
          done

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          persist-credentials: false
      - name: The pages commit the site is built on
        id: pages
        run: echo "commit=$(git -C pages rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Only this minor's dir, the root and the list of releases change.
      - name: Build this release's API into the pages
        run: pnpm api-docs build "$RUNNER_TEMP/api-project" "$GITHUB_WORKSPACE/pages" "$VERSION"

      # The pages as built, their git directory left behind: whatever the build wrote there, a hook
      # among it, never reaches the push.
      - name: Keep the site for the push
        id: site
        uses: actions/upload-artifact@v4
        with:
          name: api-site
          path: |
            pages
            !pages/.git
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          # A run of all jobs again writes over the site an earlier attempt kept: an artifact's name is the run's.
          overwrite: true

  # The push, with the right to write, of the pages the build kept: it checks the pages out afresh,
  # runs nothing the repository or the build holds, and gives git no hook.
  push:
    name: Publish the API site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # The very pages commit the build built on: where another release has moved the pages since,
      # the push below is no fast-forward and is refused, and the site is to be built again.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.pages }}
          path: pages
          persist-credentials: false
      - name: Take the site the build kept
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.site }}
          path: ${{ runner.temp }}/site
          merge-multiple: true
      - name: Publish the pages
        shell: bash
        working-directory: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # The pages become the site as built, their own git directory kept.
          rsync -a --delete --exclude .git "$RUNNER_TEMP/site/" ./
          git -c core.hooksPath=/dev/null add -A
          if git -c core.hooksPath=/dev/null diff --cached --quiet; then
            echo "the API of v${VERSION} is on the pages already"
            exit 0
          fi
          git -c core.hooksPath=/dev/null -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "docs: API for v${VERSION}"
          # The token for this push alone, as checkout would set it, never written to the configuration.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:gh-pages
