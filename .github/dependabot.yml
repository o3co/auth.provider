version: 2
updates:
  # The workspace's one lockfile. 0.18 ships no Dockerfile of its own: the
  # generated app's base image and its pnpm pin are TypeScript strings in
  # create-app, which Dependabot cannot see, and are updated by hand.
  #
  # A release is proposed only once it has been public for `default-days`, so
  # a compromised release can be caught upstream before it reaches a lockfile.
  # Cooldown applies to version updates only: security updates stay immediate.
  - package-ecosystem: "npm"
    directory: "/"
    # Updates go to develop, the working branch; main changes only with a
    # release. Dependabot reads this file from the default branch, so this
    # takes effect once it reaches main.
    target-branch: "develop"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    # Group routine minor/patch churn into few PRs: many lockfile-touching PRs
    # race at merge time. Majors stay ungrouped so each remains a deliberate
    # review.
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @simplewebauthn/server is pinned to an exact version
      # (modules/passkey/webauthn). Only major bumps should surface as PRs, so
      # each upgrade is a deliberate security review.
      - dependency-name: "@simplewebauthn/server"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # TypeScript majors are taken across the auth.* repositories together,
      # in one deliberate change, never auto-bumped in one of them.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  # The actions the workflows use, each pinned to a commit with its version in
  # a comment: Dependabot moves both together. A release is proposed only once
  # it is two weeks old, the rule every pin follows. Updates go to develop.
  #
  # Two things such a PR may need beside the bump, before it is merged:
  # - an action CI's or the release's runs use: its new commit in
  #   distribution's workflow-caches list (how it caches is reviewed there);
  # - OSV-Scanner's three actions or Scorecard's: the repository's Actions
  #   allowed list moved to the new commit (by the Visioner), or the run fails
  #   at startup. Those PRs go to the Visioner before merge.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # Minor and patch updates in one PR; a major stays its own, a deliberate
    # review (setup-node's next major caches on its own, for one).
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
