version: 2
updates:
  # The standalone template pins its base image by digest. A digest never moves,
  # which is the point — and also means it never picks up the CVE fixes that
  # `node:26-alpine` rebuilds carry. This is the update path: Dependabot bumps
  # tag and digest together, so the pin stays deliberate instead of stale.
  #
  # Major bumps track the LTS lines, which is why `node:25` was declined
  # (#388: odd-numbered, never enters LTS, EOL June 2026). `node:26` was taken
  # in September 2026, a few weeks ahead of its October LTS date, as a
  # deliberate call rather than a default: bcrypt — the one native dependency
  # — is a Node-API addon whose alpine prebuild loads on 26 without
  # compiling, and the whole suite was run on 26 before the bump landed.
  # Nothing in CI builds this image, so that verification is a human step,
  # not a green check.
  - package-ecosystem: "docker"
    directory: "/templates/standalone"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Group routine minor/patch churn into few PRs. Many separate lockfile-
    # touching PRs race at merge time: GitHub's server-side squash/merge does
    # NOT honor the .gitattributes `merge=binary` driver, so a PR merged without
    # first rebasing onto the updated base can duplicate pnpm-lock.yaml entries
    # (ERR_PNPM_BROKEN_LOCKFILE). Fewer concurrent PRs = fewer such races. Majors
    # stay ungrouped so each remains a deliberate review.
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @simplewebauthn/server is pinned to an exact version (S12 discipline,
      # see packages/webauthn/README.md). Only major bumps should surface as
      # PRs so each upgrade is a deliberate security review.
      - dependency-name: "@simplewebauthn/server"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # TypeScript major bumps require workspace-wide migration across the four
      # auth.* OSS repos (auth.provider / auth.policy-verifier / auth.proxy /
      # auth.utils). A per-repo Dependabot bump would split TS versions across
      # the workspace and complicate dev-tool onboarding. TS major upgrades are
      # handled as a deliberate cross-repo PR, not auto-bumped.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
