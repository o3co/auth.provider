# #287 / #304: where security-relevant audit events go -- who authenticated,
# what was issued, what was refused, and when the rate limiter could not answer.
#
# There is deliberately NO "none". A sink is the one adapter class with an
# always-works transport: stdout costs no infrastructure and every container
# runtime already collects it. Defaulting to "drop" is how a deployment ends up
# with no record of a rate-limit outage or a token-issuance failure and no sign
# that anything was configured wrong -- which is exactly what #287 found in the
# shipped artifact. Turning the trail OFF must be an explicit act, not the
# state a deployment reaches by not mentioning it.
#
# `type` names a builder registered in the composition root's AuditSinkFactory.
# `registerBuiltinAuditSinks` ships "console": one JSON object per event, one
# line, on stdout. A composition root that registers its own sink (a log
# pipeline, SIEM, message bus) selects it by name here, and its options go in
# this block alongside `type` -- the section passes them through untouched.
#
# Note that the standalone template overrides this with its own "logger" sink,
# which writes the same events through the pino stream that carries every other
# line it emits. See templates/standalone/config/application.conf.
audit {
  sink {
    type = "console"
    type = ${?AUDIT_SINK_TYPE}
  }
}

oauth {
  jwt {
    # REQUIRED. The canonical issuer stamped as `iss` on every token this
    # deployment mints, and the value resource servers pin. Absolute https URL
    # (http only for a loopback host), no query or fragment. There is no
    # default and no fallback: boot fails when it is unset rather than deriving
    # `iss` from the request's Host header (#266).
    issuer = ${?OAUTH_JWT_ISSUER}
    # SF-1 / Phase G / S2: the central JWT verifier rejects
    # tokens whose `typ` header is absent. The previous v0.5.x default
    # accepted typ-less tokens (with a `jwt_verify_legacy_typ` warning)
    # to keep v0.4.x tokens verifying through the migration window;
    # v0.6.0 closes that window by default. Operators with v0.4.x
    # tokens still in circulation can opt back via
    # `OAUTH_JWT_LEGACY_TYP_ACCEPT=true` for their own bounded migration
    # window, but the safe default is now `false` (reject typ-less tokens
    # as a hard signal of misconfiguration or downgrade attack).
    legacyTypAccept = false
    legacyTypAccept = ${?OAUTH_JWT_LEGACY_TYP_ACCEPT}
  }
  # Access-token lifetime, in whole seconds: positive, at most one year. An
  # exported-but-empty variable fails boot rather than reading as zero.
  #
  #   defaultExpiresIn -- what every grant mints when the request asks for no
  #                       particular lifetime. Only token exchange (RFC 8693)
  #                       lets a request ask, through its optional `expires_in`
  #                       form parameter; every other grant always mints this.
  #   maxExpiresIn     -- the most a token-exchange `expires_in` can obtain; a
  #                       larger request is clamped to it. Unset means the
  #                       default, so nothing is extended unless the operator
  #                       opts in here. It is also the longest window in which
  #                       a resource server validating an exchanged token
  #                       offline cannot observe its revocation.
  #   expiresIn        -- DEPRECATED alias of `defaultExpiresIn`; see below.
  #
  # A default above the max fails boot naming both keys.
  #
  # No literal on `defaultExpiresIn` on purpose -- the OR-9 shape
  # (`oauth.code.adapter` below). The shipped 3600 stays on the deprecated
  # `expiresIn`, so a layer that still overrides that key -- an
  # application.conf, or OAUTH_ACCESS_TOKEN_EXPIRES_IN -- keeps deciding the
  # default instead of being outranked by a literal here. HOCON cannot alias
  # the two keys in this file: substitutions resolve per file before the layers
  # merge, so a reference to the old key would never see an override of it.
  # `resolveAccessTokenLifetime` resolves the alias instead: `defaultExpiresIn`
  # whenever it is set, otherwise `expiresIn`.
  accessToken {
    defaultExpiresIn = ${?OAUTH_ACCESS_TOKEN_DEFAULT_EXPIRES_IN}
    maxExpiresIn = ${?OAUTH_ACCESS_TOKEN_MAX_EXPIRES_IN}
    # DEPRECATED since v0.14.0: alias of `defaultExpiresIn` (and
    # OAUTH_ACCESS_TOKEN_EXPIRES_IN of OAUTH_ACCESS_TOKEN_DEFAULT_EXPIRES_IN),
    # read only while `defaultExpiresIn` is unset. Move an override to the new
    # key. See CHANGELOG.
    expiresIn = 3600
    expiresIn = ${?OAUTH_ACCESS_TOKEN_EXPIRES_IN}
  }
  refreshToken {
    expiresIn = 86400
    expiresIn = ${?OAUTH_REFRESH_TOKEN_EXPIRES_IN}
    # CC-2: handling for refresh tokens whose family_id is not in the store.
    # "reject" is safe-by-default. Use "accept" only during a migration window
    # (e.g. moving from v0.4.x in-memory family store to Redis while old
    # tokens are still in circulation).
    unknownFamilyPolicy = "reject"
    unknownFamilyPolicy = ${?OAUTH_REFRESH_TOKEN_UNKNOWN_FAMILY_POLICY}
    # SF-6 / Phase G / M6: refresh tokens lacking jti or
    # family_id claims when family rotation is wired are always rejected.
    # The `"accept-with-warning"` migration-window value was removed
    # in v0.6.0 along with the env-var override — there is no longer
    # an opt-in to bypass replay detection.
    legacyRtPolicy = "reject"
  }
  # IH-6: require `openid` in /authorize scope by default. `oauth.jwt.issuer`
  # is required of every deployment (#266), so it no longer doubles as the
  # "this is an OIDC Provider" signal — `oidcMode` is now that signal on its
  # own. Set "dual" for deployments that intentionally serve OAuth-only and
  # OIDC clients from the same authorization endpoint.
  oidcMode = "oidc-required"
  oidcMode = ${?OAUTH_OIDC_MODE}
  # OR-9: adapter switch for the OAuth authorization-code repository.
  # Multi-replica production MUST set this to "redis" — the memory adapter
  # loses codes on restart and across replicas.
  #
  # No default literal here on purpose: the legacy `repositories.code.type`
  # fallback in `buildModules` only runs when `oauth.code.adapter` is
  # absent, so a baked-in default would make the legacy override path dead
  # code for any deployment that inherits this core HOCON. Operators who
  # want to opt into the new switch set `OAUTH_CODE_ADAPTER` (or override
  # in their own config layer); pre-OR-9 deployments that still rely on
  # `CLIENT_CODE_TYPE=redis` keep working through the deprecation window.
  code {
    adapter = ${?OAUTH_CODE_ADAPTER}
  }
  # #277: what POST /oauth/revoke does with an ACCESS token.
  #
  #   "denylist"    -- revocation writes the token's `jti` to the
  #                    `accessTokenDenylist` component, which token
  #                    verification and introspection consult. Boot FAILS when
  #                    the composition serves the revocation endpoint and no
  #                    denylist is wired: RFC 7009 forces a 200 response, so an
  #                    unwired denylist means the operator is told the token is
  #                    revoked while it keeps working until it expires.
  #   "unsupported" -- this deployment does not revoke access tokens. The
  #                    endpoint answers `unsupported_token_type` for
  #                    `token_type_hint = access_token` (RFC 7009 §2.2.1)
  #                    instead of a hollow 200, and no denylist is needed.
  #
  # REFRESH-token revocation is governed by neither value: it runs off
  # `refreshTokenFamilyRevocation` and works in both modes.
  #
  # Multi-replica deployments need a SHARED denylist -- the bundled memory one
  # forks per replica, which `core.deployment.mode = "multi"` refuses (see the
  # replica-safety guard). The standalone template wires the Redis-backed
  # denylist off the shared ioredis socket.
  revocation {
    accessToken = "denylist"
    accessToken = ${?OAUTH_REVOCATION_ACCESS_TOKEN}

    # #406: SUBJECT-level revocation -- the pair of stores a credential change
    # needs. `subjectSessionIndex` enumerates the sessions to cascade over;
    # `subjectRevocation` records the not-before watermark that refuses tokens
    # the cascade missed. One key for both because they are one capability: a
    # deployment that has neither has one thing to say.
    #
    #   "watermark"   -- the stores are wired and a credential change actually
    #                    invalidates what was already issued.
    #   "unsupported" -- this deployment has no subject-level revocation, on
    #                    purpose. A password reset leaves existing sessions and
    #                    access tokens working until they expire.
    #
    # Leave it UNSET when the stores are wired -- the guard only reads this key
    # when a slot is unfilled. Boot FAILS on an unfilled slot with no value
    # here, which is the whole point of #406: before it, a scaffolded
    # deployment got `subjectRevocation: undefined` and the watermark check,
    # the refresh-redemption gate (#376) and `revokeAllForSubject` all went
    # quiet with nothing failing and nothing warning.
    #
    # The standalone template wires both on either adapter branch, so it never
    # needs this. REFRESH-token family revocation is governed by neither value:
    # it runs off `refreshTokenFamilyRevocation` and works regardless.
    subject = ${?OAUTH_REVOCATION_SUBJECT}
  }
  # #297: require a verified email before issuing tokens for an end-user
  # subject. Reads `emailVerified` from the user record the Store returned --
  # issuing, delivering and confirming the verification are the Store's job,
  # not this library's.
  #
  # Off by default: `emailVerified` is Store data many Stores do not model, and
  # defaulting this on would refuse every user of every deployment that has not
  # adopted the field. Enforced at `/authorize` and on the `session` grant --
  # the two points that hold the user's session at issuance. `refresh_token`
  # and token-exchange are deliberately not gated: they derive from an artifact
  # that already passed the gate when it was issued.
  requireEmailVerified = false
  requireEmailVerified = ${?OAUTH_REQUIRE_EMAIL_VERIFIED}
  # #311: deny-by-absence for the per-client `allowedGrantTypes` allowlist.
  #
  # #268 made a DECLARED allowlist restrict which grants a client may use, and
  # kept absence meaning "unrestricted" -- the grants that ignored the field
  # predate it, so denying on absence would have revoked every grant from every
  # registration written before it existed. The consequence is that the secure
  # posture is opt-in per registration: a client whose record omits
  # `allowedGrantTypes` silently gets every grant, and nothing at the
  # deployment level can say otherwise.
  #
  # Set this to true once you have audited your registrations and every client
  # names its grants. A client that then omits the field is refused with
  # `unauthorized_client` at /oauth/token and at /authorize, rather than
  # inheriting everything.
  #
  # Independent of the per-grant rule (#326): `client_credentials` and the
  # WebAuthn grant already deny by absence on their own, whatever this is set
  # to. The two compose to the stricter of the pair.
  requireGrantTypeAllowlist = false
  requireGrantTypeAllowlist = ${?OAUTH_REQUIRE_GRANT_TYPE_ALLOWLIST}

  # #267: `/authorize` mints a code with no consent step, which is defensible
  # in a pure first-party OP and only there. It refuses any client not marked
  # `firstParty: true` in its registration -- one with no `firstParty` field
  # and one carrying an explicit `false` alike.
  #
  # This does NOT make /authorize safe against forced navigation for a client
  # that IS first-party -- that is the accepted model, and consent (#284) is
  # the step that changes it.
  #
  # #330: the one-time `allowUnmarkedClients` migration flag (#316/#317) was
  # removed. The substitution below is a deliberate tombstone, not a live
  # knob: it routes a still-exported OAUTH_AUTHORIZE_ALLOW_UNMARKED_CLIENTS
  # into the schema's removed-key error, so boot fails with migration
  # instructions instead of the variable being silently ignored. Mark your
  # client registrations, then delete the env var and boot clears.
  authorize {
    allowUnmarkedClients = ${?OAUTH_AUTHORIZE_ALLOW_UNMARKED_CLIENTS}
    # #481: the Authentication Context Class References /authorize will vouch
    # for, each mapped to the RFC 8176 `amr` values a session must carry (`pwd`
    # for a password login, `fed` for a federated login, `mfa` once a second
    # factor was verified) -- or to a list of such lists, any ONE of which
    # satisfies it (the MFA ADR's D15). `acr_values` is answered from this
    # table ALONE: a value it does not carry -- every value, while it is empty
    # -- is `unmet_authentication_requirements` at the redirect_uri, and
    # discovery advertises the keys as `acr_values_supported` only when there
    # are some. An entry, or an alternative, that requires nothing is refused
    # at boot: it would vouch for every session.
    #
    # An entry nothing installed can satisfy is DROPPED at boot -- not
    # advertised, answered `unmet_authentication_requirements` -- and logged
    # once as `acr_value_unsatisfiable`: at warn, or at info when only a second
    # factor is missing and no installed requirement reaches one. What can be
    # satisfied: `pwd`; a second factor's values once MFA is installed (`mfa`
    # when an installed factor adds it); `fed` while a federation is
    # installed; and anything else while an installed federation has
    # `trustUpstreamAmr` on, since its callback then records the upstream
    # IdP's `amr` beside `fed`.
    #
    #   acrValues {
    #     "urn:example:pwd" = ["pwd"]
    #     "urn:example:mfa" = ["pwd", "mfa"]
    #     "urn:example:phr" = [["hwk"], ["swk"]]
    #   }
    acrValues {}
  }
  # IH-16: hard ceiling on the OIDC `nonce` query parameter at /authorize.
  # Standard OIDC clients generate 22-44 char base64url nonces; 256 leaves
  # ~2x headroom for non-standard RPs. Operators with stricter requirements
  # set OAUTH_NONCE_MAX_LENGTH.
  nonce {
    maxLength = 256
    maxLength = ${?OAUTH_NONCE_MAX_LENGTH}
  }
  # Wave 1 §5.3 / RFC 8707: opt-in gate for Resource Indicator enforcement.
  # Secure-by-default: off at the library layer. Operators enable via
  # `OAUTH_RESOURCE_INDICATOR_ENABLED=true` or by overriding `enabled = true`
  # in their own application.conf layer.
  # Pattern: literal false + env-override line (PR #171):
  # the literal provides the anchor so HOCON env-substitution has a binding
  # point; without it ${?VAR} is silently dropped when the env var is unset.
  resourceIndicator {
    enabled = false
    enabled = ${?OAUTH_RESOURCE_INDICATOR_ENABLED}
  }
}

session {
  # REQUIRED. Signs the cookie that IS the authenticated session, so anyone
  # who guesses it can forge a login. #282: at least 32 bytes (256 bits) of
  # random material — `openssl rand -hex 32`. Hex/base64 values are measured
  # DECODED, so a 32-character hex string counts as 16 bytes and is refused.
  secret = ${?SESSION_SECRET}
  # MIN-2: __Host- prefix requires Secure, Path=/, and no Domain attribute.
  # If SESSION_SECURE=false or SESSION_DOMAIN is set, also override
  # SESSION_NAME to a non-__Host- value.
  name = "__Host-auth.session"
  name = ${?SESSION_NAME}
  # Positive whole milliseconds, at most one year (#282). An exported-but-
  # empty SESSION_MAX_AGE resolves to "" and coerces to 0, which emits an
  # already-expired cookie — every request then arrives unauthenticated with
  # nothing in the logs to say why.
  maxAge = 3600000
  maxAge = ${?SESSION_MAX_AGE}
  secure = true
  secure = ${?SESSION_SECURE}
  # #282: `sameSite = "none"` requires `secure = true`. Browsers drop a
  # SameSite=None cookie that is not Secure, so the combination is refused at
  # boot rather than failing silently in the client.
  sameSite = "lax"
  sameSite = ${?SESSION_SAME_SITE}
  domain = null
  domain = ${?SESSION_DOMAIN}
  # #405: every URL `POST /session/login` may accept as `redirect_to`, matched
  # EXACTLY (after URL normalization) -- no wildcards, no prefixes, and a query
  # string is part of the match.
  #
  # An empty list refuses every `redirect_to`, which is the right setting for
  # the deployments that never send one -- and it is the default, because the
  # rule this replaced accepted any absolute http(s) URL whenever `domain`
  # above was unset. A refused request answers 400 invalid_redirect naming the
  # reason (`no-allowlist`, `not-allowlisted`, `insecure-scheme`, ...).
  #
  # `http://` is accepted for loopback hosts only (localhost, 127.0.0.0/8,
  # [::1]); every other host must be https. When `domain` is set, an entry
  # outside it fails BOOT rather than being silently ignored.
  #
  # This is the login flow's list. The federation flow has its own, per
  # provider, at `federations.<name>.redirectAllowlist` (#278).
  redirectAllowlist = []
  # #272: CSRF policy for POST /session/login and POST /session/logout.
  #
  # The routes accept a request that carries EITHER a same-origin (or trusted)
  # Origin/Referer, OR a valid double-submit token; they reject one that
  # carries neither. GET /session/csrf hands out the token, which the client
  # echoes from the `<session.name>.csrf` cookie into the `x-csrf-token`
  # header (or a `csrf_token` form field).
  csrf {
    # Origins other than this server's own that may satisfy the Origin/Referer
    # arm. Set this when the login UI is served from a DIFFERENT origin than
    # the provider -- e.g. a SPA on https://app.example.com posting to
    # https://auth.example.com.
    #
    # The same list decides where an account-link start
    # (GET /session/oauth/federation/<name>?link=1) may be navigated from: an
    # account page on a sibling host goes here, since the browser's
    # `Sec-Fetch-Site: same-site` covers every host on the registrable domain.
    #
    # Deliberately separate from `cors.allowedOrigins`, which until #272 also
    # doubled as the CSRF trust list. "May read my responses" and "may make me
    # change state" are two decisions; one list cannot answer both.
    trustedOrigins = []
    # Lifetime of an issued token, in seconds. It only has to outlive the time
    # a login form sits open, and the paired cookie expires with it.
    #
    # Must be an integer from 1 to 86400 (24h); boot fails otherwise. The bound
    # is not pedantry: this value is stringified into the token as its expiry
    # field, so a decimal mints tokens that fail their own shape check, and a
    # zero -- which is what an EMPTY SESSION_CSRF_TTL_SECONDS coerces to --
    # mints tokens that are already expired. Either one disables the token arm
    # silently and locks out every client that cannot send an Origin header.
    ttlSeconds = 7200
    ttlSeconds = ${?SESSION_CSRF_TTL_SECONDS}
  }
  storage {
    type = "redis"
    type = ${?SESSION_STORAGE_TYPE}
    redis {
      url = "redis://localhost:6379"
      url = ${?SESSION_STORAGE_REDIS_URL}
      password = ${?SESSION_STORAGE_REDIS_PASSWORD}
    }
  }
}

rateLimit {
  # Brute-force guard for `POST /session/login`. The route runs on the shared
  # `rateLimiter` component (keyed `login:ip:<ip>`) rather than a per-process
  # store, so behind a load balancer or across replicas this is one bucket set
  # rather than one per process. The session module contributes these values
  # as the `login` budget every limiter reads, so they stay the single source
  # of truth. Values no limiter can apply refuse to boot, naming
  # `rateLimit.login`; they are never replaced by the limiter's default.
  #
  # NOTE: `req.ip` is the load balancer's address unless `http.trustProxy` is
  # set. Without it every user shares one bucket and the limit reads as an
  # outage. Set it to the proxy's address or CIDR range rather than `true`:
  # `true` lets anyone who can reach this process choose their own `req.ip`
  # and so their own rate-limit identity. See the multi-replica section of the
  # standalone template README.
  login { windowMs = 900000, limit = 20 }
  # The Redis limiter's outage policy is its own key,
  # `redis-rate-limiter.failMode` (@o3co/auth-provider-redis). Core warns when
  # `rateLimit.failMode`, its old path, says "open" and the wired limiter
  # applies another policy; with the Redis limiter installed that path refuses
  # boot naming the new one.
}

# federations: individual provider declarations are consumer territory
# (which providers to enable is a deployment decision, not library policy).
# The empty block satisfies the AppConfigSchema record type constraint;
# consumers declare their providers in application.conf above this layer.
# ADR I4 strict-required (declared = active) is maintained: no provider
# is active unless explicitly declared with `enabled = true` in the
# consumer layer.
federations {}

repositories {
  client {
    type = "yaml"
    type = ${?CLIENT_TYPE}
    yaml {
      path = "./config/clients.yaml"
      path = ${?CLIENT_PATH}
    }
  }
  user {
    type = "yaml"
    type = ${?CLIENT_USER_TYPE}
    yaml {
      path = "./config/users.yaml"
      path = ${?CLIENT_USER_PATH}
    }
    http {
      # Every URL here carries what a Store must never receive in the clear --
      # user credentials to the first two, a verified federation token and its
      # claims to the third -- so each must be an absolute https URL. http:// is
      # accepted only for a loopback host (localhost, 127.0.0.0/8, [::1]); a
      # private-range address or a container-network service name still needs
      # https. Boot fails if one is not. Each must also be the endpoint that
      # answers: no request follows a 3xx, so a URL that redirects fails every
      # call (packages/foundation/README.md, "What the Store must enforce itself").
      authenticateUrl = ${?CLIENT_USER_AUTHENTICATE_URL}
      authenticateByTokenUrl = ${?CLIENT_USER_AUTHENTICATE_BY_TOKEN_URL}
      # #482: optional. When set, a signed-in user can link a second federated
      # identity (GET /session/oauth/federation/<name>?link=1) and the Store
      # decides. Without it, link=1 is refused with `link_unsupported`. Declared
      # here and not only in the standalone template: HOCON substitutes
      # ${?VAR} only where the line exists, so a composition layering on this
      # file alone would otherwise see the variable do nothing.
      linkFederatedIdentityUrl = ${?CLIENT_USER_LINK_FEDERATED_IDENTITY_URL}
      # #613: optional. The Store's identity lookup for federation grants (D7
      # check 5): POST { provider, issuer, clientId, sub, claims }, answered
      # 200 { kind: "linked", subject } | { kind: "unlinked" } |
      # { kind: "indeterminate", reason } -- `subject` the local User.id, byte
      # for byte. Anything else -- a 404 included -- is an outage, never
      # "nobody". Same https and no-redirect rule: the body carries a
      # verified identity. With it, declare what the Store's lookup covers,
      # per registration, in a HOCON layer (a list has no env form):
      #   federatedIdentityLookupCoverage = [
      #     { provider = "entra-files", issuer = "https://login.microsoftonline.com/<tenant>/v2.0",
      #       clientId = "<the grants app registration>", requiredClaims = ["tid", "oid"] }
      #   ]
      # Boot holds every federation-grants.connections entry to it under
      # identityLookup = "required"; the Store is not asked at boot.
      findSubjectByFederatedIdentityUrl = ${?CLIENT_USER_FIND_SUBJECT_BY_FEDERATED_IDENTITY_URL}
      federatedIdentityLookupCoverage = []
      # Optional. The credential auth.provider presents to the Store: every
      # request above carries `Authorization: Bearer <token>`, so the Store can
      # refuse a caller that is not this deployment -- without one, anyone who
      # reaches authenticateByTokenUrl resolves a known identity to its user.
      # Unset, no Authorization header is sent. Set, it must be a bare RFC 6750
      # token (no "Bearer " prefix) of at least 32 bytes of key material,
      # measured like SESSION_SECRET (`openssl rand -hex 32`); boot fails
      # otherwise, including on a blank env override -- when type = "http"
      # (the default above is "yaml", which never reads this block). It
      # appears in no error. One token goes to every URL above: they must be
      # one trust domain. A Store that refuses it answers 401 (or 403) with
      # `WWW-Authenticate: Bearer`, which fails every Store call as an outage
      # rather than as a wrong password: login, federation callbacks and the
      # jwt-bearer grant answer 503 and log the error; the federation-grants
      # callback redirects with temporarily_unavailable and logs it as
      # federation_grant_callback_unavailable, err.name
      # StoreCredentialRefusedError. A 401 or 403 without that challenge keeps
      # its old meaning.
      bearerToken = ${?CLIENT_USER_BEARER_TOKEN}
      # Positive integer, milliseconds, <= 2147483647. Boot fails otherwise —
      # including on a blank env override, which HOCON substitutes as "".
      timeout = 5000
      timeout = ${?CLIENT_USER_TIMEOUT}
      # Largest upstream response body accepted, in bytes. Positive integer.
      maxResponseBytes = 1048576
      maxResponseBytes = ${?CLIENT_USER_MAX_RESPONSE_BYTES}
    }
  }
  code {
    type = "memory"
    type = ${?CLIENT_CODE_TYPE}
    memory {
      defaultExpiresIn = 600
      defaultExpiresIn = ${?CLIENT_CODE_DEFAULT_EXPIRES_IN}
    }
    redis {
      defaultExpiresIn = 600
      defaultExpiresIn = ${?CLIENT_CODE_DEFAULT_EXPIRES_IN}
      endpointUri = ${?CLIENT_CODE_ENDPOINT_URI}
      password = ${?CLIENT_CODE_PASSWORD}
    }
  }
}

endpoints {
  login {
    # IH-17: hard default required because `fullSectionsSchema` now declares
    # `endpoints.login.url` as `z.string()` (was `.optional()`); pure env-var
    # form alone causes parse failure when `ENDPOINTS_LOGIN_URL` is unset.
    url = "/login"
    url = ${?ENDPOINTS_LOGIN_URL}
  }
  # IH-10: `client { url }` and `authCallback { url }` removed — no
  # production consumer reads them. Federation provider callback URLs
  # are configured per-provider (e.g. `federations.google.callbackURL`).
}

# The browser origins allowed to read the token, userinfo, revocation and
# discovery/JWKS responses. Core reads this only when the composition holds
# no `httpSettings`. Empty -- the default -- means CORS is OFF: no
# middleware is mounted and no response gains a `Vary: Origin`.
#
# Matching against the `Origin` request header is EXACT string equality, so
# every entry must be a serialized origin and nothing else: scheme, host, and a
# port only when it is not the scheme's default.
#
#   cors { allowedOrigins = ["https://app.example.com", "http://localhost:5173"] }
#
# There is no wildcard and no subdomain matching -- `https://*.example.com`
# fails at boot rather than sitting here matching nothing. So does a trailing
# slash, an explicit `:443`, a path, or an uppercase host: each is an allowlist
# that admits nobody, and each is what an address bar hands you. https is
# required except for a loopback host (localhost, 127.0.0.0/8, [::1]), which is
# the carve-out that lets a front-end dev server work without a certificate.
#
# Credentials are NEVER allowed: no `Access-Control-Allow-Credentials` is sent,
# so an allowlisted origin can read these responses and cannot use the browser's
# session cookie. A cross-origin SPA here is a public client using PKCE, which
# needs no cookie -- and the cookie it would otherwise gain reaches the
# `session` grant.
#
# This list does NOT confer CSRF trust; that is `session.csrf.trustedOrigins`.
# The env override takes a comma-separated list.
cors {
  allowedOrigins = []
  allowedOrigins = ${?CORS_ALLOWED_ORIGINS}
}

# Core's own section.
#
# `deployment.mode`: how many replicas this deployment runs. No default
# literal here on purpose. "unset" is a meaningful third state and a baked-in
# "single" would make it unreachable:
#
#   multi   -> boot FAILS if any in-memory shared store is wired, naming every
#              offender. Set this once you scale past one replica.
#   single  -> you have declared one replica; in-memory stores are correct and
#              boot says nothing.
#   unset   -> nothing declared. Boot logs one `replica_unsafe_adapters`
#              warning naming what is held in this process's memory and what
#              each one costs when scaled.
#
# NOTE: no boot check can catch scaling to N replicas without setting this —
# a process whose state is all in its own memory has no shared medium through
# which to see peers. The warning and the docs are what cover that case.
#
# `sessionRequirements.expected` (the session-admission ADR's D7): the
# session requirements this composition expects -- the extensions that change
# what "logged in" means, MFA among them -- compared at boot with what the
# installed modules register. Once written, it is compared both ways, whether
# or not anything consults session admission: a name declared that no module
# registers refuses the boot (`session-requirement-missing`), and so does a
# requirement registered but not declared (`session-requirements-undeclared`).
# REQUIRED whenever a module that consults session admission is installed (the
# oauth module is one), and refused unwritten there
# (`session-requirements-undeclared`); `[]` says "none". No default and no
# variable: a composition states its posture, writing what it installs, or
# what its composition root declares.
#
#   core.sessionRequirements.expected = ["mfa"]
#
# `tokenBinding`: the settings across every mechanism installed at core's
# token-binding extension point (DPoP, mTLS, ...), read by core alone.
#
#   dispatchPolicy -- how the token endpoint's binding middleware arbitrates
#     between mechanisms on one request:
#       "intent-explicit" (default): explicit-intent mechanisms (DPoP) win
#         over ambient ones (mTLS); two or more explicit successes -> 400
#         invalid_request.
#       "strict-mutual-exclusion": any two or more successes -> 400.
#     See ADR `packages/core/docs/adr/2026-05-20-token-binding-first-class-abstraction.md`.
#
#   bindConfidentialClientRefreshTokens -- also bind a CONFIDENTIAL client's
#     refresh token to the presented DPoP key / client certificate. Public
#     clients are bound either way.
#
#     Neither RFC requires the public-client restriction and neither forbids
#     lifting it: RFC 9449 §5's "refresh tokens issued to confidential clients
#     ... are not bound" is descriptive prose with no RFC 2119 keyword (the
#     three MUSTs beside it are all about public clients), and RFC 8705 §7.1
#     says the same about certificates. Their rationale holds here -- this
#     server refuses an unauthenticated refresh and refuses a refresh token
#     whose `azp` is not the authenticated client -- so a stolen refresh token
#     is already unusable without the client's own credential.
#
#     Turn this on only if your DPoP key or client certificate is protected
#     BETTER than your client secret (key in an HSM/TPM, secret in an env
#     var). That is the one case where it adds anything: leaking the secret
#     alone is then not enough.
#
#     The cost, and why it is off by default: a bound refresh token pins the
#     client to ONE key or certificate for the refresh token's whole lifetime
#     (days). Rotating mid-lifetime breaks refresh until the client
#     re-authenticates from scratch.
#
# `deployment.mode` and `sessionRequirements.expected`, at the top level, and
# `oauth.tokenBinding`, refuse boot naming these paths. DEPLOYMENT_MODE is
# declared renamed CORE_DEPLOYMENT_MODE, and OAUTH_TOKEN_BINDING_DISPATCH_POLICY
# and OAUTH_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS their
# CORE_TOKEN_BINDING_* names; `renamed-variables` below captures both names of
# each as this file is resolved: boot refuses an old name set unless its new
# name is set to the same value.
core {
  deployment {
    mode = ${?CORE_DEPLOYMENT_MODE}
  }
  tokenBinding {
    dispatchPolicy = "intent-explicit"
    dispatchPolicy = ${?CORE_TOKEN_BINDING_DISPATCH_POLICY}
    bindConfidentialClientRefreshTokens = false
    bindConfidentialClientRefreshTokens = ${?CORE_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS}
  }
}

# The JWKS module's section (`jwksModule`): where the verification keys are
# published, under the issuer, and for how long a verifier may cache them.
#
#   path        -- default /.well-known/jwks.json. An absolute path, with no
#                  "//", dot-segment, query, fragment, backslash,
#                  percent-encoding or control character.
#   cacheMaxAge -- `Cache-Control: public, max-age`, in seconds; default 300.
#                  Keep it well below the key-overlap window, so a rotated kid
#                  reaches caching verifiers in time.
#
# `oauth.jwt.jwksPath` and `oauth.jwt.jwksCacheMaxAge` refuse boot naming
# these paths wherever the module is installed.
jwks {
  path = ${?JWKS_PATH}
  cacheMaxAge = ${?JWKS_CACHE_MAX_AGE}
}

# Wave 5d (IH-14 + OR-M1 + OR-4): adapter switches for the OAuth-endpoint
# rate limiter and the four user-session stores. Defaults are `"memory"`
# for backward compat with existing single-instance deployments.
# Multi-replica production MUST set BOTH to `"redis"` and provide a
# shared Redis 7.2+ instance — otherwise rate-limit counters and session
# state are isolated per replica and produce inconsistent behavior.
rateLimiter {
  adapter = "memory"
  adapter = ${?RATE_LIMITER_ADAPTER}
}

# The in-process rate limiter's own section (`memoryRateLimiterModule`,
# `core-rate-limiter-memory`), read when the composition wires it.
#
# `maxBuckets` bounds the counters it holds. Multi-replica production uses the
# Redis limiter; this cap keeps the single-process one from growing without
# limit.
#
# `limits { <prefix> { limit, windowSeconds } }` overrides the per-prefix spec
# for keys of the form `<prefix>:...`; `defaultLimit` is the budget every key
# whose prefix has neither an entry in `limits` nor a budget its owning module
# contributes falls back to. A window is at most one year (31536000 s). The
# adapter refuses a spec it cannot apply as written when it is built, and
# never serves its default in its place.
#
# A prefix's owning module contributes its budget from its own settings,
# which the limiter applies when `limits` declares no entry for it; each
# package's README names its prefixes and keys. Restating such a budget here
# is two numbers that must agree, the drift bug; declaring one anyway
# overrides the contributed budget — an explicit statement about this
# limiter wins. A prefix whose owner is not installed has no budget, and
# falls to `defaultLimit`. The boot line `rate_limit_budgets_registered`
# lists each prefix with its contributed budget and the module that set it;
# an entry here wins over that budget and is not shown.
#
# `memoryRateLimiter`, the section's old path, refuses boot naming this one
# wherever the module is installed. MEMORY_RATE_LIMITER_MAX_BUCKETS is
# declared renamed CORE_RATE_LIMITER_MEMORY_MAX_BUCKETS, and
# `renamed-variables` below captures both names.
core-rate-limiter-memory {
  maxBuckets = 10000
  maxBuckets = ${?CORE_RATE_LIMITER_MEMORY_MAX_BUCKETS}
  defaultLimit { limit = 60, windowSeconds = 60 }
}

userSessionStores {
  adapter = "memory"
  adapter = ${?USER_SESSION_STORES_ADAPTER}
}

# #277: adapter switch for the RFC 7009 access-token denylist -- the store that
# makes "this access token is revoked" true rather than merely reported.
#
# `"memory"` forks per replica: a revocation served by replica A leaves the
# token working on B and C. That is why `core.deployment.mode = "multi"` refuses it
# (see the replica-safety guard). Anything past one replica sets `"redis"`,
# which shares the denylist over the same ioredis socket as the other stores.
accessTokenDenylist {
  adapter = "memory"
  adapter = ${?ACCESS_TOKEN_DENYLIST_ADAPTER}
}

# #527: where an end-user's consent to a client that is not first-party is
# recorded. "none" (the default) wires no store: such clients are refused at
# /authorize, as before #527, and only first-party clients are served.
# "memory" wires the in-process stores -- the consent records and the
# requests parked while the consent page asks (#552) -- single-replica only:
# consent forks per replica, so `core.deployment.mode = "multi"` refuses it by name.
# "redis" (#561) wires both on the shared ioredis socket, and is what a
# deployment of more than one replica selects.
consentStore {
  adapter = "none"
  adapter = ${?CONSENT_STORE_ADAPTER}
}

# #484: backend for the replay seen-set — the single-use record behind
# `private_key_jwt` client authentication, consumed WebAuthn challenges and,
# with @o3co/auth-provider-dpop enabled, every accepted DPoP proof. The same replica reasoning as the denylist: "memory" lets a captured
# assertion or proof replay once per replica, so `core.deployment.mode = "multi"`
# refuses it by name.
replaySeenSet {
  adapter = "memory"
  adapter = ${?REPLAY_SEEN_SET_ADAPTER}
}

# #456: adapter switch for the federation token store -- the upstream IdP
# tokens (a Google refresh token, say) held on behalf of a session.
#
# `"memory"` forks per replica: a token stored by replica A is missing on B
# and C, so a session that federated on one replica cannot refresh its
# upstream token on another. `core.deployment.mode = "multi"` refuses it -- the
# standalone's memory module declares as much on its manifest (#455).
# Anything past one replica sets `"redis"`, which shares the store over the
# same ioredis socket as the other stores and needs its encryption key
# (`redis-federation-token-store.encryptionKey`, @o3co/auth-provider-redis).
federationTokenStore {
  type = "memory"
  type = ${?FEDERATION_TOKEN_STORE_TYPE}
}

# Which store keeps federation grants (offline delegation of an upstream
# IdP's tokens, the federation-grants package), and which keeps acquisition's
# records (the intent a backend lodged, the consent challenge, the connect
# transaction). Read by a composition root such as the standalone template,
# and only when `federation-grants.enabled = true`. Two switches, because the
# two are installed independently: grants in Redis with acquisition in memory
# is a supported single-replica shape — a restart loses flows in progress and
# no established grant. Either "memory" is refused by name under
# `core.deployment.mode = "multi"`; "redis" grants beside a "memory" subject
# revocation (USER_SESSION_STORES_ADAPTER=memory) are refused at boot too,
# because the grants would outlive the boundary that ends them (D13).
federationGrantStore {
  adapter = "memory"
  adapter = ${?FEDERATION_GRANT_STORE_ADAPTER}
}

federationGrantIntentStore {
  adapter = "memory"
  adapter = ${?FEDERATION_GRANT_INTENT_STORE_ADAPTER}
}

# The in-process grant store's own section (`memoryFederationGrantStoreModule`,
# `core-federation-grant-store-memory`). `tombstoneRetention` is how long a
# revoked or expired grant still answers the status route, in seconds, at most
# one year (31536000); zero keeps no tombstones. It is taken at creation and
# kept with the record, so changing it applies to grants created afterwards.
# `federationGrants.tombstoneRetention`, its old path, refuses boot naming this
# one wherever the module is installed.
core-federation-grant-store-memory {
  tombstoneRetention = 2592000
}

# The MFA ADR (D19): which store keeps enrolled second factors ("memory",
# "redis" or "store" -- the Store, through the four URLs of the
# `foundation-mfa-factor-store` section) and
# which keeps MFA transactions and the lock state ("memory" or "redis"; a
# transaction is verification state and has no Store variant). Read by a
# composition root that installs MFA and picks its stores by name. "memory"
# is refused by name under `core.deployment.mode = "multi"`, and a memory factor
# store forgets every enrollment at a restart.
mfaFactorStore {
  adapter = "memory"
  adapter = ${?MFA_FACTOR_STORE_ADAPTER}
}

mfaTransactionStore {
  adapter = "memory"
  adapter = ${?MFA_TRANSACTION_STORE_ADAPTER}
}

# OR-9 (Wave 5d): module-internal config for `redisCodeRepositoryModule`.
# Consumed when `oauth.code.adapter = "redis"`. The shared ioredis socket
# (`standaloneRedisClientsModule`) provides the `codeRepositoryClient`
# slot; this section governs only key namespacing and the default
# expiry-in-seconds the repository uses when /authorize doesn't supply one.
#
# Multi-tenant deployments override `keyPrefix` to isolate tenants in the
# same Redis instance — e.g. `keyPrefix = "tenant-a:code:"` keeps tenant A's
# codes from colliding with tenant B's under the default `oauth:code:`
# prefix (MIN-3 advisory).
redisCodeRepository {
  # No literal default for keyPrefix — the RedisCodeRepository constructor
  # falls back to `oauth:code:` when this field is absent. Operators that
  # need multi-tenant isolation set CLIENT_CODE_KEY_PREFIX (e.g.
  # `tenant-a:code:`); leaving the env var unset keeps the constructor
  # default intact via HOCON's `${?VAR}` "absent if unset" semantics.
  keyPrefix = ${?CLIENT_CODE_KEY_PREFIX}
  defaultExpiresIn = 600
  defaultExpiresIn = ${?CLIENT_CODE_DEFAULT_EXPIRES_IN}
}

# What the resolution saw of each environment variable core's own section and
# core's own modules renamed: each name null, then its value when set. Boot
# judges these and removes the section before it parses the configuration.
# Never write it in another layer.
renamed-variables {
  DEPLOYMENT_MODE = null
  DEPLOYMENT_MODE = ${?DEPLOYMENT_MODE}
  CORE_DEPLOYMENT_MODE = null
  CORE_DEPLOYMENT_MODE = ${?CORE_DEPLOYMENT_MODE}
  MEMORY_RATE_LIMITER_MAX_BUCKETS = null
  MEMORY_RATE_LIMITER_MAX_BUCKETS = ${?MEMORY_RATE_LIMITER_MAX_BUCKETS}
  CORE_RATE_LIMITER_MEMORY_MAX_BUCKETS = null
  CORE_RATE_LIMITER_MEMORY_MAX_BUCKETS = ${?CORE_RATE_LIMITER_MEMORY_MAX_BUCKETS}
  OAUTH_TOKEN_BINDING_DISPATCH_POLICY = null
  OAUTH_TOKEN_BINDING_DISPATCH_POLICY = ${?OAUTH_TOKEN_BINDING_DISPATCH_POLICY}
  CORE_TOKEN_BINDING_DISPATCH_POLICY = null
  CORE_TOKEN_BINDING_DISPATCH_POLICY = ${?CORE_TOKEN_BINDING_DISPATCH_POLICY}
  OAUTH_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS = null
  OAUTH_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS = ${?OAUTH_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS}
  CORE_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS = null
  CORE_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS = ${?CORE_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS}
}
