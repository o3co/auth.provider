oauth {
  jwt {
    # REQUIRED. The canonical issuer stamped as `iss` on every token this
    # deployment mints, and the value resource servers pin. Absolute https URL
    # (http only for a loopback host), no query or fragment. There is no
    # default and no fallback: boot fails when it is unset rather than deriving
    # `iss` from the request's Host header (#266).
    issuer = ${?OAUTH_JWT_ISSUER}
    # SF-1 / Phase G / S2: the central JWT verifier rejects
    # tokens whose `typ` header is absent. The previous v0.5.x default
    # accepted typ-less tokens (with a `jwt_verify_legacy_typ` warning)
    # to keep v0.4.x tokens verifying through the migration window;
    # v0.6.0 closes that window by default. Operators with v0.4.x
    # tokens still in circulation can opt back via
    # `OAUTH_JWT_LEGACY_TYP_ACCEPT=true` for their own bounded migration
    # window, but the safe default is now `false` (reject typ-less tokens
    # as a hard signal of misconfiguration or downgrade attack).
    legacyTypAccept = false
    legacyTypAccept = ${?OAUTH_JWT_LEGACY_TYP_ACCEPT}
  }
  # Access-token lifetime, in whole seconds: positive, at most one year. An
  # exported-but-empty variable fails boot rather than reading as zero.
  #
  #   defaultExpiresIn -- what every grant mints when the request asks for no
  #                       particular lifetime. Only token exchange (RFC 8693)
  #                       lets a request ask, through its optional `expires_in`
  #                       form parameter; every other grant always mints this.
  #   maxExpiresIn     -- the most a token-exchange `expires_in` can obtain; a
  #                       larger request is clamped to it. Unset means the
  #                       default, so nothing is extended unless the operator
  #                       opts in here. It is also the longest window in which
  #                       a resource server validating an exchanged token
  #                       offline cannot observe its revocation.
  #   expiresIn        -- DEPRECATED alias of `defaultExpiresIn`; see below.
  #
  # A default above the max fails boot naming both keys.
  #
  # No literal on `defaultExpiresIn` on purpose. The shipped 3600 stays on the deprecated
  # `expiresIn`, so a layer that still overrides that key -- an
  # application.conf, or OAUTH_ACCESS_TOKEN_EXPIRES_IN -- keeps deciding the
  # default instead of being outranked by a literal here. HOCON cannot alias
  # the two keys in this file: substitutions resolve per file before the layers
  # merge, so a reference to the old key would never see an override of it.
  # `resolveAccessTokenLifetime` resolves the alias instead: `defaultExpiresIn`
  # whenever it is set, otherwise `expiresIn`.
  accessToken {
    defaultExpiresIn = ${?OAUTH_ACCESS_TOKEN_DEFAULT_EXPIRES_IN}
    maxExpiresIn = ${?OAUTH_ACCESS_TOKEN_MAX_EXPIRES_IN}
    # DEPRECATED since v0.14.0: alias of `defaultExpiresIn` (and
    # OAUTH_ACCESS_TOKEN_EXPIRES_IN of OAUTH_ACCESS_TOKEN_DEFAULT_EXPIRES_IN),
    # read only while `defaultExpiresIn` is unset. Move an override to the new
    # key. See CHANGELOG.
    expiresIn = 3600
    expiresIn = ${?OAUTH_ACCESS_TOKEN_EXPIRES_IN}
  }
  refreshToken {
    expiresIn = 86400
    expiresIn = ${?OAUTH_REFRESH_TOKEN_EXPIRES_IN}
    # CC-2: handling for refresh tokens whose family_id is not in the store.
    # "reject" is safe-by-default. Use "accept" only during a migration window
    # (e.g. moving from v0.4.x in-memory family store to Redis while old
    # tokens are still in circulation).
    unknownFamilyPolicy = "reject"
    unknownFamilyPolicy = ${?OAUTH_REFRESH_TOKEN_UNKNOWN_FAMILY_POLICY}
    # SF-6 / Phase G / M6: refresh tokens lacking jti or
    # family_id claims when family rotation is wired are always rejected.
    # The `"accept-with-warning"` migration-window value was removed
    # in v0.6.0 along with the env-var override — there is no longer
    # an opt-in to bypass replay detection.
    legacyRtPolicy = "reject"
  }
  # IH-6: require `openid` in /authorize scope by default. `oauth.jwt.issuer`
  # is required of every deployment (#266), so it no longer doubles as the
  # "this is an OIDC Provider" signal — `oidcMode` is now that signal on its
  # own. Set "dual" for deployments that intentionally serve OAuth-only and
  # OIDC clients from the same authorization endpoint.
  oidcMode = "oidc-required"
  oidcMode = ${?OAUTH_OIDC_MODE}
  # #277: what POST /oauth/revoke does with an ACCESS token.
  #
  #   "denylist"    -- revocation writes the token's `jti` to the
  #                    `accessTokenDenylist` component, which token
  #                    verification and introspection consult. Boot FAILS when
  #                    the composition serves the revocation endpoint and no
  #                    denylist is wired: RFC 7009 forces a 200 response, so an
  #                    unwired denylist means the operator is told the token is
  #                    revoked while it keeps working until it expires.
  #   "unsupported" -- this deployment does not revoke access tokens. The
  #                    endpoint answers `unsupported_token_type` for
  #                    `token_type_hint = access_token` (RFC 7009 §2.2.1)
  #                    instead of a hollow 200, and no denylist is needed.
  #
  # REFRESH-token revocation is governed by neither value: it runs off
  # `refreshTokenFamilyRevocation` and works in both modes.
  #
  # Multi-replica deployments need a SHARED denylist -- the bundled memory one
  # forks per replica, which `core.deployment.mode = "multi"` refuses (see the
  # replica-safety guard). The standalone template wires the Redis-backed
  # denylist off the shared ioredis socket.
  revocation {
    accessToken = "denylist"
    accessToken = ${?OAUTH_REVOCATION_ACCESS_TOKEN}

    # #406: SUBJECT-level revocation -- the pair of stores a credential change
    # needs. `subjectSessionIndex` enumerates the sessions to cascade over;
    # `subjectRevocation` records the not-before watermark that refuses tokens
    # the cascade missed. One key for both because they are one capability: a
    # deployment that has neither has one thing to say.
    #
    #   "watermark"   -- the stores are wired and a credential change actually
    #                    invalidates what was already issued.
    #   "unsupported" -- this deployment has no subject-level revocation, on
    #                    purpose. A password reset leaves existing sessions and
    #                    access tokens working until they expire.
    #
    # Leave it UNSET when the stores are wired -- the guard only reads this key
    # when a slot is unfilled. Boot FAILS on an unfilled slot with no value
    # here, which is the whole point of #406: before it, a scaffolded
    # deployment got `subjectRevocation: undefined` and the watermark check,
    # the refresh-redemption gate (#376) and `revokeAllForSubject` all went
    # quiet with nothing failing and nothing warning.
    #
    # The standalone template wires both on either adapter branch, so it never
    # needs this. REFRESH-token family revocation is governed by neither value:
    # it runs off `refreshTokenFamilyRevocation` and works regardless.
    subject = ${?OAUTH_REVOCATION_SUBJECT}
  }
  # #297: require a verified email before issuing tokens for an end-user
  # subject. Reads `emailVerified` from the user record the Store returned --
  # issuing, delivering and confirming the verification are the Store's job,
  # not this library's.
  #
  # Off by default: `emailVerified` is Store data many Stores do not model, and
  # defaulting this on would refuse every user of every deployment that has not
  # adopted the field. Enforced at `/authorize` and on the `session` grant --
  # the two points that hold the user's session at issuance. `refresh_token`
  # and token-exchange are deliberately not gated: they derive from an artifact
  # that already passed the gate when it was issued.
  requireEmailVerified = false
  requireEmailVerified = ${?OAUTH_REQUIRE_EMAIL_VERIFIED}
  # #311: deny-by-absence for the per-client `allowedGrantTypes` allowlist.
  #
  # #268 made a DECLARED allowlist restrict which grants a client may use, and
  # kept absence meaning "unrestricted" -- the grants that ignored the field
  # predate it, so denying on absence would have revoked every grant from every
  # registration written before it existed. The consequence is that the secure
  # posture is opt-in per registration: a client whose record omits
  # `allowedGrantTypes` silently gets every grant, and nothing at the
  # deployment level can say otherwise.
  #
  # Set this to true once you have audited your registrations and every client
  # names its grants. A client that then omits the field is refused with
  # `unauthorized_client` at /oauth/token and at /authorize, rather than
  # inheriting everything.
  #
  # Independent of the per-grant rule (#326): `client_credentials` and the
  # WebAuthn grant already deny by absence on their own, whatever this is set
  # to. The two compose to the stricter of the pair.
  requireGrantTypeAllowlist = false
  requireGrantTypeAllowlist = ${?OAUTH_REQUIRE_GRANT_TYPE_ALLOWLIST}

  # #267: `/authorize` mints a code with no consent step, which is defensible
  # in a pure first-party OP and only there. It refuses any client not marked
  # `firstParty: true` in its registration -- one with no `firstParty` field
  # and one carrying an explicit `false` alike.
  #
  # This does NOT make /authorize safe against forced navigation for a client
  # that IS first-party -- that is the accepted model, and consent (#284) is
  # the step that changes it.
  #
  # #330: the one-time `allowUnmarkedClients` migration flag (#316/#317) was
  # removed. The substitution below is a deliberate tombstone, not a live
  # knob: it routes a still-exported OAUTH_AUTHORIZE_ALLOW_UNMARKED_CLIENTS
  # into the schema's removed-key error, so boot fails with migration
  # instructions instead of the variable being silently ignored. Mark your
  # client registrations, then delete the env var and boot clears.
  authorize {
    allowUnmarkedClients = ${?OAUTH_AUTHORIZE_ALLOW_UNMARKED_CLIENTS}
    # #481: the Authentication Context Class References /authorize will vouch
    # for, each mapped to the RFC 8176 `amr` values a session must carry (`pwd`
    # for a password login, `fed` for a federated login, `mfa` once a second
    # factor was verified) -- or to a list of such lists, any ONE of which
    # satisfies it (the MFA ADR's D15). `acr_values` is answered from this
    # table ALONE: a value it does not carry -- every value, while it is empty
    # -- is `unmet_authentication_requirements` at the redirect_uri, and
    # discovery advertises the keys as `acr_values_supported` only when there
    # are some. An entry, or an alternative, that requires nothing is refused
    # at boot: it would vouch for every session.
    #
    # An entry nothing installed can satisfy is DROPPED at boot -- not
    # advertised, answered `unmet_authentication_requirements` -- and logged
    # once as `acr_value_unsatisfiable`: at warn, or at info when only a second
    # factor is missing and no installed requirement reaches one. What can be
    # satisfied: `pwd`; a second factor's values once MFA is installed (`mfa`
    # when an installed factor adds it); `fed` while a federation is
    # installed; and anything else while an installed federation has
    # `trustUpstreamAmr` on, since its callback then records the upstream
    # IdP's `amr` beside `fed`.
    #
    #   acrValues {
    #     "urn:example:pwd" = ["pwd"]
    #     "urn:example:mfa" = ["pwd", "mfa"]
    #     "urn:example:phr" = [["hwk"], ["swk"]]
    #   }
    acrValues {}
  }
  # IH-16: hard ceiling on the OIDC `nonce` query parameter at /authorize.
  # Standard OIDC clients generate 22-44 char base64url nonces; 256 leaves
  # ~2x headroom for non-standard RPs. Operators with stricter requirements
  # set OAUTH_NONCE_MAX_LENGTH.
  nonce {
    maxLength = 256
    maxLength = ${?OAUTH_NONCE_MAX_LENGTH}
  }
  # Wave 1 §5.3 / RFC 8707: opt-in gate for Resource Indicator enforcement.
  # Secure-by-default: off at the library layer. Operators enable via
  # `OAUTH_RESOURCE_INDICATOR_ENABLED=true` or by overriding `enabled = true`
  # in their own application.conf layer.
  # Pattern: literal false + env-override line (PR #171):
  # the literal provides the anchor so HOCON env-substitution has a binding
  # point; without it ${?VAR} is silently dropped when the env var is unset.
  resourceIndicator {
    enabled = false
    enabled = ${?OAUTH_RESOURCE_INDICATOR_ENABLED}
  }
}

# Core's own section.
#
# `deployment.mode`: how many replicas this deployment runs. No default
# literal here on purpose. "unset" is a meaningful third state and a baked-in
# "single" would make it unreachable:
#
#   multi   -> boot FAILS if any in-memory shared store is wired, naming every
#              offender. Set this once you scale past one replica.
#   single  -> you have declared one replica; in-memory stores are correct and
#              boot says nothing.
#   unset   -> nothing declared. Boot logs one `replica_unsafe_adapters`
#              warning naming what is held in this process's memory and what
#              each one costs when scaled.
#
# NOTE: no boot check can catch scaling to N replicas without setting this —
# a process whose state is all in its own memory has no shared medium through
# which to see peers. The warning and the docs are what cover that case.
#
# `sessionRequirements.expected` (the session-admission ADR's D7): the
# session requirements this composition expects -- the extensions that change
# what "logged in" means, MFA among them -- compared at boot with what the
# installed modules register. Once written, it is compared both ways, whether
# or not anything consults session admission: a name declared that no module
# registers refuses the boot (`session-requirement-missing`), and so does a
# requirement registered but not declared (`session-requirements-undeclared`).
# REQUIRED whenever a module that consults session admission is installed (the
# oauth module is one), and refused unwritten there
# (`session-requirements-undeclared`); `[]` says "none". No default and no
# variable: a composition states its posture, writing what it installs, or
# what its composition root declares.
#
#   core.sessionRequirements.expected = ["mfa"]
#
# `declaredAbsent`: the slots this composition runs without on purpose, by
# their keys. A module that reads an optional slot whose silent absence would
# cost something attaches an absence policy to it, and boot refuses an
# unfilled one the list does not name (`component-absence-undeclared`).
# `auditSink` is one: without a sink every security event the routes emit is
# discarded. No default and no variable: a composition that runs without a
# sink says so where it is read.
#
#   core.declaredAbsent = ["auditSink"]
#
# `tokenBinding`: the settings across every mechanism installed at core's
# token-binding extension point (DPoP, mTLS, ...), read by core alone.
#
#   dispatchPolicy -- how the token endpoint's binding middleware arbitrates
#     between mechanisms on one request:
#       "intent-explicit" (default): explicit-intent mechanisms (DPoP) win
#         over ambient ones (mTLS); two or more explicit successes, or two or
#         more ambient successes with no explicit one -> 400 invalid_request.
#       "strict-mutual-exclusion": any two or more successes -> 400.
#     See ADR `packages/core/docs/adr/2026-05-20-token-binding-first-class-abstraction.md`.
#
#   bindConfidentialClientRefreshTokens -- also bind a CONFIDENTIAL client's
#     refresh token to the presented DPoP key / client certificate. Public
#     clients are bound either way.
#
#     Neither RFC requires the public-client restriction and neither forbids
#     lifting it: RFC 9449 §5's "refresh tokens issued to confidential clients
#     ... are not bound" is descriptive prose with no RFC 2119 keyword (the
#     three MUSTs beside it are all about public clients), and RFC 8705 §7.1
#     says the same about certificates. Their rationale holds here -- this
#     server refuses an unauthenticated refresh and refuses a refresh token
#     whose `azp` is not the authenticated client -- so a stolen refresh token
#     is already unusable without the client's own credential.
#
#     Turn this on only if your DPoP key or client certificate is protected
#     BETTER than your client secret (key in an HSM/TPM, secret in an env
#     var). That is the one case where it adds anything: leaking the secret
#     alone is then not enough.
#
#     The cost, and why it is off by default: a bound refresh token pins the
#     client to ONE key or certificate for the refresh token's whole lifetime
#     (days). Rotating mid-lifetime breaks refresh until the client
#     re-authenticates from scratch.
#
# `deployment.mode`, `sessionRequirements.expected` and `federations`, at the
# top level, and `oauth.tokenBinding`, refuse boot naming these paths. DEPLOYMENT_MODE is
# declared renamed CORE_DEPLOYMENT_MODE, and OAUTH_TOKEN_BINDING_DISPATCH_POLICY
# and OAUTH_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS their
# CORE_TOKEN_BINDING_* names; `renamed-variables` below captures both names of
# each as this file is resolved: boot refuses an old name set unless its new
# name is set to the same value.
core {
  deployment {
    mode = ${?CORE_DEPLOYMENT_MODE}
  }
  # The federations this deployment runs, keyed by the name each is reached
  # at. Which to run is a deployment's decision: none ships here, and none is
  # active unless a layer above declares it with `enabled = true`. A key of
  # one is bound to the variable named after its path,
  # `CORE_FEDERATIONS_<NAME>_<KEY>`.
  federations {}
  tokenBinding {
    dispatchPolicy = "intent-explicit"
    dispatchPolicy = ${?CORE_TOKEN_BINDING_DISPATCH_POLICY}
    bindConfidentialClientRefreshTokens = false
    bindConfidentialClientRefreshTokens = ${?CORE_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS}
  }
}

# The JWKS module's section (`jwksModule`): where the verification keys are
# published, under the issuer, and for how long a verifier may cache them.
#
#   path        -- default /.well-known/jwks.json. An absolute path, with no
#                  "//", dot-segment, query, fragment, backslash,
#                  percent-encoding or control character.
#   cacheMaxAge -- `Cache-Control: public, max-age`, in seconds; default 300.
#                  Keep it well below the key-overlap window, so a rotated kid
#                  reaches caching verifiers in time.
#
# `oauth.jwt.jwksPath` and `oauth.jwt.jwksCacheMaxAge` refuse boot naming
# these paths wherever the module is installed.
jwks {
  path = ${?JWKS_PATH}
  cacheMaxAge = ${?JWKS_CACHE_MAX_AGE}
}

# The in-process rate limiter's own section (`memoryRateLimiterModule`,
# `core-rate-limiter-memory`), read when the composition wires it.
#
# `maxBuckets` bounds the counters it holds. Multi-replica production uses the
# Redis limiter; this cap keeps the single-process one from growing without
# limit.
#
# `limits { <prefix> { limit, windowSeconds } }` overrides the per-prefix spec
# for keys of the form `<prefix>:...`; `defaultLimit` is the budget every key
# whose prefix has neither an entry in `limits` nor a budget its owning module
# contributes falls back to. A window is at most one year (31536000 s). The
# adapter refuses a spec it cannot apply as written when it is built, and
# never serves its default in its place.
#
# A prefix's owning module contributes its budget from its own settings,
# which the limiter applies when `limits` declares no entry for it; each
# package's README names its prefixes and keys. Restating such a budget here
# is two numbers that must agree, the drift bug; declaring one anyway
# overrides the contributed budget — an explicit statement about this
# limiter wins. A prefix whose owner is not installed has no budget, and
# falls to `defaultLimit`. The boot line `rate_limit_budgets_registered`
# lists each prefix with its contributed budget and the module that set it;
# an entry here wins over that budget and is not shown.
#
# `memoryRateLimiter`, the section's old path, refuses boot naming this one
# wherever the module is installed. MEMORY_RATE_LIMITER_MAX_BUCKETS is
# declared renamed CORE_RATE_LIMITER_MEMORY_MAX_BUCKETS, and
# `renamed-variables` below captures both names.
core-rate-limiter-memory {
  maxBuckets = 10000
  maxBuckets = ${?CORE_RATE_LIMITER_MEMORY_MAX_BUCKETS}
  defaultLimit { limit = 60, windowSeconds = 60 }
}

# The in-process grant store's own section (`memoryFederationGrantStoreModule`,
# `core-federation-grant-store-memory`). `tombstoneRetention` is how long a
# revoked or expired grant still answers the status route, in seconds, at most
# one year (31536000); zero keeps no tombstones. It is taken at creation and
# kept with the record, so changing it applies to grants created afterwards.
# `federationGrants.tombstoneRetention`, its old path, refuses boot naming this
# one wherever the module is installed.
core-federation-grant-store-memory {
  tombstoneRetention = 2592000
}

# What the resolution saw of each environment variable core's own section and
# core's own modules renamed: each name null, then its value when set. Boot
# judges these and removes the section before it parses the configuration.
# Never write it in another layer.
renamed-variables {
  DEPLOYMENT_MODE = null
  DEPLOYMENT_MODE = ${?DEPLOYMENT_MODE}
  CORE_DEPLOYMENT_MODE = null
  CORE_DEPLOYMENT_MODE = ${?CORE_DEPLOYMENT_MODE}
  MEMORY_RATE_LIMITER_MAX_BUCKETS = null
  MEMORY_RATE_LIMITER_MAX_BUCKETS = ${?MEMORY_RATE_LIMITER_MAX_BUCKETS}
  CORE_RATE_LIMITER_MEMORY_MAX_BUCKETS = null
  CORE_RATE_LIMITER_MEMORY_MAX_BUCKETS = ${?CORE_RATE_LIMITER_MEMORY_MAX_BUCKETS}
  OAUTH_TOKEN_BINDING_DISPATCH_POLICY = null
  OAUTH_TOKEN_BINDING_DISPATCH_POLICY = ${?OAUTH_TOKEN_BINDING_DISPATCH_POLICY}
  CORE_TOKEN_BINDING_DISPATCH_POLICY = null
  CORE_TOKEN_BINDING_DISPATCH_POLICY = ${?CORE_TOKEN_BINDING_DISPATCH_POLICY}
  OAUTH_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS = null
  OAUTH_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS = ${?OAUTH_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS}
  CORE_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS = null
  CORE_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS = ${?CORE_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS}
}
