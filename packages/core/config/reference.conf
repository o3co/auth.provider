# Core's own section.
#
# `deployment.mode`: how many replicas this deployment runs. No default
# literal here on purpose. "unset" is a meaningful third state and a baked-in
# "single" would make it unreachable:
#
#   multi   -> boot FAILS if any in-memory shared store is wired, naming every
#              offender. Set this once you scale past one replica.
#   single  -> you have declared one replica; in-memory stores are correct and
#              boot says nothing.
#   unset   -> nothing declared. Boot logs one `replica_unsafe_adapters`
#              warning naming what is held in this process's memory and what
#              each one costs when scaled.
#
# NOTE: no boot check can catch scaling to N replicas without setting this —
# a process whose state is all in its own memory has no shared medium through
# which to see peers. The warning and the docs are what cover that case.
#
# `sessionRequirements.expected`: the
# session requirements this composition expects -- the extensions that change
# what "logged in" means, MFA among them -- compared at boot with what the
# installed modules register. Once written, it is compared both ways, whether
# or not anything consults session admission: a name declared that no module
# registers refuses the boot (`session-requirement-missing`), and so does a
# requirement registered but not declared (`session-requirements-undeclared`).
# REQUIRED whenever a module that consults session admission is installed (the
# oauth module is one), and refused unwritten there
# (`session-requirements-undeclared`); `[]` says "none". No default and no
# variable: a composition states its posture, writing what it installs, or
# what its composition root declares.
#
#   core.sessionRequirements.expected = ["mfa"]
#
# `sessionRequirements.secondFactorAuthority`: the expected requirement this
# composition holds to the second-factor authority -- the one requirement that
# may vouch for a second factor. Once written, boot refuses it unless
# `sessionRequirements.expected` names it and the requirement registered under
# it declares the authority (`second-factor-authority-not-declared`), so a
# requirement merely called what the composition expects cannot stand in for
# MFA. Optional; no default and no variable.
#
#   core.sessionRequirements.secondFactorAuthority = "mfa"
#
# `declaredAbsent`: the slots this composition runs without on purpose, by
# their keys. A module that reads an optional slot whose silent absence would
# cost something attaches an absence policy to it, and boot refuses an
# unfilled one the list does not name (`component-absence-undeclared`).
# `auditSink` is one: without a sink every security event the routes emit is
# discarded. `rateLimiter` is another, whose policy core attaches wherever a
# module reads the slot: without a limiter, a route that keys it lets each
# request through; no module falls back to a per-process limiter. The MFA
# routes are limited only by the wired limiter, its `limits.mfa` or else its
# `defaultLimit`. A verifier's own attempt limit (the session login, device
# verification) is counted on the `attemptCounter` slot, never on a limiter.
# No default and no variable: a composition that runs without either says so
# where it is read.
#
#   core.declaredAbsent = ["auditSink", "rateLimiter"]
#
# `sessionLifecycle.sweepIntervalSeconds`: how often the session lifecycle
# module resumes the session closes left pending, in whole seconds; 0 turns
# the sweep off. No variable.
#
# `tokenBinding`: the settings across every mechanism installed at core's
# token-binding extension point (DPoP, mTLS, ...), read by core alone.
#
#   dispatchPolicy -- how the token endpoint's binding middleware arbitrates
#     between mechanisms on one request:
#       "intent-explicit" (default): explicit-intent mechanisms (DPoP) win
#         over ambient ones (mTLS); two or more explicit successes, or two or
#         more ambient successes with no explicit one -> 400 invalid_request.
#       "strict-mutual-exclusion": any two or more successes -> 400.
#     See ADR `packages/core/docs/adr/2026-05-20-token-binding-first-class-abstraction.md`.
#
#   bindConfidentialClientRefreshTokens -- also bind a CONFIDENTIAL client's
#     refresh token to the presented DPoP key / client certificate. Public
#     clients are bound either way.
#
#     Neither RFC requires the public-client restriction and neither forbids
#     lifting it: RFC 9449 §5's "refresh tokens issued to confidential clients
#     ... are not bound" is descriptive prose with no RFC 2119 keyword (the
#     three MUSTs beside it are all about public clients), and RFC 8705 §7.1
#     says the same about certificates. Their rationale holds here -- this
#     server refuses an unauthenticated refresh and refuses a refresh token
#     whose `azp` is not the authenticated client -- so a stolen refresh token
#     is already unusable without the client's own credential.
#
#     Turn this on only if your DPoP key or client certificate is protected
#     BETTER than your client secret (key in an HSM/TPM, secret in an env
#     var). That is the one case where it adds anything: leaking the secret
#     alone is then not enough.
#
#     The cost, and why it is off by default: a bound refresh token pins the
#     client to ONE key or certificate for the refresh token's whole lifetime
#     (days). Rotating mid-lifetime breaks refresh until the client
#     re-authenticates from scratch.
#
# `deployment.mode`, `sessionRequirements.expected` and `federations`, at the
# top level, and `oauth.tokenBinding`, refuse boot naming these paths. DEPLOYMENT_MODE is
# declared renamed CORE_DEPLOYMENT_MODE, and OAUTH_TOKEN_BINDING_DISPATCH_POLICY
# and OAUTH_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS their
# CORE_TOKEN_BINDING_* names; `renamed-variables` below captures both names of
# each as this file is resolved: boot refuses an old name set, whether or not
# its new name is set.
core {
  deployment {
    mode = ${?CORE_DEPLOYMENT_MODE}
  }
  # The federations this deployment runs, keyed by the name each is reached
  # at. Which to run is a deployment's decision: none ships here, and none is
  # active unless a layer above declares it with `enabled = true`. Every
  # entry names its `type`, enabled or not: the federationTypes key of the
  # installed module that handles it. A key of one is bound to the variable
  # named after its path, `CORE_FEDERATIONS_<NAME>_<KEY>`.
  federations {}
  # The destination policy of every fetch of a URL a client registration or a
  # request supplies (createOutboundFetch): https only, no credentials in the
  # URL, the Fetch standard's bad ports refused, no redirects followed, an
  # identity-encoded answer only, and every address the host resolves to
  # outside the RFC 6890 special-use ranges. The connection goes to the
  # address that was checked. The lists take a host name (letters, digits and
  # hyphens once IDNA has run; no wildcard) or an IP address, or a `.suffix`
  # (the domain and every subdomain), as a list or a comma-separated string.
  #
  # IPv6-only networks that reach IPv4 through NAT64 (64:ff9b::/96) are not
  # supported: those addresses are special-use, so an IPv4-only host is
  # refused there. Network-level egress filtering is still expected.
  outbound {
    # Empty admits any host the rules admit; otherwise only these (an
    # internal host too, which must then be listed here and below).
    allowedHosts = []
    allowedHosts = ${?CORE_OUTBOUND_ALLOWED_HOSTS}
    # Refused, whatever the other lists say.
    deniedHosts = []
    deniedHosts = ${?CORE_OUTBOUND_DENIED_HOSTS}
    # Admitted at loopback, private or link-local addresses -- for a URL from
    # a client registration only, never one a request names. Plain http is
    # admitted only to a loopback host listed here.
    internalHosts = []
    internalHosts = ${?CORE_OUTBOUND_INTERNAL_HOSTS}
    # One deadline over resolution, connection, TLS, headers and body. A
    # ceiling: a caller may ask for a shorter one, never a longer one.
    timeoutMs = 5000
    timeoutMs = ${?CORE_OUTBOUND_TIMEOUT_MS}
    # The most bytes of a 2xx body that are read; a larger answer is refused.
    # A ceiling: a caller may ask for a lower cap, never a higher one.
    maxResponseBytes = 65536
    maxResponseBytes = ${?CORE_OUTBOUND_MAX_RESPONSE_BYTES}
    # A proxy or dispatcher installed in code is not consulted: outbound
    # client-metadata fetches connect directly. While HTTPS_PROXY / HTTP_PROXY
    # is set, building the fetch refuses unless this is "direct".
    egress = ${?CORE_OUTBOUND_EGRESS}
  }
  sessionLifecycle {
    sweepIntervalSeconds = 60
  }
  tokenBinding {
    dispatchPolicy = "intent-explicit"
    dispatchPolicy = ${?CORE_TOKEN_BINDING_DISPATCH_POLICY}
    bindConfidentialClientRefreshTokens = false
    bindConfidentialClientRefreshTokens = ${?CORE_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS}
  }
}

# The JWKS module's section (`jwksModule`): where the verification keys are
# published, under the issuer, and for how long a verifier may cache them.
#
#   path        -- default /.well-known/jwks.json. An absolute path, with no
#                  "//", dot-segment, query, fragment, backslash,
#                  percent-encoding or control character.
#   cacheMaxAge -- `Cache-Control: public, max-age`, in seconds; default 300.
#                  Keep it well below the key-overlap window, so a rotated kid
#                  reaches caching verifiers in time.
#
# `oauth.jwt.jwksPath` and `oauth.jwt.jwksCacheMaxAge` refuse boot naming
# these paths wherever the module is installed.
jwks {
  path = ${?JWKS_PATH}
  cacheMaxAge = ${?JWKS_CACHE_MAX_AGE}
}

# The in-process rate limiter's own section (`memoryRateLimiterModule`,
# `core-rate-limiter-memory`), read when the composition wires it.
#
# `maxBuckets` bounds the counters it holds. Multi-replica production uses the
# Redis limiter; this cap keeps the single-process one from growing without
# limit.
#
# `limits { <prefix> { limit, windowSeconds } }` sets the budget for keys of
# the form `<prefix>:...`; `defaultLimit` is the budget every key whose prefix
# has no entry in `limits` falls back to. Nothing else sets a budget: the
# modules that key the limiter claim their prefixes and contribute none. A
# window is at most one year (31536000 s). The adapter refuses a spec it
# cannot apply as written when it is built, and never serves its default in
# its place.
#
# Each package's README names the prefixes it claims and its keys. `login`
# and `device_verification` are refused here while their owning module
# (session, device-grant) is loaded: each declares its prefix a verifier's own
# attempt limit, set at `session.rateLimit.login` and `device-grant.rateLimit`
# and counted on the attempt counter, which no limiter loosens. The boot line
# `rate_limit_budgets_registered` lists each claimed prefix with the module
# that claimed it.
#
# `memoryRateLimiter`, the section's old path, refuses boot naming this one
# wherever the module is installed. MEMORY_RATE_LIMITER_MAX_BUCKETS is
# declared renamed CORE_RATE_LIMITER_MEMORY_MAX_BUCKETS, and
# `renamed-variables` below captures both names.
core-rate-limiter-memory {
  maxBuckets = 10000
  maxBuckets = ${?CORE_RATE_LIMITER_MEMORY_MAX_BUCKETS}
  defaultLimit { limit = 60, windowSeconds = 60 }
}

# The in-process grant store's own section (`memoryFederationGrantStoreModule`,
# `core-federation-grant-store-memory`). `tombstoneRetention` is how long a
# revoked or expired grant still answers the status route, in seconds, at most
# one year (31536000); zero keeps no tombstones. It is taken at creation and
# kept with the record, so changing it applies to grants created afterwards.
# `federationGrants.tombstoneRetention`, its old path, refuses boot naming this
# one wherever the module is installed.
core-federation-grant-store-memory {
  tombstoneRetention = 2592000
}

# What the resolution saw of each environment variable core's own section and
# core's own modules renamed: each name null, then its value when set. Boot
# judges these and removes the section before it parses the configuration.
# Never write it in another layer.
renamed-variables {
  DEPLOYMENT_MODE = null
  DEPLOYMENT_MODE = ${?DEPLOYMENT_MODE}
  CORE_DEPLOYMENT_MODE = null
  CORE_DEPLOYMENT_MODE = ${?CORE_DEPLOYMENT_MODE}
  MEMORY_RATE_LIMITER_MAX_BUCKETS = null
  MEMORY_RATE_LIMITER_MAX_BUCKETS = ${?MEMORY_RATE_LIMITER_MAX_BUCKETS}
  CORE_RATE_LIMITER_MEMORY_MAX_BUCKETS = null
  CORE_RATE_LIMITER_MEMORY_MAX_BUCKETS = ${?CORE_RATE_LIMITER_MEMORY_MAX_BUCKETS}
  OAUTH_TOKEN_BINDING_DISPATCH_POLICY = null
  OAUTH_TOKEN_BINDING_DISPATCH_POLICY = ${?OAUTH_TOKEN_BINDING_DISPATCH_POLICY}
  CORE_TOKEN_BINDING_DISPATCH_POLICY = null
  CORE_TOKEN_BINDING_DISPATCH_POLICY = ${?CORE_TOKEN_BINDING_DISPATCH_POLICY}
  OAUTH_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS = null
  OAUTH_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS = ${?OAUTH_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS}
  CORE_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS = null
  CORE_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS = ${?CORE_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS}
}
