http {
  port = 3000
  port = ${?HTTP_PORT}
  trustProxy = false
  trustProxy = ${?HTTP_TRUST_PROXY}
}

oauth {
  jwt {
    issuer = ${?OAUTH_JWT_ISSUER}
    # SF-1 / Phase G / S2: the central JWT verifier rejects
    # tokens whose `typ` header is absent. The previous v0.5.x default
    # accepted typ-less tokens (with a `jwt_verify_legacy_typ` warning)
    # to keep v0.4.x tokens verifying through the migration window;
    # v0.6.0 closes that window by default. Operators with v0.4.x
    # tokens still in circulation can opt back via
    # `OAUTH_JWT_LEGACY_TYP_ACCEPT=true` for their own bounded migration
    # window, but the safe default is now `false` (reject typ-less tokens
    # as a hard signal of misconfiguration or downgrade attack).
    legacyTypAccept = false
    legacyTypAccept = ${?OAUTH_JWT_LEGACY_TYP_ACCEPT}
    signingKey {
      provider = "local"
      provider = ${?OAUTH_JWT_SIGNING_KEY_PROVIDER}
      local {
        algorithm = "HS256"
        algorithm = ${?OAUTH_JWT_ALGORITHM}
        kid = "v0"
        kid = ${?OAUTH_JWT_KID}
        secret = ${?OAUTH_JWT_SECRET}
        privateKeyPath = ${?OAUTH_JWT_PRIVATE_KEY_PATH}
        publicKeyPath = ${?OAUTH_JWT_PUBLIC_KEY_PATH}
        privateKey = ${?OAUTH_JWT_PRIVATE_KEY}
        publicKey = ${?OAUTH_JWT_PUBLIC_KEY}
        # IH-9: HS256 key rotation uses `previousSecrets` (kid + secret +
        # expiresAt). Asymmetric algorithms (RS256/ES256/EdDSA) use the
        # separate `previousKeys` field — the schema is a discriminated
        # union so the wrong shape is rejected at boot rather than
        # silently dropped at verification time. Default HOCON ships
        # only `previousSecrets = []` because the default algorithm is
        # HS256 and the strict HS256 branch rejects unknown fields.
        # Asymmetric operators add `previousKeys = [{...}]` to their
        # override layer.
        previousSecrets = []
      }
    }
  }
  accessToken {
    expiresIn = 3600
    expiresIn = ${?OAUTH_ACCESS_TOKEN_EXPIRES_IN}
  }
  refreshToken {
    expiresIn = 86400
    expiresIn = ${?OAUTH_REFRESH_TOKEN_EXPIRES_IN}
    # CC-2: handling for refresh tokens whose family_id is not in the store.
    # "reject" is safe-by-default. Use "accept" only during a migration window
    # (e.g. moving from v0.4.x in-memory family store to Redis while old
    # tokens are still in circulation).
    unknownFamilyPolicy = "reject"
    unknownFamilyPolicy = ${?OAUTH_REFRESH_TOKEN_UNKNOWN_FAMILY_POLICY}
    # SF-6 / Phase G / M6: refresh tokens lacking jti or
    # family_id claims when family rotation is wired are always rejected.
    # The `"accept-with-warning"` migration-window value was removed
    # in v0.6.0 along with the env-var override — there is no longer
    # an opt-in to bypass replay detection.
    legacyRtPolicy = "reject"
  }
  # Secure-by-default baseline: all built-in grants are off at the library
  # layer. Deployments opt in by setting `enabled = true` (and repeating the
  # env-override line) in their own application.conf layer, as the standalone
  # template does for session / authorization_code / refresh_token.
  # This enforces the `feedback_secure_default_opt_in` discipline: a grant is
  # active only when a consumer explicitly declares it.
  grants {
    session            { enabled = false, enabled = ${?OAUTH_GRANTS_SESSION_ENABLED} }
    authorization_code { enabled = false, enabled = ${?OAUTH_GRANTS_AUTHORIZATION_CODE_ENABLED} }
    refresh_token      { enabled = false, enabled = ${?OAUTH_GRANTS_REFRESH_TOKEN_ENABLED} }
    client_credentials { enabled = false, enabled = ${?OAUTH_GRANTS_CLIENT_CREDENTIALS_ENABLED} }
  }
  # IH-6: when acting as an OIDC Provider (`oauth.jwt.issuer` set),
  # require `openid` in /authorize scope by default. Set "dual" only for
  # deployments that intentionally serve OAuth-only and OIDC clients from
  # the same authorization endpoint.
  oidcMode = "oidc-required"
  oidcMode = ${?OAUTH_OIDC_MODE}
  # OR-9: adapter switch for the OAuth authorization-code repository.
  # Multi-replica production MUST set this to "redis" — the memory adapter
  # loses codes on restart and across replicas.
  #
  # No default literal here on purpose: the legacy `repositories.code.type`
  # fallback in `buildModules` only runs when `oauth.code.adapter` is
  # absent, so a baked-in default would make the legacy override path dead
  # code for any deployment that inherits this core HOCON. Operators who
  # want to opt into the new switch set `OAUTH_CODE_ADAPTER` (or override
  # in their own config layer); pre-OR-9 deployments that still rely on
  # `CLIENT_CODE_TYPE=redis` keep working through the deprecation window.
  code {
    adapter = ${?OAUTH_CODE_ADAPTER}
  }
  # IH-16: hard ceiling on the OIDC `nonce` query parameter at /authorize.
  # Standard OIDC clients generate 22-44 char base64url nonces; 256 leaves
  # ~2x headroom for non-standard RPs. Operators with stricter requirements
  # set OAUTH_NONCE_MAX_LENGTH.
  nonce {
    maxLength = 256
    maxLength = ${?OAUTH_NONCE_MAX_LENGTH}
  }
  # F10: maximum existing RFC 8693 actor chain depth accepted before adding
  # the current actor. Depth 3 allows one current actor plus two prior nested
  # actors; lower for stricter delegation environments.
  tokenExchange {
    maxActorChainDepth = 3
    maxActorChainDepth = ${?OAUTH_TOKEN_EXCHANGE_MAX_ACTOR_CHAIN_DEPTH}
  }
  # Wave 1 §5.3 / RFC 8707: opt-in gate for Resource Indicator enforcement.
  # Secure-by-default: off at the library layer. Operators enable via
  # `OAUTH_RESOURCE_INDICATOR_ENABLED=true` or by overriding `enabled = true`
  # in their own application.conf layer.
  # Pattern: literal false + env-override line (PR #171 / feedback_secure_default_opt_in):
  # the literal provides the anchor so HOCON env-substitution has a binding
  # point; without it ${?VAR} is silently dropped when the env var is unset.
  resourceIndicator {
    enabled = false
    enabled = ${?OAUTH_RESOURCE_INDICATOR_ENABLED}
  }
  # Wave 2 cross-mechanism dispatch refactor: a single source of truth for
  # the dispatch policy applied across all installed binding-mechanism
  # modules (DPoP, mTLS, ...). The synthesized `tokenBindingMw` in
  # `assembleApp` reads this key and arbitrates across mechanisms.
  #
  #   "intent-explicit" (default): explicit-intent mechanisms (DPoP) win
  #     over ambient mechanisms (mTLS) on a single request. ≥2 explicit
  #     mechanisms succeeding → 400 invalid_request.
  #   "strict-mutual-exclusion": any 2+ mechanisms succeeding → 400.
  #
  # Per `.claude/superpowers/specs/2026-05-19-wave-2-cross-mechanism-dispatch-refactor-spec.md` §4.2.
  tokenBinding {
    dispatch-policy = "intent-explicit"
    dispatch-policy = ${?OAUTH_TOKEN_BINDING_DISPATCH_POLICY}
  }
}

session {
  secret = ${?SESSION_SECRET}
  # MIN-2: __Host- prefix requires Secure, Path=/, and no Domain attribute.
  # If SESSION_SECURE=false or SESSION_DOMAIN is set, also override
  # SESSION_NAME to a non-__Host- value.
  name = "__Host-auth.session"
  name = ${?SESSION_NAME}
  maxAge = 3600000
  maxAge = ${?SESSION_MAX_AGE}
  secure = true
  secure = ${?SESSION_SECURE}
  sameSite = "lax"
  sameSite = ${?SESSION_SAME_SITE}
  domain = null
  domain = ${?SESSION_DOMAIN}
  storage {
    type = "redis"
    type = ${?SESSION_STORAGE_TYPE}
    redis {
      url = "redis://localhost:6379"
      url = ${?SESSION_STORAGE_REDIS_URL}
      password = ${?SESSION_STORAGE_REDIS_PASSWORD}
    }
  }
}

rateLimit {
  login { windowMs = 900000, limit = 20 }
  # OR-5: fail-mode policy for the OAuth-endpoint rate limiter when its
  # backend errors. "closed" returns HTTP 503 — secure-by-default load
  # shedding. Deployments that prefer fail-open ("open" preserves traffic
  # + adds logger.error emission) override in their own application.conf.
  failMode = "closed"
  failMode = ${?RATE_LIMIT_FAIL_MODE}
}

# federations: individual provider declarations are consumer territory
# (which providers to enable is a deployment decision, not library policy).
# The empty block satisfies the AppConfigSchema record type constraint;
# consumers declare their providers in application.conf above this layer.
# ADR I4 strict-required (declared = active) is maintained: no provider
# is active unless explicitly declared with `enabled = true` in the
# consumer layer.
federations {}

repositories {
  client {
    type = "yaml"
    type = ${?CLIENT_TYPE}
    yaml {
      path = "./config/clients.yaml"
      path = ${?CLIENT_PATH}
    }
  }
  user {
    type = "yaml"
    type = ${?CLIENT_USER_TYPE}
    yaml {
      path = "./config/users.yaml"
      path = ${?CLIENT_USER_PATH}
    }
    http {
      authenticateUrl = ${?CLIENT_USER_AUTHENTICATE_URL}
      authenticateByTokenUrl = ${?CLIENT_USER_AUTHENTICATE_BY_TOKEN_URL}
      timeout = 5000
      timeout = ${?CLIENT_USER_TIMEOUT}
    }
  }
  code {
    type = "memory"
    type = ${?CLIENT_CODE_TYPE}
    memory {
      defaultExpiresIn = 600
      defaultExpiresIn = ${?CLIENT_CODE_DEFAULT_EXPIRES_IN}
    }
    redis {
      defaultExpiresIn = 600
      defaultExpiresIn = ${?CLIENT_CODE_DEFAULT_EXPIRES_IN}
      endpointUri = ${?CLIENT_CODE_ENDPOINT_URI}
      password = ${?CLIENT_CODE_PASSWORD}
    }
  }
}

endpoints {
  login {
    # IH-17: hard default required because `fullSectionsSchema` now declares
    # `endpoints.login.url` as `z.string()` (was `.optional()`); pure env-var
    # form alone causes parse failure when `ENDPOINTS_LOGIN_URL` is unset.
    url = "/login"
    url = ${?ENDPOINTS_LOGIN_URL}
  }
  # IH-10: `client { url }` and `authCallback { url }` removed — no
  # production consumer reads them. Federation provider callback URLs
  # are configured per-provider (e.g. `federations.google.callbackURL`).
}

cors {
  allowedOrigins = []
}

# Wave 5d (IH-14 + OR-M1 + OR-4): adapter switches for the OAuth-endpoint
# rate limiter and the four user-session stores. Defaults are `"memory"`
# for backward compat with existing single-instance deployments.
# Multi-replica production MUST set BOTH to `"redis"` and provide a
# shared Redis 7.2+ instance — otherwise rate-limit counters and session
# state are isolated per replica and produce inconsistent behavior.
rateLimiter {
  adapter = "memory"
  adapter = ${?RATE_LIMITER_ADAPTER}
}

memoryRateLimiter {
  # SF-10: bound the in-memory OAuth endpoint rate-limiter bucket map.
  # Multi-replica production should use `rateLimiter.adapter = "redis"`;
  # this cap keeps the single-process fallback from growing without limit.
  maxBuckets = 10000
  maxBuckets = ${?MEMORY_RATE_LIMITER_MAX_BUCKETS}
}

userSessionStores {
  adapter = "memory"
  adapter = ${?USER_SESSION_STORES_ADAPTER}
}

# MIN-3: outer namespace for the four bundled Redis user-session stores.
# The module appends fixed sub-prefixes (`us:`, `rp:`, `fi:`, `fed:`).
# Multi-tenant Redis deployments should set a deployment-specific value,
# e.g. `tenant-a:ss:`.
redisSessionStores {
  keyPrefix = "ss:"
  keyPrefix = ${?REDIS_SESSION_STORES_KEY_PREFIX}
}

# D-2 v2 + Wave 5d: ioredis connection-config consumed by the shared
# `standaloneRedisClientsModule` in the standalone composition root. One
# ioredis socket per replica backs ALL Redis-typed clients (RT family +
# 4 user-session stores + rate limiter). Module-internal config (keyPrefix
# / casRetryLimit) lives separately under `redisRefreshTokenFamilyStore.*`
# (consumed by `redisRefreshTokenFamilyStoreModule.configSchema`). Both
# top-level keys coexist — they govern different layers of the same store.
redisRefreshTokenFamilyStore {
  keyPrefix = "rtfam:"
  keyPrefix = ${?REFRESH_TOKEN_FAMILY_STORE_KEY_PREFIX}
  casRetryLimit = 3
  casRetryLimit = ${?REFRESH_TOKEN_FAMILY_STORE_CAS_RETRY_LIMIT}
}

# OR-9 (Wave 5d): module-internal config for `redisCodeRepositoryModule`.
# Consumed when `oauth.code.adapter = "redis"`. The shared ioredis socket
# (`standaloneRedisClientsModule`) provides the `codeRepositoryClient`
# slot; this section governs only key namespacing and the default
# expiry-in-seconds the repository uses when /authorize doesn't supply one.
#
# Multi-tenant deployments override `keyPrefix` to isolate tenants in the
# same Redis instance — e.g. `keyPrefix = "tenant-a:code:"` keeps tenant A's
# codes from colliding with tenant B's under the default `oauth:code:`
# prefix (MIN-3 advisory).
redisCodeRepository {
  # No literal default for keyPrefix — the RedisCodeRepository constructor
  # falls back to `oauth:code:` when this field is absent. Operators that
  # need multi-tenant isolation set CLIENT_CODE_KEY_PREFIX (e.g.
  # `tenant-a:code:`); leaving the env var unset keeps the constructor
  # default intact via HOCON's `${?VAR}` "absent if unset" semantics.
  keyPrefix = ${?CLIENT_CODE_KEY_PREFIX}
  defaultExpiresIn = 600
  defaultExpiresIn = ${?CLIENT_CODE_DEFAULT_EXPIRES_IN}
}

refreshTokenFamilyStore {
  redis {
    url = "redis://localhost:6379"
    url = ${?REFRESH_TOKEN_FAMILY_STORE_REDIS_URL}
    password = ${?REFRESH_TOKEN_FAMILY_STORE_REDIS_PASSWORD}
  }
}
