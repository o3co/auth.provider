http {
  port = 3000
  port = ${?HTTP_PORT}
  # Express `trust proxy` — decides whether X-Forwarded-For may rewrite
  # `req.ip` (every IP-keyed rate limit) and X-Forwarded-Proto may rewrite
  # `req.protocol`.
  #
  # Four shapes, all of them Express's own:
  #
  #   false          trust nothing. `req.ip` is the socket peer. The default.
  #   <address list> trust these hops, and only these. An IP literal, a CIDR
  #                  range (10.0.0.0/8, fc00::/7), or a named range
  #                  (loopback, linklocal, uniquelocal). This is the only
  #                  shape that says WHICH hop is trusted, and it is the one
  #                  to reach for. Via env var, comma-separate:
  #                  HTTP_TRUST_PROXY=10.0.0.0/8,192.168.0.0/16
  #   <hop count>    trust that many hops back from the socket peer — e.g. 1
  #                  for exactly one reverse proxy in front of this process.
  #   true           trust every hop, i.e. believe the leftmost
  #                  X-Forwarded-For entry from whoever opened the connection.
  #                  Correct ONLY when nothing but the proxy can route to this
  #                  process; otherwise a client that reaches it directly — or
  #                  through one more hop than you accounted for — forges its
  #                  own `req.ip` and with it any IP-keyed rate-limit identity.
  #
  # Entries are validated at boot: a hostname, a typo'd keyword or a malformed
  # prefix length fails loudly rather than becoming a rule that never matches.
  #
  # An allowlist is a network control, not a cryptographic one. The edge must
  # also STRIP inbound X-Forwarded-* headers rather than appending to them,
  # and the hop between it and this process must not be reachable by anyone
  # able to spoof a source address.
  #
  # Unrelated to `oauth.mtls.trusted-proxies`, which shares this vocabulary but
  # answers a different question (may this peer forward a client certificate?)
  # and is deliberately not derived from this key.
  trustProxy = false
  trustProxy = ${?HTTP_TRUST_PROXY}
  # Per-probe deadline for /readyz. Keep it below the orchestrator's own
  # probe timeout so an unreachable dependency answers 503 rather than
  # letting the probe hang.
  readinessTimeoutMs = 1000
  readinessTimeoutMs = ${?HTTP_READINESS_TIMEOUT_MS}
}

logging {
  # Minimum level emitted. `trace` and `debug` carry request-shaped detail and
  # are off by default; `silent` drops everything.
  # One of: trace | debug | info | warn | error | fatal | silent
  level = "info"
  level = ${?LOG_LEVEL}
}

# #287 / #304: where security-relevant audit events go -- who authenticated,
# what was issued, what was refused, and when the rate limiter could not answer.
#
# There is deliberately NO "none". A sink is the one adapter class with an
# always-works transport: stdout costs no infrastructure and every container
# runtime already collects it. Defaulting to "drop" is how a deployment ends up
# with no record of a rate-limit outage or a token-issuance failure and no sign
# that anything was configured wrong -- which is exactly what #287 found in the
# shipped artifact. Turning the trail OFF must be an explicit act, not the
# state a deployment reaches by not mentioning it.
#
# `type` names a builder registered in the composition root's AuditSinkFactory.
# `registerBuiltinAuditSinks` ships "console": one JSON object per event, one
# line, on stdout. A composition root that registers its own sink (a log
# pipeline, SIEM, message bus) selects it by name here, and its options go in
# this block alongside `type` -- the section passes them through untouched.
#
# Note that the standalone template overrides this with its own "logger" sink,
# which writes the same events through the pino stream that carries every other
# line it emits. See templates/standalone/config/application.conf.
audit {
  sink {
    type = "console"
    type = ${?AUDIT_SINK_TYPE}
  }
}

oauth {
  jwt {
    # REQUIRED. The canonical issuer stamped as `iss` on every token this
    # deployment mints, and the value resource servers pin. Absolute https URL
    # (http only for a loopback host), no query or fragment. There is no
    # default and no fallback: boot fails when it is unset rather than deriving
    # `iss` from the request's Host header (#266).
    issuer = ${?OAUTH_JWT_ISSUER}
    # SF-1 / Phase G / S2: the central JWT verifier rejects
    # tokens whose `typ` header is absent. The previous v0.5.x default
    # accepted typ-less tokens (with a `jwt_verify_legacy_typ` warning)
    # to keep v0.4.x tokens verifying through the migration window;
    # v0.6.0 closes that window by default. Operators with v0.4.x
    # tokens still in circulation can opt back via
    # `OAUTH_JWT_LEGACY_TYP_ACCEPT=true` for their own bounded migration
    # window, but the safe default is now `false` (reject typ-less tokens
    # as a hard signal of misconfiguration or downgrade attack).
    legacyTypAccept = false
    legacyTypAccept = ${?OAUTH_JWT_LEGACY_TYP_ACCEPT}
    signingKey {
      provider = "local"
      provider = ${?OAUTH_JWT_SIGNING_KEY_PROVIDER}
      local {
        # #282: the default is ASYMMETRIC. HS256 leaves a relying party with
        # two bad options — verify nothing (there is no public key to
        # publish, so /.well-known/jwks.json has nothing to serve), or hold
        # the shared secret, which also lets it MINT tokens. EdDSA (Ed25519)
        # publishes a real JWKS and keeps signing capability here.
        #
        # There is NO key material default and no fallback: a deployment
        # that configures nothing fails at boot naming the keys to set,
        # rather than quietly signing with a guessable secret.
        #
        #   openssl genpkey -algorithm ed25519 -out jwt-private.pem
        #   openssl pkey -in jwt-private.pem -pubout -out jwt-public.pem
        #
        # HS256 remains selectable (OAUTH_JWT_ALGORITHM=HS256) for
        # deployments that verify in-process and publish no JWKS. It then
        # requires OAUTH_JWT_SECRET with at least 32 bytes (256 bits) of
        # random material — `openssl rand -hex 32`. Hex/base64 values are
        # measured DECODED, so a 32-character hex string is only 16 bytes
        # and is refused.
        algorithm = "EdDSA"
        algorithm = ${?OAUTH_JWT_ALGORITHM}
        kid = "v0"
        kid = ${?OAUTH_JWT_KID}
        secret = ${?OAUTH_JWT_SECRET}
        privateKeyPath = ${?OAUTH_JWT_PRIVATE_KEY_PATH}
        publicKeyPath = ${?OAUTH_JWT_PUBLIC_KEY_PATH}
        privateKey = ${?OAUTH_JWT_PRIVATE_KEY}
        publicKey = ${?OAUTH_JWT_PUBLIC_KEY}
        # IH-9: key rotation is shaped per algorithm family. Asymmetric
        # algorithms (RS256/ES256/EdDSA) use `previousKeys` (kid +
        # publicKey/publicKeyPath + expiresAt); HS256 uses `previousSecrets`
        # (kid + secret + expiresAt). The schema is a discriminated union
        # and the keystore builder rejects the other family's field, so the
        # wrong shape fails at boot rather than being silently dropped at
        # verification time. Neither is declared here: the default algorithm
        # is EdDSA, and shipping an empty `previousSecrets = []` anchor
        # under it would be exactly that wrong shape. Operators add the one
        # matching their algorithm to their own override layer.
      }
    }
  }
  accessToken {
    expiresIn = 3600
    expiresIn = ${?OAUTH_ACCESS_TOKEN_EXPIRES_IN}
  }
  refreshToken {
    expiresIn = 86400
    expiresIn = ${?OAUTH_REFRESH_TOKEN_EXPIRES_IN}
    # CC-2: handling for refresh tokens whose family_id is not in the store.
    # "reject" is safe-by-default. Use "accept" only during a migration window
    # (e.g. moving from v0.4.x in-memory family store to Redis while old
    # tokens are still in circulation).
    unknownFamilyPolicy = "reject"
    unknownFamilyPolicy = ${?OAUTH_REFRESH_TOKEN_UNKNOWN_FAMILY_POLICY}
    # SF-6 / Phase G / M6: refresh tokens lacking jti or
    # family_id claims when family rotation is wired are always rejected.
    # The `"accept-with-warning"` migration-window value was removed
    # in v0.6.0 along with the env-var override — there is no longer
    # an opt-in to bypass replay detection.
    legacyRtPolicy = "reject"
  }
  # Secure-by-default baseline: all built-in grants are off at the library
  # layer. Deployments opt in by setting `enabled = true` (and repeating the
  # env-override line) in their own application.conf layer, as the standalone
  # template does for session / authorization_code / refresh_token.
  # This enforces the `feedback_secure_default_opt_in` discipline: a grant is
  # active only when a consumer explicitly declares it.
  grants {
    session            { enabled = false, enabled = ${?OAUTH_GRANTS_SESSION_ENABLED} }
    authorization_code {
      enabled = false
      enabled = ${?OAUTH_GRANTS_AUTHORIZATION_CODE_ENABLED}
      # #273 TOMBSTONE. PKCE is mandatory for every authorization-code client
      # and `S256` is the only method accepted; `requireS256`, `required`,
      # `defaultMethod` and `supportedMethods` no longer do anything. The
      # substitution is kept — and only the substitution, so an operator who
      # exported nothing gets an empty block and no warning — so that a
      # deployment still exporting the env var reaches
      # `resolvePkceOptions`, which logs
      # `pkce_config_ignored_s256_is_mandatory` once at boot rather than
      # letting the operator believe the switch is live. `plain` is opted
      # into per client, via `allowPlainPkce: true` on the registration.
      pkce { requireS256 = ${?OAUTH_GRANTS_AUTHORIZATION_CODE_PKCE_REQUIRE_S256} }
    }
    refresh_token      { enabled = false, enabled = ${?OAUTH_GRANTS_REFRESH_TOKEN_ENABLED} }
    client_credentials { enabled = false, enabled = ${?OAUTH_GRANTS_CLIENT_CREDENTIALS_ENABLED} }
    # #301: RFC 7523 JWT-bearer. The public entry point for "present a device
    # credential -> authenticate -> get tokens": the grant verifies POSSESSION
    # of the assertion, then hands the resulting opaque handle to the Store's
    # `authenticateByToken`. Who that handle belongs to -- an existing user, or
    # an anonymous subject for an unlinked device -- is the Store's answer, not
    # this library's.
    #
    # Unlike token exchange, this accepts PUBLIC clients: RFC 7523 3 makes
    # client authentication optional, which is what a device holding a signed
    # assertion needs. That is why it is a separate grant rather than a
    # token-exchange validator.
    #
    # Enabling it REQUIRES an `assertionVerifier` component. There is no
    # default and there will not be one: the only possible default is a
    # verifier that accepts things, and a bare identifier is not
    # authentication. Boot fails if the grant is on without one.
    "urn:ietf:params:oauth:grant-type:jwt-bearer" {
      enabled = false
      enabled = ${?OAUTH_GRANTS_JWT_BEARER_ENABLED}
    }
  }
  # IH-6: require `openid` in /authorize scope by default. `oauth.jwt.issuer`
  # is required of every deployment (#266), so it no longer doubles as the
  # "this is an OIDC Provider" signal — `oidcMode` is now that signal on its
  # own. Set "dual" for deployments that intentionally serve OAuth-only and
  # OIDC clients from the same authorization endpoint.
  oidcMode = "oidc-required"
  oidcMode = ${?OAUTH_OIDC_MODE}
  # OR-9: adapter switch for the OAuth authorization-code repository.
  # Multi-replica production MUST set this to "redis" — the memory adapter
  # loses codes on restart and across replicas.
  #
  # No default literal here on purpose: the legacy `repositories.code.type`
  # fallback in `buildModules` only runs when `oauth.code.adapter` is
  # absent, so a baked-in default would make the legacy override path dead
  # code for any deployment that inherits this core HOCON. Operators who
  # want to opt into the new switch set `OAUTH_CODE_ADAPTER` (or override
  # in their own config layer); pre-OR-9 deployments that still rely on
  # `CLIENT_CODE_TYPE=redis` keep working through the deprecation window.
  code {
    adapter = ${?OAUTH_CODE_ADAPTER}
  }
  # #277: what POST /oauth/revoke does with an ACCESS token.
  #
  #   "denylist"    -- revocation writes the token's `jti` to the
  #                    `accessTokenDenylist` component, which token
  #                    verification and introspection consult. Boot FAILS when
  #                    the composition serves the revocation endpoint and no
  #                    denylist is wired: RFC 7009 forces a 200 response, so an
  #                    unwired denylist means the operator is told the token is
  #                    revoked while it keeps working until it expires.
  #   "unsupported" -- this deployment does not revoke access tokens. The
  #                    endpoint answers `unsupported_token_type` for
  #                    `token_type_hint = access_token` (RFC 7009 §2.2.1)
  #                    instead of a hollow 200, and no denylist is needed.
  #
  # REFRESH-token revocation is governed by neither value: it runs off
  # `refreshTokenFamilyRevocation` and works in both modes.
  #
  # Multi-replica deployments need a SHARED denylist -- the bundled memory one
  # forks per replica, which `deployment.mode = "multi"` refuses (see the
  # replica-safety guard). The standalone template wires the Redis-backed
  # denylist off the shared ioredis socket.
  revocation {
    accessToken = "denylist"
    accessToken = ${?OAUTH_REVOCATION_ACCESS_TOKEN}

    # #406: SUBJECT-level revocation -- the pair of stores a credential change
    # needs. `subjectSessionIndex` enumerates the sessions to cascade over;
    # `subjectRevocation` records the not-before watermark that refuses tokens
    # the cascade missed. One key for both because they are one capability: a
    # deployment that has neither has one thing to say.
    #
    #   "watermark"   -- the stores are wired and a credential change actually
    #                    invalidates what was already issued.
    #   "unsupported" -- this deployment has no subject-level revocation, on
    #                    purpose. A password reset leaves existing sessions and
    #                    access tokens working until they expire.
    #
    # Leave it UNSET when the stores are wired -- the guard only reads this key
    # when a slot is unfilled. Boot FAILS on an unfilled slot with no value
    # here, which is the whole point of #406: before it, a scaffolded
    # deployment got `subjectRevocation: undefined` and the watermark check,
    # the refresh-redemption gate (#376) and `revokeAllForSubject` all went
    # quiet with nothing failing and nothing warning.
    #
    # The standalone template wires both on either adapter branch, so it never
    # needs this. REFRESH-token family revocation is governed by neither value:
    # it runs off `refreshTokenFamilyRevocation` and works regardless.
    subject = ${?OAUTH_REVOCATION_SUBJECT}
  }
  # #297: require a verified email before issuing tokens for an end-user
  # subject. Reads `emailVerified` from the user record the Store returned --
  # issuing, delivering and confirming the verification are the Store's job,
  # not this library's.
  #
  # Off by default: `emailVerified` is Store data many Stores do not model, and
  # defaulting this on would refuse every user of every deployment that has not
  # adopted the field. Enforced at `/authorize` and on the `session` grant --
  # the two points that hold the user's session at issuance. `refresh_token`
  # and token-exchange are deliberately not gated: they derive from an artifact
  # that already passed the gate when it was issued.
  requireEmailVerified = false
  requireEmailVerified = ${?OAUTH_REQUIRE_EMAIL_VERIFIED}
  # #311: deny-by-absence for the per-client `allowedGrantTypes` allowlist.
  #
  # #268 made a DECLARED allowlist restrict which grants a client may use, and
  # kept absence meaning "unrestricted" -- the grants that ignored the field
  # predate it, so denying on absence would have revoked every grant from every
  # registration written before it existed. The consequence is that the secure
  # posture is opt-in per registration: a client whose record omits
  # `allowedGrantTypes` silently gets every grant, and nothing at the
  # deployment level can say otherwise.
  #
  # Set this to true once you have audited your registrations and every client
  # names its grants. A client that then omits the field is refused with
  # `unauthorized_client` at /oauth/token and at /authorize, rather than
  # inheriting everything.
  #
  # Independent of the per-grant rule (#326): `client_credentials` and the
  # WebAuthn grant already deny by absence on their own, whatever this is set
  # to. The two compose to the stricter of the pair.
  requireGrantTypeAllowlist = false
  requireGrantTypeAllowlist = ${?OAUTH_REQUIRE_GRANT_TYPE_ALLOWLIST}

  # #267: `/authorize` mints a code with no consent step, which is defensible
  # in a pure first-party OP and only there. It refuses any client not marked
  # `firstParty: true` in its registration -- one with no `firstParty` field
  # and one carrying an explicit `false` alike.
  #
  # This does NOT make /authorize safe against forced navigation for a client
  # that IS first-party -- that is the accepted model, and consent (#284) is
  # the step that changes it.
  #
  # #330: the one-time `allowUnmarkedClients` migration flag (#316/#317) was
  # removed. The substitution below is a deliberate tombstone, not a live
  # knob: it routes a still-exported OAUTH_AUTHORIZE_ALLOW_UNMARKED_CLIENTS
  # into the schema's removed-key error, so boot fails with migration
  # instructions instead of the variable being silently ignored. Mark your
  # client registrations, then delete the env var and boot clears.
  authorize {
    allowUnmarkedClients = ${?OAUTH_AUTHORIZE_ALLOW_UNMARKED_CLIENTS}
  }
  # IH-16: hard ceiling on the OIDC `nonce` query parameter at /authorize.
  # Standard OIDC clients generate 22-44 char base64url nonces; 256 leaves
  # ~2x headroom for non-standard RPs. Operators with stricter requirements
  # set OAUTH_NONCE_MAX_LENGTH.
  nonce {
    maxLength = 256
    maxLength = ${?OAUTH_NONCE_MAX_LENGTH}
  }
  # F10: maximum existing RFC 8693 actor chain depth accepted before adding
  # the current actor. Depth 3 allows one current actor plus two prior nested
  # actors; lower for stricter delegation environments.
  tokenExchange {
    maxActorChainDepth = 3
    maxActorChainDepth = ${?OAUTH_TOKEN_EXCHANGE_MAX_ACTOR_CHAIN_DEPTH}
  }
  # Wave 1 §5.3 / RFC 8707: opt-in gate for Resource Indicator enforcement.
  # Secure-by-default: off at the library layer. Operators enable via
  # `OAUTH_RESOURCE_INDICATOR_ENABLED=true` or by overriding `enabled = true`
  # in their own application.conf layer.
  # Pattern: literal false + env-override line (PR #171 / feedback_secure_default_opt_in):
  # the literal provides the anchor so HOCON env-substitution has a binding
  # point; without it ${?VAR} is silently dropped when the env var is unset.
  resourceIndicator {
    enabled = false
    enabled = ${?OAUTH_RESOURCE_INDICATOR_ENABLED}
  }
  # Wave 2 cross-mechanism dispatch refactor: a single source of truth for
  # the dispatch policy applied across all installed binding-mechanism
  # modules (DPoP, mTLS, ...). The synthesized `tokenBindingMw` in
  # `assembleApp` reads this key and arbitrates across mechanisms.
  #
  #   "intent-explicit" (default): explicit-intent mechanisms (DPoP) win
  #     over ambient mechanisms (mTLS) on a single request. ≥2 explicit
  #     mechanisms succeeding → 400 invalid_request.
  #   "strict-mutual-exclusion": any 2+ mechanisms succeeding → 400.
  #
  # See ADR `packages/core/docs/adr/2026-05-20-token-binding-first-class-abstraction.md`
  # for the design rationale.
  tokenBinding {
    dispatch-policy = "intent-explicit"
    dispatch-policy = ${?OAUTH_TOKEN_BINDING_DISPATCH_POLICY}

    # #275: also bind a CONFIDENTIAL client's refresh token to the presented
    # DPoP key / client certificate. Public clients are bound either way.
    #
    # Neither RFC requires the public-client restriction and neither forbids
    # lifting it: RFC 9449 §5's "refresh tokens issued to confidential clients
    # ... are not bound" is descriptive prose with no RFC 2119 keyword (the
    # three MUSTs beside it are all about public clients), and RFC 8705 §7.1
    # says the same about certificates. Their rationale holds here -- this
    # server refuses an unauthenticated refresh and refuses a refresh token
    # whose `azp` is not the authenticated client -- so a stolen refresh token
    # is already unusable without the client's own credential.
    #
    # Turn this on only if your DPoP key or client certificate is protected
    # BETTER than your client secret (key in an HSM/TPM, secret in an env
    # var). That is the one case where it adds anything: leaking the secret
    # alone is then not enough.
    #
    # The cost, and why it is off by default: a bound refresh token pins the
    # client to ONE key or certificate for the refresh token's whole lifetime
    # (days). Rotating mid-lifetime breaks refresh until the client
    # re-authenticates from scratch.
    bindConfidentialClientRefreshTokens = false
    bindConfidentialClientRefreshTokens = ${?OAUTH_TOKEN_BINDING_BIND_CONFIDENTIAL_CLIENT_REFRESH_TOKENS}
  }
}

session {
  # REQUIRED. Signs the cookie that IS the authenticated session, so anyone
  # who guesses it can forge a login. #282: at least 32 bytes (256 bits) of
  # random material — `openssl rand -hex 32`. Hex/base64 values are measured
  # DECODED, so a 32-character hex string counts as 16 bytes and is refused.
  secret = ${?SESSION_SECRET}
  # MIN-2: __Host- prefix requires Secure, Path=/, and no Domain attribute.
  # If SESSION_SECURE=false or SESSION_DOMAIN is set, also override
  # SESSION_NAME to a non-__Host- value.
  name = "__Host-auth.session"
  name = ${?SESSION_NAME}
  # Positive whole milliseconds, at most one year (#282). An exported-but-
  # empty SESSION_MAX_AGE resolves to "" and coerces to 0, which emits an
  # already-expired cookie — every request then arrives unauthenticated with
  # nothing in the logs to say why.
  maxAge = 3600000
  maxAge = ${?SESSION_MAX_AGE}
  secure = true
  secure = ${?SESSION_SECURE}
  # #282: `sameSite = "none"` requires `secure = true`. Browsers drop a
  # SameSite=None cookie that is not Secure, so the combination is refused at
  # boot rather than failing silently in the client.
  sameSite = "lax"
  sameSite = ${?SESSION_SAME_SITE}
  domain = null
  domain = ${?SESSION_DOMAIN}
  # #405: every URL `POST /session/login` may accept as `redirect_to`, matched
  # EXACTLY (after URL normalization) -- no wildcards, no prefixes, and a query
  # string is part of the match.
  #
  # An empty list refuses every `redirect_to`, which is the right setting for
  # the deployments that never send one -- and it is the default, because the
  # rule this replaced accepted any absolute http(s) URL whenever `domain`
  # above was unset. A refused request answers 400 invalid_redirect naming the
  # reason (`no-allowlist`, `not-allowlisted`, `insecure-scheme`, ...).
  #
  # `http://` is accepted for loopback hosts only (localhost, 127.0.0.0/8,
  # [::1]); every other host must be https. When `domain` is set, an entry
  # outside it fails BOOT rather than being silently ignored.
  #
  # This is the login flow's list. The federation flow has its own, per
  # provider, at `federations.<name>.redirectAllowlist` (#278).
  redirectAllowlist = []
  # #272: CSRF policy for POST /session/login and POST /session/logout.
  #
  # The routes accept a request that carries EITHER a same-origin (or trusted)
  # Origin/Referer, OR a valid double-submit token; they reject one that
  # carries neither. GET /session/csrf hands out the token, which the client
  # echoes from the `<session.name>.csrf` cookie into the `x-csrf-token`
  # header (or a `csrf_token` form field).
  csrf {
    # Origins other than this server's own that may satisfy the Origin/Referer
    # arm. Set this when the login UI is served from a DIFFERENT origin than
    # the provider -- e.g. a SPA on https://app.example.com posting to
    # https://auth.example.com.
    #
    # Deliberately separate from `cors.allowedOrigins`, which until #272 also
    # doubled as the CSRF trust list. "May read my responses" and "may make me
    # change state" are two decisions; one list cannot answer both.
    trustedOrigins = []
    # Lifetime of an issued token, in seconds. It only has to outlive the time
    # a login form sits open, and the paired cookie expires with it.
    #
    # Must be an integer from 1 to 86400 (24h); boot fails otherwise. The bound
    # is not pedantry: this value is stringified into the token as its expiry
    # field, so a decimal mints tokens that fail their own shape check, and a
    # zero -- which is what an EMPTY SESSION_CSRF_TTL_SECONDS coerces to --
    # mints tokens that are already expired. Either one disables the token arm
    # silently and locks out every client that cannot send an Origin header.
    ttlSeconds = 7200
    ttlSeconds = ${?SESSION_CSRF_TTL_SECONDS}
  }
  storage {
    type = "redis"
    type = ${?SESSION_STORAGE_TYPE}
    redis {
      url = "redis://localhost:6379"
      url = ${?SESSION_STORAGE_REDIS_URL}
      password = ${?SESSION_STORAGE_REDIS_PASSWORD}
    }
  }
}

rateLimit {
  # Brute-force guard for `POST /session/login`. Since #270 the route runs on
  # the shared `rateLimiter` component (keyed `login:ip:<ip>`) rather than a
  # per-process store, so behind a load balancer or across replicas this is one
  # bucket set rather than one per process. Both bundled limiter adapters seed
  # their `limits.login` from these values, which stay the single source of
  # truth.
  #
  # NOTE: `req.ip` is the load balancer's address unless `http.trustProxy` is
  # set. Without it every user shares one bucket and the limit reads as an
  # outage. Set it to the proxy's address or CIDR range rather than `true`:
  # `true` lets anyone who can reach this process choose their own `req.ip`
  # and so their own rate-limit identity. See the multi-replica section of the
  # standalone template README.
  login { windowMs = 900000, limit = 20 }
  # OR-5: fail-mode policy for the OAuth-endpoint rate limiter when its
  # backend errors. "closed" returns HTTP 503 — secure-by-default load
  # shedding. Deployments that prefer fail-open ("open" preserves traffic
  # + adds logger.error emission) override in their own application.conf.
  failMode = "closed"
  failMode = ${?RATE_LIMIT_FAIL_MODE}
}

# federations: individual provider declarations are consumer territory
# (which providers to enable is a deployment decision, not library policy).
# The empty block satisfies the AppConfigSchema record type constraint;
# consumers declare their providers in application.conf above this layer.
# ADR I4 strict-required (declared = active) is maintained: no provider
# is active unless explicitly declared with `enabled = true` in the
# consumer layer.
federations {}

repositories {
  client {
    type = "yaml"
    type = ${?CLIENT_TYPE}
    yaml {
      path = "./config/clients.yaml"
      path = ${?CLIENT_PATH}
    }
  }
  user {
    type = "yaml"
    type = ${?CLIENT_USER_TYPE}
    yaml {
      path = "./config/users.yaml"
      path = ${?CLIENT_USER_PATH}
    }
    http {
      # Both URLs carry plaintext user credentials, so both must be absolute
      # https URLs. http:// is accepted only for a loopback host (localhost,
      # 127.0.0.0/8, [::1]); a private-range address or a container-network
      # service name still needs https. Boot fails if either is not.
      authenticateUrl = ${?CLIENT_USER_AUTHENTICATE_URL}
      authenticateByTokenUrl = ${?CLIENT_USER_AUTHENTICATE_BY_TOKEN_URL}
      # Positive integer, milliseconds, <= 2147483647. Boot fails otherwise —
      # including on a blank env override, which HOCON substitutes as "".
      timeout = 5000
      timeout = ${?CLIENT_USER_TIMEOUT}
      # Largest upstream response body accepted, in bytes. Positive integer.
      maxResponseBytes = 1048576
      maxResponseBytes = ${?CLIENT_USER_MAX_RESPONSE_BYTES}
    }
  }
  code {
    type = "memory"
    type = ${?CLIENT_CODE_TYPE}
    memory {
      defaultExpiresIn = 600
      defaultExpiresIn = ${?CLIENT_CODE_DEFAULT_EXPIRES_IN}
    }
    redis {
      defaultExpiresIn = 600
      defaultExpiresIn = ${?CLIENT_CODE_DEFAULT_EXPIRES_IN}
      endpointUri = ${?CLIENT_CODE_ENDPOINT_URI}
      password = ${?CLIENT_CODE_PASSWORD}
    }
  }
}

endpoints {
  login {
    # IH-17: hard default required because `fullSectionsSchema` now declares
    # `endpoints.login.url` as `z.string()` (was `.optional()`); pure env-var
    # form alone causes parse failure when `ENDPOINTS_LOGIN_URL` is unset.
    url = "/login"
    url = ${?ENDPOINTS_LOGIN_URL}
  }
  # IH-10: `client { url }` and `authCallback { url }` removed — no
  # production consumer reads them. Federation provider callback URLs
  # are configured per-provider (e.g. `federations.google.callbackURL`).
}

cors {
  allowedOrigins = []
}

# #271: how many replicas this deployment runs.
#
# No default literal here on purpose. "unset" is a meaningful third state and
# a baked-in "single" would make it unreachable:
#
#   multi   -> boot FAILS if any in-memory shared store is wired, naming every
#              offender. Set this once you scale past one replica.
#   single  -> you have declared one replica; in-memory stores are correct and
#              boot says nothing.
#   unset   -> nothing declared. Boot logs one `replica_unsafe_adapters`
#              warning naming what is held in this process's memory and what
#              each one costs when scaled.
#
# NOTE: no boot check can catch scaling to N replicas without setting this —
# a process whose state is all in its own memory has no shared medium through
# which to see peers. The warning and the docs are what cover that case.
deployment {
  mode = ${?DEPLOYMENT_MODE}
}

# Wave 5d (IH-14 + OR-M1 + OR-4): adapter switches for the OAuth-endpoint
# rate limiter and the four user-session stores. Defaults are `"memory"`
# for backward compat with existing single-instance deployments.
# Multi-replica production MUST set BOTH to `"redis"` and provide a
# shared Redis 7.2+ instance — otherwise rate-limit counters and session
# state are isolated per replica and produce inconsistent behavior.
rateLimiter {
  adapter = "memory"
  adapter = ${?RATE_LIMITER_ADAPTER}
}

memoryRateLimiter {
  # SF-10: bound the in-memory OAuth endpoint rate-limiter bucket map.
  # Multi-replica production should use `rateLimiter.adapter = "redis"`;
  # this cap keeps the single-process fallback from growing without limit.
  maxBuckets = 10000
  maxBuckets = ${?MEMORY_RATE_LIMITER_MAX_BUCKETS}

  # `limits { <prefix> { limit, windowSeconds } }` overrides the per-prefix
  # spec for keys of the form `<prefix>:...`.
  #
  # #270: `login` is seeded automatically from `rateLimit.login` above, so
  # `/session/login` gets its documented window without being restated here.
  # There is deliberately no `limits.login` entry: two numbers that must agree
  # is the drift bug. Declaring one anyway overrides the seed — an explicit
  # statement about this adapter wins.
  # limits { login { limit = 20, windowSeconds = 900 } }
  #
  # The same applies to `device_verification`, seeded from
  # `oauth.deviceAuthorization.rateLimit` when the device-grant package is
  # mounted (its reference.conf carries the default of 5 / 300 s).
}

userSessionStores {
  adapter = "memory"
  adapter = ${?USER_SESSION_STORES_ADAPTER}
}

# #277: adapter switch for the RFC 7009 access-token denylist -- the store that
# makes "this access token is revoked" true rather than merely reported.
#
# `"memory"` forks per replica: a revocation served by replica A leaves the
# token working on B and C. That is why `deployment.mode = "multi"` refuses it
# (see the replica-safety guard). Anything past one replica sets `"redis"`,
# which shares the denylist over the same ioredis socket as the other stores.
accessTokenDenylist {
  adapter = "memory"
  adapter = ${?ACCESS_TOKEN_DENYLIST_ADAPTER}
}

# #277: key namespace for the bundled Redis access-token denylist. Multi-tenant
# Redis deployments set a deployment-specific value so one tenant's revocations
# neither mask nor are masked by another's.
redisAccessTokenDenylist {
  keyPrefix = "atdeny:"
  keyPrefix = ${?REDIS_ACCESS_TOKEN_DENYLIST_KEY_PREFIX}
}

# MIN-3: outer namespace for the four bundled Redis user-session stores.
# The module appends fixed sub-prefixes (`us:`, `rp:`, `fi:`, `fed:`).
# Multi-tenant Redis deployments should set a deployment-specific value,
# e.g. `tenant-a:ss:`.
redisSessionStores {
  keyPrefix = "ss:"
  keyPrefix = ${?REDIS_SESSION_STORES_KEY_PREFIX}
}

# D-2 v2 + Wave 5d: ioredis connection-config consumed by the shared
# `standaloneRedisClientsModule` in the standalone composition root. One
# ioredis socket per replica backs ALL Redis-typed clients (RT family +
# 4 user-session stores + rate limiter). Module-internal config (keyPrefix
# / casRetryLimit) lives separately under `redisRefreshTokenFamilyStore.*`
# (consumed by `redisRefreshTokenFamilyStoreModule.configSchema`). Both
# top-level keys coexist — they govern different layers of the same store.
redisRefreshTokenFamilyStore {
  keyPrefix = "rtfam:"
  keyPrefix = ${?REFRESH_TOKEN_FAMILY_STORE_KEY_PREFIX}
  casRetryLimit = 3
  casRetryLimit = ${?REFRESH_TOKEN_FAMILY_STORE_CAS_RETRY_LIMIT}
}

# OR-9 (Wave 5d): module-internal config for `redisCodeRepositoryModule`.
# Consumed when `oauth.code.adapter = "redis"`. The shared ioredis socket
# (`standaloneRedisClientsModule`) provides the `codeRepositoryClient`
# slot; this section governs only key namespacing and the default
# expiry-in-seconds the repository uses when /authorize doesn't supply one.
#
# Multi-tenant deployments override `keyPrefix` to isolate tenants in the
# same Redis instance — e.g. `keyPrefix = "tenant-a:code:"` keeps tenant A's
# codes from colliding with tenant B's under the default `oauth:code:`
# prefix (MIN-3 advisory).
redisCodeRepository {
  # No literal default for keyPrefix — the RedisCodeRepository constructor
  # falls back to `oauth:code:` when this field is absent. Operators that
  # need multi-tenant isolation set CLIENT_CODE_KEY_PREFIX (e.g.
  # `tenant-a:code:`); leaving the env var unset keeps the constructor
  # default intact via HOCON's `${?VAR}` "absent if unset" semantics.
  keyPrefix = ${?CLIENT_CODE_KEY_PREFIX}
  defaultExpiresIn = 600
  defaultExpiresIn = ${?CLIENT_CODE_DEFAULT_EXPIRES_IN}
}

refreshTokenFamilyStore {
  redis {
    url = "redis://localhost:6379"
    url = ${?REFRESH_TOKEN_FAMILY_STORE_REDIS_URL}
    password = ${?REFRESH_TOKEN_FAMILY_STORE_REDIS_PASSWORD}
  }
}
