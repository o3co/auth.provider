# Standard implementations' defaults -- @o3co/auth-provider-standard
#
# The single source of truth for the defaults of the sections this package's
# modules own (ADR 2026-04-30: defaults live in HOCON, never in Zod
# .default()). A composition root layers this file between its own
# application.conf and core's reference.conf; each module declares it, so
# core's moduleReferences(modules) names it.
#
# The SMTP mail sender, the `standard-smtp-mail-sender` section: port 587
# with STARTTLS by default; `tls` is implicit TLS (port 465, usually), and
# `none` -- plaintext -- is taken only to localhost or a loopback address in
# its canonical form, and refused with no host. The host, the account, the
# password and the sender's address have no default. Each key has its
# variable, STANDARD_SMTP_MAIL_SENDER_<KEY>.

standard-smtp-mail-sender {
  host = ${?STANDARD_SMTP_MAIL_SENDER_HOST}
  port = 587
  port = ${?STANDARD_SMTP_MAIL_SENDER_PORT}
  secure = "starttls"
  secure = ${?STANDARD_SMTP_MAIL_SENDER_SECURE}
  user = ${?STANDARD_SMTP_MAIL_SENDER_USER}
  password = ${?STANDARD_SMTP_MAIL_SENDER_PASSWORD}
  from = ${?STANDARD_SMTP_MAIL_SENDER_FROM}
}
