# packages/redis/config/reference.conf
# Default configuration for @o3co/auth-provider-redis: each store module's own
# section, named after the module. A composition root layers this file when it
# loads any of them, because each declares it (`section.reference`). Every
# store's connection is the composition root's (the `*Client` slots); nothing
# here opens one.
#
# Each section's old path (`redisConsentStore`, `redisRateLimiter`,
# `rateLimit.failMode`, the grant store's `federationGrants` keys,
# `redisCodeRepository`, ...) refuses
# boot naming its new one wherever the module is installed. No variable binds
# an old path. `renamed-variables` at the end captures the variables renamed
# with the move: boot refuses an old name set, whether or not the new one is
# set.
#
# Multi-tenant Redis deployments set a deployment-specific `keyPrefix` for
# each store, so one tenant's records are never read as another's.

# The access-token denylist's key namespace.
redis-access-token-denylist {
  keyPrefix = "atdeny:"
  keyPrefix = ${?REDIS_ACCESS_TOKEN_DENYLIST_KEY_PREFIX}
}

# The attempt counter's key namespace: a verifier's attempt windows (a hash
# each, expiring past its window's end). Apart from the rate limiter's keys,
# which have the same `<tag>:<id>` form under no prefix.
redis-attempt-counter {
  keyPrefix = "attempt:"
}

# The WebAuthn challenge store's key namespace.
redis-challenge-store {
  keyPrefix = "chal:"
}

# The authorization-code repository's key namespace (a tenant's own, for
# instance, where tenants share one Redis) and default lifetime in seconds.
redis-code-repository {
  keyPrefix = "oauth:code:"
  keyPrefix = ${?REDIS_CODE_REPOSITORY_KEY_PREFIX}
  defaultExpiresIn = 600
  defaultExpiresIn = ${?REDIS_CODE_REPOSITORY_DEFAULT_EXPIRES_IN}
}

# The consent stores' key namespace. The module appends `rec:` for consent
# records and `{pending}:` for parked requests and their per-session index.
redis-consent-store {
  keyPrefix = "consent:"
  keyPrefix = ${?REDIS_CONSENT_STORE_KEY_PREFIX}
}

# The device-code store's key namespace.
redis-device-code-store {
  keyPrefix = "devauth:"
}

# The MFA stores' key namespaces. The factor store keeps one hash per subject
# under `<prefix>{<subject>}`; the transaction store keeps `tx:`, `lock:`,
# `week:` and `proof:` families under its prefix. Neither may contain "{" or
# "}": a brace would take the subject's hash tag over. Both modules check the
# server's eviction policy and persistence at boot: an `allkeys-*` policy
# refuses the boot.
redis-mfa-factor-store {
  keyPrefix = "mfaf:"
  keyPrefix = ${?REDIS_MFA_FACTOR_STORE_KEY_PREFIX}
}

redis-mfa-transaction-store {
  keyPrefix = "mfat:"
  keyPrefix = ${?REDIS_MFA_TRANSACTION_STORE_KEY_PREFIX}
}

# The Redis rate limiter.
#
# `failMode` is its outage policy: what every throttled route does while Redis
# cannot answer. "closed" answers HTTP 503; "open" lets the request through
# and logs at error.
#
# `defaultLimit` is the budget every key whose prefix has neither an entry in
# `limits` nor a budget its owning module contributes falls back to.
# `limits { <prefix> { limit, windowSeconds } }` overrides the per-prefix spec
# for keys of the form `<prefix>:...`:
#
#   limits { token { limit = 120, windowSeconds = 60 } }
#
# A prefix whose owning module contributes a budget is best left out: an entry
# here overrides the contributed budget. `login` and `device_verification`
# are refused here while their owning module (session, device-grant) is
# loaded: each declares its prefix a verifier's own attempt limit, set at
# `session.rateLimit.login` and `device-grant.rateLimit`, which no limiter
# loosens. A window is at most one year (31536000 s).
redis-rate-limiter {
  failMode = "closed"
  failMode = ${?REDIS_RATE_LIMITER_FAIL_MODE}
  defaultLimit { limit = 60, windowSeconds = 60 }
}

# The refresh-token family store: its key namespace, and how many times a
# compare-and-set is retried under contention (1 to 10).
redis-refresh-token-family-store {
  keyPrefix = "rtfam:"
  keyPrefix = ${?REDIS_REFRESH_TOKEN_FAMILY_STORE_KEY_PREFIX}
  casRetryLimit = 3
  casRetryLimit = ${?REDIS_REFRESH_TOKEN_FAMILY_STORE_CAS_RETRY_LIMIT}
}

# The replay seen-set's key namespace.
redis-replay-seen-set {
  keyPrefix = "replay:"
}

# The user-session stores' outer key namespace. The module appends fixed
# sub-prefixes (`us:`, `sub:`, `rev:`, `lc:`).
redis-session-stores {
  keyPrefix = "ss:"
  keyPrefix = ${?REDIS_SESSION_STORES_KEY_PREFIX}
}

# The federation token store: the upstream IdP tokens held for a session.
#
# Records are encrypted at rest (AES-256-GCM): these are long-lived IdP
# refresh tokens. `encryptionMode = "required"` needs a 32-byte key, supplied
# base64-encoded -- `openssl rand -base64 32`. "allow-plaintext" is for
# development only and is refused when the environment the config was
# selected by (CONFIG_ENV, or NODE_ENV) is production or staging, when
# NODE_ENV is, or when `core.deployment.mode = "multi"` -- unless
# FEDERATION_TOKENS_ALLOW_INSECURE=1 is also set, which logs CRITICAL instead.
#
# `ttl` (seconds) bounds how long a record lives and MUST exceed the upstream
# refresh-token lifetime; `scanFallback` finds records written before the
# per-session index existed -- read the module's documentation before turning
# it off. Both are set in a config layer rather than by a variable.
redis-federation-token-store {
  keyPrefix = "ft:"
  keyPrefix = ${?REDIS_FEDERATION_TOKEN_STORE_KEY_PREFIX}
  ttl = 86400
  encryptionMode = "required"
  encryptionMode = ${?REDIS_FEDERATION_TOKEN_STORE_ENCRYPTION_MODE}
  encryptionKey = ${?REDIS_FEDERATION_TOKEN_STORE_ENCRYPTION_KEY}
  scanFallback = true
}

# The federation grant store: this adapter's layout, how long a record
# answers past its end, and the key ring its credentials are sealed under.
#
# `keyPrefix` may not contain "{" or "}": a grant's record, credential and lock
# share a hash tag so one script can touch all three, and a prefix carrying a
# brace would take that tag over.
#
# `listingAllowanceMs` is how far past a record's horizon the subject index
# keeps its member, and how far past the last horizon the index key itself
# lives. The index is a key of its own, so on a Cluster it and the records it
# points at read different clocks; this is the allowance that keeps a member
# from being dropped while a replica whose clock is behind can still read its
# record. Five minutes by default, at most one year (31536000000).
#
# `tombstoneRetention` is how long a revoked or expired grant still answers
# the status route, in seconds, at most one year (31536000); zero keeps no
# tombstones. It is taken at creation and kept with the record, so changing it
# applies to grants created afterwards.
#
# The credential is sealed with AES-256-GCM under a key RING, `encryptionKeys`
# (a list of { id, key }, written in a config layer): the first key seals and
# every listed key opens, so a key introduced today does not require
# re-sealing grants that are paused, and a key dropped from the ring makes its
# grants answer 503 `key_unavailable` until it is put back. Keep a retired key
# listed for 365 days (the lifetime ceiling) after the last replica that sealed
# with it stopped -- the operator runbook has the rotation procedure. Keys are
# 32 bytes, base64 -- `openssl rand -base64 32`. `encryptionMode =
# "allow-plaintext"` is for development and is refused exactly where the
# federation-token store refuses it, with the same
# FEDERATION_TOKENS_ALLOW_INSECURE escape hatch and a CRITICAL line.
redis-federation-grant-store {
  keyPrefix = "fg:"
  keyPrefix = ${?REDIS_FEDERATION_GRANT_STORE_KEY_PREFIX}
  listingAllowanceMs = 300000
  tombstoneRetention = 2592000
  encryptionMode = "required"
  encryptionMode = ${?REDIS_FEDERATION_GRANT_STORE_ENCRYPTION_MODE}
}

# The federation grant intent store's key namespace: acquisition's records
# (the intent a backend lodged, the consent challenge, the connect transaction)
# live under `<prefix>{intents}:`. Its own key: a deployment that moves the
# grant store's prefix moves this one too.
redis-federation-grant-intent-store {
  keyPrefix = "fg:"
  keyPrefix = ${?REDIS_FEDERATION_GRANT_INTENT_STORE_KEY_PREFIX}
}

# What the resolution saw of each variable the package's modules declare
# renamed: each name null, then its value when set. Boot judges these and
# removes the section before it parses the configuration. Never write it in
# another layer.
renamed-variables {
  RATE_LIMIT_FAIL_MODE = null
  RATE_LIMIT_FAIL_MODE = ${?RATE_LIMIT_FAIL_MODE}
  REDIS_RATE_LIMITER_FAIL_MODE = null
  REDIS_RATE_LIMITER_FAIL_MODE = ${?REDIS_RATE_LIMITER_FAIL_MODE}
  REFRESH_TOKEN_FAMILY_STORE_KEY_PREFIX = null
  REFRESH_TOKEN_FAMILY_STORE_KEY_PREFIX = ${?REFRESH_TOKEN_FAMILY_STORE_KEY_PREFIX}
  REDIS_REFRESH_TOKEN_FAMILY_STORE_KEY_PREFIX = null
  REDIS_REFRESH_TOKEN_FAMILY_STORE_KEY_PREFIX = ${?REDIS_REFRESH_TOKEN_FAMILY_STORE_KEY_PREFIX}
  REFRESH_TOKEN_FAMILY_STORE_CAS_RETRY_LIMIT = null
  REFRESH_TOKEN_FAMILY_STORE_CAS_RETRY_LIMIT = ${?REFRESH_TOKEN_FAMILY_STORE_CAS_RETRY_LIMIT}
  REDIS_REFRESH_TOKEN_FAMILY_STORE_CAS_RETRY_LIMIT = null
  REDIS_REFRESH_TOKEN_FAMILY_STORE_CAS_RETRY_LIMIT = ${?REDIS_REFRESH_TOKEN_FAMILY_STORE_CAS_RETRY_LIMIT}
  FEDERATION_GRANTS_ENCRYPTION_MODE = null
  FEDERATION_GRANTS_ENCRYPTION_MODE = ${?FEDERATION_GRANTS_ENCRYPTION_MODE}
  REDIS_FEDERATION_GRANT_STORE_ENCRYPTION_MODE = null
  REDIS_FEDERATION_GRANT_STORE_ENCRYPTION_MODE = ${?REDIS_FEDERATION_GRANT_STORE_ENCRYPTION_MODE}
  CLIENT_CODE_KEY_PREFIX = null
  CLIENT_CODE_KEY_PREFIX = ${?CLIENT_CODE_KEY_PREFIX}
  REDIS_CODE_REPOSITORY_KEY_PREFIX = null
  REDIS_CODE_REPOSITORY_KEY_PREFIX = ${?REDIS_CODE_REPOSITORY_KEY_PREFIX}
  CLIENT_CODE_DEFAULT_EXPIRES_IN = null
  CLIENT_CODE_DEFAULT_EXPIRES_IN = ${?CLIENT_CODE_DEFAULT_EXPIRES_IN}
  REDIS_CODE_REPOSITORY_DEFAULT_EXPIRES_IN = null
  REDIS_CODE_REPOSITORY_DEFAULT_EXPIRES_IN = ${?REDIS_CODE_REPOSITORY_DEFAULT_EXPIRES_IN}
  CLIENT_CODE_ENDPOINT_URI = null
  CLIENT_CODE_ENDPOINT_URI = ${?CLIENT_CODE_ENDPOINT_URI}
  CLIENT_CODE_PASSWORD = null
  CLIENT_CODE_PASSWORD = ${?CLIENT_CODE_PASSWORD}
}
