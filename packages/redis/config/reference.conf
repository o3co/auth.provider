# packages/redis/config/reference.conf
# Default configuration for @o3co/auth-provider-redis: each store module's own
# section, named after the module. A composition root layers this file when it
# loads any of them, because each declares it (`section.reference`). Every
# store's connection is the composition root's (the `*Client` slots); nothing
# here opens one.
#
# Each section's old path (`redisConsentStore`, `redisRateLimiter`,
# `rateLimit.failMode`, ...) refuses boot naming its new one wherever the
# module is installed. Nothing is bound there. `renamed-variables` at the end
# captures the variables renamed with the move: boot refuses an old name set
# unless the new one is set to the same value.
#
# Multi-tenant Redis deployments set a deployment-specific `keyPrefix` for
# each store, so one tenant's records are never read as another's.

# The access-token denylist's key namespace.
redis-access-token-denylist {
  keyPrefix = "atdeny:"
  keyPrefix = ${?REDIS_ACCESS_TOKEN_DENYLIST_KEY_PREFIX}
}

# The WebAuthn challenge store's key namespace.
redis-challenge-store {
  keyPrefix = "chal:"
}

# The consent stores' key namespace. The module appends `rec:` for consent
# records and `{pending}:` for parked requests and their per-session index.
redis-consent-store {
  keyPrefix = "consent:"
  keyPrefix = ${?REDIS_CONSENT_STORE_KEY_PREFIX}
}

# The device-code store's key namespace.
redis-device-code-store {
  keyPrefix = "devauth:"
}

# The MFA stores' key namespaces. The factor store keeps one hash per subject
# under `<prefix>{<subject>}`; the transaction store keeps `tx:`, `lock:`,
# `week:` and `proof:` families under its prefix. Neither may contain "{" or
# "}": a brace would take the subject's hash tag over. Both modules check the
# server's eviction policy and persistence at boot: an `allkeys-*` policy
# refuses the boot.
redis-mfa-factor-store {
  keyPrefix = "mfaf:"
  keyPrefix = ${?REDIS_MFA_FACTOR_STORE_KEY_PREFIX}
}

redis-mfa-transaction-store {
  keyPrefix = "mfat:"
  keyPrefix = ${?REDIS_MFA_TRANSACTION_STORE_KEY_PREFIX}
}

# The Redis rate limiter.
#
# `failMode` is its outage policy: what every throttled route does while Redis
# cannot answer. "closed" answers HTTP 503; "open" lets the request through
# and logs at error.
#
# `defaultLimit` is the budget every key whose prefix has neither an entry in
# `limits` nor a budget its owning module contributes falls back to.
# `limits { <prefix> { limit, windowSeconds } }` overrides the per-prefix spec
# for keys of the form `<prefix>:...`:
#
#   limits { token { limit = 120, windowSeconds = 60 } }
#
# A prefix whose owning module contributes a budget is best left out: an entry
# here overrides the contributed budget. A window is at most one year
# (31536000 s).
redis-rate-limiter {
  failMode = "closed"
  failMode = ${?REDIS_RATE_LIMITER_FAIL_MODE}
  defaultLimit { limit = 60, windowSeconds = 60 }
}

# The refresh-token family store: its key namespace, and how many times a
# compare-and-set is retried under contention (1 to 10).
redis-refresh-token-family-store {
  keyPrefix = "rtfam:"
  keyPrefix = ${?REDIS_REFRESH_TOKEN_FAMILY_STORE_KEY_PREFIX}
  casRetryLimit = 3
  casRetryLimit = ${?REDIS_REFRESH_TOKEN_FAMILY_STORE_CAS_RETRY_LIMIT}
}

# The replay seen-set's key namespace.
redis-replay-seen-set {
  keyPrefix = "replay:"
}

# The user-session stores' outer key namespace. The module appends fixed
# sub-prefixes (`us:`, `rp:`, `fi:`, `fed:`, `sub:`, `rev:`).
redis-session-stores {
  keyPrefix = "ss:"
  keyPrefix = ${?REDIS_SESSION_STORES_KEY_PREFIX}
}

# The federation token store: the upstream IdP tokens held for a session.
#
# Records are encrypted at rest (AES-256-GCM): these are long-lived IdP
# refresh tokens. `encryptionMode = "required"` needs a 32-byte key, supplied
# base64-encoded -- `openssl rand -base64 32`. "allow-plaintext" is for
# development only and is refused when the environment the config was
# selected by (CONFIG_ENV, or NODE_ENV) is production or staging, when
# NODE_ENV is, or when `core.deployment.mode = "multi"` -- unless
# FEDERATION_TOKENS_ALLOW_INSECURE=1 is also set, which logs CRITICAL instead.
#
# `ttl` (seconds) bounds how long a record lives and MUST exceed the upstream
# refresh-token lifetime; `scanFallback` finds records written before the
# per-session index existed -- read the module's documentation before turning
# it off. Both are set in a config layer rather than by a variable.
redis-federation-token-store {
  keyPrefix = "ft:"
  keyPrefix = ${?REDIS_FEDERATION_TOKEN_STORE_KEY_PREFIX}
  ttl = 86400
  encryptionMode = "required"
  encryptionMode = ${?REDIS_FEDERATION_TOKEN_STORE_ENCRYPTION_MODE}
  encryptionKey = ${?REDIS_FEDERATION_TOKEN_STORE_ENCRYPTION_KEY}
  scanFallback = true
}

# What the resolution saw of each variable the package's modules declare
# renamed: each name null, then its value when set. Boot judges these and
# removes the section before it parses the configuration. Never write it in
# another layer.
renamed-variables {
  RATE_LIMIT_FAIL_MODE = null
  RATE_LIMIT_FAIL_MODE = ${?RATE_LIMIT_FAIL_MODE}
  REDIS_RATE_LIMITER_FAIL_MODE = null
  REDIS_RATE_LIMITER_FAIL_MODE = ${?REDIS_RATE_LIMITER_FAIL_MODE}
  REFRESH_TOKEN_FAMILY_STORE_KEY_PREFIX = null
  REFRESH_TOKEN_FAMILY_STORE_KEY_PREFIX = ${?REFRESH_TOKEN_FAMILY_STORE_KEY_PREFIX}
  REDIS_REFRESH_TOKEN_FAMILY_STORE_KEY_PREFIX = null
  REDIS_REFRESH_TOKEN_FAMILY_STORE_KEY_PREFIX = ${?REDIS_REFRESH_TOKEN_FAMILY_STORE_KEY_PREFIX}
  REFRESH_TOKEN_FAMILY_STORE_CAS_RETRY_LIMIT = null
  REFRESH_TOKEN_FAMILY_STORE_CAS_RETRY_LIMIT = ${?REFRESH_TOKEN_FAMILY_STORE_CAS_RETRY_LIMIT}
  REDIS_REFRESH_TOKEN_FAMILY_STORE_CAS_RETRY_LIMIT = null
  REDIS_REFRESH_TOKEN_FAMILY_STORE_CAS_RETRY_LIMIT = ${?REDIS_REFRESH_TOKEN_FAMILY_STORE_CAS_RETRY_LIMIT}
}
