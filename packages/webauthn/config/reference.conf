# WebAuthn module defaults — @o3co/auth-provider-webauthn
#
# This file is the single source of truth for the defaults of the sections
# this package's modules read -- `webauthn`, the grant's, and
# `webauthn-mfa-factor`, the second factor's (ADR 2026-04-30: defaults live in
# HOCON, never in Zod .default() calls).
#
# A composition root layers this file between its own application.conf and
# core's reference.conf, with @o3co/ts.hocon, as the package README shows —
# webauthnModule declares it, so core's moduleReferences(modules) names it:
#   const config = parseFile("config/application.conf")
#     .withFallback(parseFile(<path of @o3co/auth-provider-webauthn/reference.conf>))
#     .withFallback(parseFile(<path of @o3co/auth-provider-core/reference.conf>))
#     .toObject();
# hands createApp that configuration, unparsed: boot parses it once, the
# `webauthn` section with webauthnConfigSchema, which refuses a key it does
# not declare at every level, and webauthnModule provides the section as the
# `webauthnConfig` slot.
#
# Baselines (dogfood-friendly deployment):
#   attestationPreference = "none"   — no attestation chain required;
#                                      override to "direct" + trust anchors
#                                      for hardware-attested deployments.
#   challengeTtlMs = 120000          — 120 s; mobile-network safe.
#   userVerification = "preferred"   — broad platform coverage + security balance.
#
# POST /oauth/webauthn/authentication/options always returns the
# discoverable-credential shape, so its response cannot be used to test whether
# an account exists. The removed `allowCredentialsForKnownUser` and
# WEBAUTHN_ALLOW_CREDENTIALS_FOR_KNOWN_USER refuse boot, at any value.
#
# POST /oauth/webauthn/authentication/options is guarded by the deployment's
# rateLimiter when one is wired, under the tag webauthn-authentication-options:
# set its limit as `limits.webauthn-authentication-options` in the limiter's
# own section, else the limiter's defaultLimit applies. The removed
# `webauthn.rateLimit` and its variables --
# WEBAUTHN_RATE_LIMIT_AUTHENTICATION_OPTIONS_LIMIT,
# WEBAUTHN_RATE_LIMIT_AUTHENTICATION_OPTIONS_WINDOW_SECONDS and their older
# names WEBAUTHN_AUTHENTICATION_OPTIONS_RATE_LIMIT and
# WEBAUTHN_AUTHENTICATION_OPTIONS_RATE_WINDOW_SECONDS -- refuse boot, at any
# value.
#
# rpId, rpName, and origin have no sensible universal defaults and MUST be
# supplied in the consumer's own application.conf layer.
#
# The WebAuthn second factor's section, `webauthn-mfa-factor`, which
# webauthnMfaFactorModule reads, contributing the factor under core's
# `mfaFactors` kind over the relying party the `webauthnConfig` slot holds:
#   enabled = false            -- off until the deployment turns it on
#                                 (WEBAUTHN_MFA_FACTOR_ENABLED).
#   userVerification = "preferred"
#                              -- what its registrations and assertions ask
#                                 for; "required" also refuses a response
#                                 without the UV flag
#                                 (WEBAUTHN_MFA_FACTOR_USER_VERIFICATION).

webauthn {
  challengeTtlMs = 120000
  challengeTtlMs = ${?WEBAUTHN_CHALLENGE_TTL_MS}
  attestationPreference = "none"
  attestationPreference = ${?WEBAUTHN_ATTESTATION_PREFERENCE}
  userVerification = "preferred"
  userVerification = ${?WEBAUTHN_USER_VERIFICATION}
  rpId = ${?WEBAUTHN_RP_ID}
  rpName = ${?WEBAUTHN_RP_NAME}
  origin = ${?WEBAUTHN_ORIGIN}
  # Origins this RP may be FRAMED BY -- the topOrigin a browser reports for a
  # cross-origin (iframe) ceremony. Optional, and absent is the safe answer:
  # a reported cross-origin registration or authentication is refused, which
  # is what a deployment that never meant to be embedded wants. Set it to the
  # parent page's origin(s) to accept passkey ceremonies from those frames.
  # Same shape as `origin`, minus the Android app form: a top origin is a
  # browsing context, and Credential Manager's origin has no frame above it.
  topOrigin = ${?WEBAUTHN_TOP_ORIGIN}
}

webauthn-mfa-factor {
  enabled = false
  enabled = ${?WEBAUTHN_MFA_FACTOR_ENABLED}
  userVerification = "preferred"
  userVerification = ${?WEBAUTHN_MFA_FACTOR_USER_VERIFICATION}
}

# What the resolution saw of each variable the module declares renamed: each
# name null, then its value when set. Boot refuses a removed key's variable set
# at all, and removes this section before it parses the configuration. Never
# write it in another layer.
renamed-variables {
  WEBAUTHN_AUTHENTICATION_OPTIONS_RATE_LIMIT = null
  WEBAUTHN_AUTHENTICATION_OPTIONS_RATE_LIMIT = ${?WEBAUTHN_AUTHENTICATION_OPTIONS_RATE_LIMIT}
  WEBAUTHN_RATE_LIMIT_AUTHENTICATION_OPTIONS_LIMIT = null
  WEBAUTHN_RATE_LIMIT_AUTHENTICATION_OPTIONS_LIMIT = ${?WEBAUTHN_RATE_LIMIT_AUTHENTICATION_OPTIONS_LIMIT}
  WEBAUTHN_AUTHENTICATION_OPTIONS_RATE_WINDOW_SECONDS = null
  WEBAUTHN_AUTHENTICATION_OPTIONS_RATE_WINDOW_SECONDS = ${?WEBAUTHN_AUTHENTICATION_OPTIONS_RATE_WINDOW_SECONDS}
  WEBAUTHN_RATE_LIMIT_AUTHENTICATION_OPTIONS_WINDOW_SECONDS = null
  WEBAUTHN_RATE_LIMIT_AUTHENTICATION_OPTIONS_WINDOW_SECONDS = ${?WEBAUTHN_RATE_LIMIT_AUTHENTICATION_OPTIONS_WINDOW_SECONDS}
  WEBAUTHN_ALLOW_CREDENTIALS_FOR_KNOWN_USER = null
  WEBAUTHN_ALLOW_CREDENTIALS_FOR_KNOWN_USER = ${?WEBAUTHN_ALLOW_CREDENTIALS_FOR_KNOWN_USER}
}
