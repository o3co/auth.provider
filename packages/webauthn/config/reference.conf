# WebAuthn module defaults — @o3co/auth-provider-webauthn
#
# This file is the single source of truth for WebAuthn config defaults
# (ADR 2026-04-30: defaults live in HOCON, never in Zod .default() calls).
#
# A composition root layers this file between its own application.conf and
# core's reference.conf, with @o3co/ts.hocon, as the package README shows:
#   const config = validate(
#     parseFile("config/application.conf")
#       .withFallback(parseFile(<path of @o3co/auth-provider-webauthn/reference.conf>))
#       .withFallback(parseFile(<path of @o3co/auth-provider-core/reference.conf>)),
#     AppConfigSchema,
#   );
# and hands config.webauthn to webauthnConfigSchema.
#
# S11 baselines (dogfood-friendly deployment):
#   attestationPreference = "none"   — no attestation chain required;
#                                      override to "direct" + trust anchors
#                                      for hardware-attested deployments.
#   challengeTtlMs = 120000          — 120 s; mobile-network safe (spec §2.4.1 / FCoT CA4).
#   userVerification = "preferred"   — broad platform coverage + security balance.
#
# #281 baselines (POST /oauth/webauthn/authentication/options hardening):
#   allowCredentialsForKnownUser = false
#       The endpoint always returns the discoverable-credential shape, so its
#       response cannot be used to test whether an account exists. Set true
#       ONLY for a fleet of non-discoverable (non-resident-key) authenticators
#       that needs an explicit credential allow-list — it reinstates the
#       enumeration oracle for your deployment.
#   rateLimit.authenticationOptions = 30 requests / 60 s per source IP
#       The endpoint is unauthenticated and writes a challenge per request.
#       Legitimate traffic is one call per sign-in attempt, so 30/min leaves
#       generous headroom for a shared NAT egress while still bounding a
#       credential-store flood. Raise it for a large single-egress tenant;
#       lower it for a deployment whose clients are one-user-per-IP. The
#       window is at most one year (31536000 s). Both bundled limiter
#       modules seed the route's budget from this key, so a shared limiter
#       applies it too; an explicit `limits.webauthn-authentication-options`
#       in the limiter's own section still wins.
#
# rpId, rpName, and origin have no sensible universal defaults and MUST be
# supplied in the consumer's own application.conf layer.

webauthn {
  challengeTtlMs = 120000
  challengeTtlMs = ${?WEBAUTHN_CHALLENGE_TTL_MS}
  attestationPreference = "none"
  attestationPreference = ${?WEBAUTHN_ATTESTATION_PREFERENCE}
  userVerification = "preferred"
  userVerification = ${?WEBAUTHN_USER_VERIFICATION}
  allowCredentialsForKnownUser = false
  allowCredentialsForKnownUser = ${?WEBAUTHN_ALLOW_CREDENTIALS_FOR_KNOWN_USER}
  rateLimit {
    authenticationOptions {
      limit = 30
      limit = ${?WEBAUTHN_AUTHENTICATION_OPTIONS_RATE_LIMIT}
      windowSeconds = 60
      windowSeconds = ${?WEBAUTHN_AUTHENTICATION_OPTIONS_RATE_WINDOW_SECONDS}
    }
  }
  rpId = ${?WEBAUTHN_RP_ID}
  rpName = ${?WEBAUTHN_RP_NAME}
  origin = ${?WEBAUTHN_ORIGIN}
  # Origins this RP may be FRAMED BY -- the topOrigin a browser reports for a
  # cross-origin (iframe) ceremony. Optional, and absent is the safe answer:
  # a reported cross-origin authentication is refused, which is what a
  # deployment that never meant to be embedded wants. Set it to the parent
  # page's origin(s) to accept passkey authentication from those frames.
  # Same shape as `origin`, minus the Android app form: a top origin is a
  # browsing context, and Credential Manager's origin has no frame above it.
  topOrigin = ${?WEBAUTHN_TOP_ORIGIN}
}
