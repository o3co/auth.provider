# Foundation defaults -- @o3co/auth-provider-foundation
#
# The section of the module that keeps a subject's MFA factors in the Store,
# `foundation-mfa-factor-store`: the Store's four MFA factor endpoints, each
# a POST of JSON (the package README, "The Store's MFA endpoints"). A
# composition root that installs a module reading the section layers this
# file between its own configuration and core's reference.conf.
#
# None has a default, and each is required: a module reading the section
# refuses the boot with any of them unset, naming each one missing. Each
# must be https, or http to a loopback host (localhost, 127.0.0.0/8, [::1]),
# and the endpoint that answers: no request follows a redirect. Each key has
# its variable, FOUNDATION_MFA_FACTOR_STORE_<KEY>.

foundation-mfa-factor-store {
  listUrl = ${?FOUNDATION_MFA_FACTOR_STORE_LIST_URL}
  createUrl = ${?FOUNDATION_MFA_FACTOR_STORE_CREATE_URL}
  updateUrl = ${?FOUNDATION_MFA_FACTOR_STORE_UPDATE_URL}
  deleteUrl = ${?FOUNDATION_MFA_FACTOR_STORE_DELETE_URL}
}
