# packages/dpop/src/reference.conf
# Default configuration for @o3co/auth-provider-dpop.
# Concatenated into the application config via the HOCON withFallback chain.
#
# `oauth.tokenBinding.dispatch-policy` is owned by `@o3co/auth-provider-core`
# (single source of truth across DPoP, mTLS, and future binding-mechanism
# modules) since the cross-mechanism dispatch refactor (2026-05-19). It is
# not redeclared here.
#
# Per Wave 2 Phase 2 spec §10. Secure default: off until an operator opts in.

oauth.dpop {
  # Set to true to enable DPoP proof verification at the token endpoint.
  # Default: false — secure-default-opt-in (operators must explicitly enable).
  #
  # Requires `oauth.jwt.issuer` (already required by core). Its ORIGIN is what
  # every proof's `htu` is checked against — never `req.protocol` and the Host
  # header, which X-Forwarded-* rewrites under `http.trustProxy` and a caller
  # could therefore choose for itself (#292). Boot fails if it is missing or
  # is not a canonical issuer URL.
  enabled = false

  # Acceptance window for the DPoP proof's iat claim (seconds).
  iat-window-seconds = 60

  # JOSE algorithm allowlist for DPoP proof keys.
  alg-whitelist = ["ES256", "ES384", "EdDSA", "RS256"]

  # Backend for replay protection. "memory" keeps it in this process, which
  # is correct for one replica. Multi-replica deployments MUST use "redis"
  # with @o3co/auth-provider-redis.
  #
  # "redis" makes the `dpopReplayStore` slot mandatory: boot fails if it is
  # empty. With the slot empty and "memory", proofs are checked against a
  # per-process store, which forks per replica — so, as for every other
  # per-process store, boot is refused under deployment.mode = "multi",
  # warns (dpop_replay_store_not_shared) when the mode is unset, and is
  # silent under "single". A wired slot is used whatever this says; the
  # check asks only whether the slot is filled, not what backs it.
  replay-store = "memory"

  # TTL for replay entries in seconds. MUST be at least
  # 2 x iat-window-seconds + 1: the iat check is symmetric and truncated to
  # whole seconds, so a proof stays acceptable from iat - W until iat + W + 1.
  # Below that the verifier logs a warning (reason
  # "replay_ttl_below_iat_window") and a proof can outlive its replay entry.
  # The default (300 against a 60s window) clears it.
  replay-store-ttl-seconds = 300

  # #530: server-provided nonce (RFC 9449 §8 / §9). Without one the only
  # freshness control on a proof is `iat` skew, which is weak for tokens that
  # live longer than a few minutes. The nonce is stateless — a time bucket and
  # an HMAC under `secret`, which every replica shares — so nothing is stored
  # and a nonce minted by one replica verifies on every other.
  #
  #   required = "never"  -- no nonce is asked for (default)
  #   required = "as"     -- the token endpoint asks: a proof without a valid
  #                          nonce gets 400 use_dpop_nonce + a DPoP-Nonce header
  #   required = "as+rs"  -- protected resources ask too: 401 with
  #                          WWW-Authenticate: DPoP error="use_dpop_nonce"
  #
  # Every accepted proof's answer carries the current nonce as well, so a
  # client learns of a rotation (every ttl-seconds; the previous bucket stays
  # accepted) before it needs to. `secret` is required once `required` is not
  # "never": at least 32 bytes of random material (`openssl rand -base64 32`),
  # measured on the DECODED value -- 32 hex characters are only 16 bytes.
  nonce {
    required = "never"
    required = ${?OAUTH_DPOP_NONCE_REQUIRED}
    ttl-seconds = 300
    ttl-seconds = ${?OAUTH_DPOP_NONCE_TTL_SECONDS}
    secret = ${?OAUTH_DPOP_NONCE_SECRET}
  }
}
