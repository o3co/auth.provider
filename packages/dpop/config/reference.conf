# packages/dpop/config/reference.conf
# Default configuration for @o3co/auth-provider-dpop: the DPoP module's own
# section, `dpop`. A composition root layers it because the module declares it.
#
# `oauth.tokenBinding.dispatch-policy` is owned by `@o3co/auth-provider-core`
# (single source of truth across DPoP, mTLS, and future binding-mechanism
# modules). It is not redeclared here.
#
# Secure default: off until an operator opts in.
#
# `oauth.dpop` is the section's old path, which boot refuses naming `dpop`
# wherever the module is installed. Nothing is bound there. Its variables,
# OAUTH_DPOP_NONCE_REQUIRED, OAUTH_DPOP_NONCE_TTL_SECONDS and
# OAUTH_DPOP_NONCE_SECRET, are declared renamed on the module
# (DPOP_NONCE_REQUIRED, DPOP_NONCE_TTL_SECONDS, DPOP_NONCE_SECRET), and
# `renamed-variables` below captures the six names as this file is resolved:
# boot refuses an old name set unless the new one is set to the same value.

dpop {
  # Set to true to enable DPoP proof verification at the token endpoint.
  # Default: false — secure-default-opt-in (operators must explicitly enable).
  #
  # Requires `oauth.jwt.issuer` (already required by core). Its ORIGIN is what
  # every proof's `htu` is checked against — never `req.protocol` and the Host
  # header, which X-Forwarded-* rewrites under `http.trustProxy` and a caller
  # could therefore choose for itself (#292). Boot fails if it is missing or
  # is not a canonical issuer URL.
  enabled = false

  # Acceptance window for the DPoP proof's iat claim (seconds).
  iatWindowSeconds = 60

  # JOSE algorithm allowlist for DPoP proof keys.
  algWhitelist = ["ES256", "ES384", "EdDSA", "RS256"]

  # Every accepted proof's jti is recorded in core's replay seen-set (the
  # `replaySeenSet` slot, shared with private_key_jwt and WebAuthn),
  # so there is no DPoP backend to choose here: the module that fills that
  # slot decides (`replaySeenSet.adapter`, which the standalone template
  # reads). Enabled with no seen-set wired, boot is refused. The memory
  # seen-set forks per replica, so core's replica-safety check refuses it
  # under core.deployment.mode = "multi" and warns when the mode is unset.
  #
  # The old `oauth.dpop.replay-store` key is retired, and a config still
  # setting it fails boot naming it.

  # How long a proof's replay record is kept, in seconds. MUST be at least
  # 2 x iatWindowSeconds + 1: the iat check is symmetric and truncated to
  # whole seconds, so a proof stays acceptable from iat - W until iat + W + 1.
  # Below that the verifier logs a warning (event
  # "dpop_replay_ttl_below_window") and a proof can outlive its replay record.
  # The default (300 against a 60s window) clears it.
  replayStoreTtlSeconds = 300

  # #530: server-provided nonce (RFC 9449 §8 / §9). Without one the only
  # freshness control on a proof is `iat` skew, which is weak for tokens that
  # live longer than a few minutes. The nonce is stateless — a time bucket and
  # an HMAC under `secret`, which every replica shares — so nothing is stored
  # and a nonce minted by one replica verifies on every other.
  #
  #   required = "never"  -- no nonce is asked for (default)
  #   required = "as"     -- the token endpoint asks: a proof without a valid
  #                          nonce gets 400 use_dpop_nonce + a DPoP-Nonce header
  #   required = "as+rs"  -- protected resources ask too: 401 with
  #                          WWW-Authenticate: DPoP error="use_dpop_nonce"
  #
  # Every accepted proof's answer carries the current nonce as well, so a
  # client learns of a rotation (every ttlSeconds; the previous bucket stays
  # accepted) before it needs to. `secret` is required once `required` is not
  # "never": at least 32 bytes of random material (`openssl rand -base64 32`),
  # measured on the DECODED value -- 32 hex characters are only 16 bytes.
  nonce {
    required = "never"
    required = ${?DPOP_NONCE_REQUIRED}
    ttlSeconds = 300
    ttlSeconds = ${?DPOP_NONCE_TTL_SECONDS}
    secret = ${?DPOP_NONCE_SECRET}
  }
}

renamed-variables {
  OAUTH_DPOP_NONCE_REQUIRED = null
  OAUTH_DPOP_NONCE_REQUIRED = ${?OAUTH_DPOP_NONCE_REQUIRED}
  DPOP_NONCE_REQUIRED = null
  DPOP_NONCE_REQUIRED = ${?DPOP_NONCE_REQUIRED}
  OAUTH_DPOP_NONCE_TTL_SECONDS = null
  OAUTH_DPOP_NONCE_TTL_SECONDS = ${?OAUTH_DPOP_NONCE_TTL_SECONDS}
  DPOP_NONCE_TTL_SECONDS = null
  DPOP_NONCE_TTL_SECONDS = ${?DPOP_NONCE_TTL_SECONDS}
  OAUTH_DPOP_NONCE_SECRET = null
  OAUTH_DPOP_NONCE_SECRET = ${?OAUTH_DPOP_NONCE_SECRET}
  DPOP_NONCE_SECRET = null
  DPOP_NONCE_SECRET = ${?DPOP_NONCE_SECRET}
}
