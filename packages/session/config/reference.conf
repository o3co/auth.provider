# packages/session/config/reference.conf
# Default configuration for @o3co/auth-provider-session: the sections of its
# modules, each named after the module -- `session` (the session module's:
# the login routes' settings) and `session-store` (the session store's: the
# session cookie and the store express-session keeps sessions in). A
# composition root layers it because the modules declare it.
#
# The paths these keys moved from refuse boot naming the new ones:
# `endpoints.login.url`, `rateLimit.login`, and each key of the cookie and
# its store under `session`. The variables renamed with them are captured in
# `renamed-variables` below: an old name set refuses boot unless its new name
# is set to the same value.

session {
  # Every URL `POST /session/login` may accept as `redirect_to`, matched
  # EXACTLY (after URL normalization) -- no wildcards, no prefixes, and a query
  # string is part of the match.
  #
  # An empty list refuses every `redirect_to`, which is the right setting for
  # the deployments that never send one. A refused request answers 400
  # invalid_redirect naming the reason (`no-allowlist`, `not-allowlisted`,
  # `insecure-scheme`, ...).
  #
  # `http://` is accepted for loopback hosts only (localhost, 127.0.0.0/8,
  # [::1]); every other host must be https. When `session-store.domain` is
  # set, an entry outside it fails BOOT rather than being silently ignored.
  #
  # This is the login flow's list. The federation flow has its own, per
  # provider, at `federations.<name>.redirectAllowlist`.
  redirectAllowlist = []

  # CSRF policy for POST /session/login and POST /session/logout.
  #
  # The routes accept a request that carries EITHER a same-origin (or trusted)
  # Origin/Referer, OR a valid double-submit token; they reject one that
  # carries neither. GET /session/csrf hands out the token, which the client
  # echoes from the `<session cookie name>.csrf` cookie into the
  # `x-csrf-token` header (or a `csrf_token` form field).
  csrf {
    # Origins other than this server's own that may satisfy the Origin/Referer
    # arm. Set this when the login UI is served from a DIFFERENT origin than
    # the provider -- e.g. a SPA on https://app.example.com posting to
    # https://auth.example.com.
    #
    # The same list decides where an account-link start
    # (GET /session/oauth/federation/<name>?link=1) may be navigated from: an
    # account page on a sibling host goes here, since the browser's
    # `Sec-Fetch-Site: same-site` covers every host on the registrable domain.
    #
    # Deliberately separate from `cors.allowedOrigins`. "May read my
    # responses" and "may make me change state" are two decisions; one list
    # cannot answer both.
    trustedOrigins = []
    # Lifetime of an issued token, in seconds. It only has to outlive the time
    # a login form sits open, and the paired cookie expires with it.
    #
    # Must be an integer from 1 to 86400 (24h); boot fails otherwise. This
    # value is stringified into the token as its expiry field, so a decimal
    # mints tokens that fail their own shape check, and a zero -- which is
    # what an EMPTY SESSION_CSRF_TTL_SECONDS coerces to -- mints tokens that
    # are already expired.
    ttlSeconds = 7200
    ttlSeconds = ${?SESSION_CSRF_TTL_SECONDS}
  }

  # The deployment-owned login page a browser that is not signed in is sent
  # to, with `redirect_to` naming the request to come back to. A path or an
  # absolute URL, which may carry a query and a fragment of its own but not
  # `redirect_to`: the provider adds it.
  loginPage {
    url = "/login"
    url = ${?SESSION_LOGIN_PAGE_URL}
  }

  # Brute-force guard for `POST /session/login`, `windowMs` in milliseconds.
  # The route runs on the shared `rateLimiter` component (keyed
  # `login:ip:<ip>`) rather than a per-process store, so behind a load
  # balancer or across replicas this is one bucket set rather than one per
  # process. The session module contributes these values as the `login`
  # budget every limiter reads, so they stay the single source of truth.
  # Values no limiter can apply refuse to boot, naming this key; they are
  # never replaced by the limiter's default.
  #
  # NOTE: `req.ip` is the load balancer's address unless `http.trustProxy` is
  # set. Without it every user shares one bucket and the limit reads as an
  # outage.
  rateLimit {
    login { windowMs = 900000, limit = 20 }
  }
}

session-store {
  # REQUIRED. Signs the cookie that IS the authenticated session, so anyone
  # who guesses it can forge a login. At least 32 bytes (256 bits) of random
  # material -- `openssl rand -hex 32`. Hex/base64 values are measured
  # DECODED, so a 32-character hex string counts as 16 bytes and is refused.
  # No default: the module refuses to build without it.
  secret = ${?SESSION_STORE_SECRET}
  # A `__Host-` name requires `secure = true`, path `/` and no `domain`. If
  # SESSION_STORE_SECURE=false or SESSION_STORE_DOMAIN is set, also set
  # SESSION_STORE_NAME to a name without the prefix.
  name = "__Host-auth.session"
  name = ${?SESSION_STORE_NAME}
  # Positive whole milliseconds, at most one year. An exported-but-empty
  # SESSION_STORE_MAX_AGE resolves to "" and coerces to 0, which emits an
  # already-expired cookie, so it is refused.
  maxAge = 3600000
  maxAge = ${?SESSION_STORE_MAX_AGE}
  secure = true
  secure = ${?SESSION_STORE_SECURE}
  # `sameSite = "none"` requires `secure = true`: browsers drop a
  # SameSite=None cookie that is not Secure, so the combination is refused at
  # boot rather than failing silently in the client.
  sameSite = "lax"
  sameSite = ${?SESSION_STORE_SAME_SITE}
  domain = null
  domain = ${?SESSION_STORE_DOMAIN}
  # Where express-session keeps sessions: "redis" (shared across replicas)
  # or "memory" (one process, refused under core.deployment.mode = "multi").
  # A type's own options sit in the block named after it.
  storage {
    type = "redis"
    type = ${?SESSION_STORE_STORAGE_TYPE}
    redis {
      url = "redis://localhost:6379"
      url = ${?SESSION_STORE_STORAGE_REDIS_URL}
      password = ${?SESSION_STORE_STORAGE_REDIS_PASSWORD}
    }
  }
}

# What the resolution saw of each environment variable this package's modules
# renamed: each name null, then its value when set. Boot judges these and
# removes the section before it parses the configuration. Never write it in
# another layer.
renamed-variables {
  ENDPOINTS_LOGIN_URL = null
  ENDPOINTS_LOGIN_URL = ${?ENDPOINTS_LOGIN_URL}
  SESSION_LOGIN_PAGE_URL = null
  SESSION_LOGIN_PAGE_URL = ${?SESSION_LOGIN_PAGE_URL}
  SESSION_SECRET = null
  SESSION_SECRET = ${?SESSION_SECRET}
  SESSION_STORE_SECRET = null
  SESSION_STORE_SECRET = ${?SESSION_STORE_SECRET}
  SESSION_NAME = null
  SESSION_NAME = ${?SESSION_NAME}
  SESSION_STORE_NAME = null
  SESSION_STORE_NAME = ${?SESSION_STORE_NAME}
  SESSION_MAX_AGE = null
  SESSION_MAX_AGE = ${?SESSION_MAX_AGE}
  SESSION_STORE_MAX_AGE = null
  SESSION_STORE_MAX_AGE = ${?SESSION_STORE_MAX_AGE}
  SESSION_SECURE = null
  SESSION_SECURE = ${?SESSION_SECURE}
  SESSION_STORE_SECURE = null
  SESSION_STORE_SECURE = ${?SESSION_STORE_SECURE}
  SESSION_SAME_SITE = null
  SESSION_SAME_SITE = ${?SESSION_SAME_SITE}
  SESSION_STORE_SAME_SITE = null
  SESSION_STORE_SAME_SITE = ${?SESSION_STORE_SAME_SITE}
  SESSION_DOMAIN = null
  SESSION_DOMAIN = ${?SESSION_DOMAIN}
  SESSION_STORE_DOMAIN = null
  SESSION_STORE_DOMAIN = ${?SESSION_STORE_DOMAIN}
  SESSION_STORAGE_TYPE = null
  SESSION_STORAGE_TYPE = ${?SESSION_STORAGE_TYPE}
  SESSION_STORE_STORAGE_TYPE = null
  SESSION_STORE_STORAGE_TYPE = ${?SESSION_STORE_STORAGE_TYPE}
  SESSION_STORAGE_REDIS_URL = null
  SESSION_STORAGE_REDIS_URL = ${?SESSION_STORAGE_REDIS_URL}
  SESSION_STORE_STORAGE_REDIS_URL = null
  SESSION_STORE_STORAGE_REDIS_URL = ${?SESSION_STORE_STORAGE_REDIS_URL}
  SESSION_STORAGE_REDIS_PASSWORD = null
  SESSION_STORAGE_REDIS_PASSWORD = ${?SESSION_STORAGE_REDIS_PASSWORD}
  SESSION_STORE_STORAGE_REDIS_PASSWORD = null
  SESSION_STORE_STORAGE_REDIS_PASSWORD = ${?SESSION_STORE_STORAGE_REDIS_PASSWORD}
}
