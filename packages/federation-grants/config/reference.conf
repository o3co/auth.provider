# packages/federation-grants/config/reference.conf
# Default configuration for @o3co/auth-provider-federation-grants: the
# federation-grants module's own section, `federation-grants`. A composition
# root layers it because the module declares it.
#
# Federation grants: offline delegation of an upstream IdP's tokens to a
# backend or an agent, with no user session behind the call. Off by default.
# A composition that enables it installs the routes, a grant store and an
# intent store, and needs the consent page, a callbackURL per connection and a
# login page -- each refused at boot when missing (see the package README).
# Each grant store's own settings -- its key ring, its retention, its key
# prefix -- are its own section's.
#
# `maxExpiresIn` is the most an operator permits a single grant to live, in
# seconds. The default is thirty days, NOT the one-year ceiling the code
# enforces above it: an operator raises it deliberately. `defaultExpiresIn` is
# what a new grant gets when the caller asks for nothing.
#
# `allowKeepOnSubjectRevocation` decides what a subject-wide revocation may do
# with this subject's grants. Off: every such call ends them along with the
# sessions and the tokens. On: a caller MAY ask for the established ones to be
# kept -- the sessions and tokens still end, and every renewal in flight is
# ended with them. It is configuration and not a per-call flag because it is a
# decision about residual access: a password change that leaves a backend's
# month-old calendar access alive is right for some deployments and a breach
# for others, and the caller is not the one who knows which. Turning it on
# needs a subject-revocation adapter that can stamp the two boundaries
# separately; boot refuses the pairing rather than silently revoking.
#
# `identityLookup`: "required" refuses an upstream account already linked to
# another local user, which needs UserRepository.findSubjectByFederatedIdentity
# and supportsFederatedIdentityLookup answering true for every connection's
# registration, and refuses to boot otherwise -- the bundled
# InMemoryUserRepository covers none. "unsupported" records that the check is
# not made.
#
# `consent.url`: the deployment's consent page. No default -- enabling grants
# without one is refused at boot. A path, or an absolute URL on the provider's
# origin.
#
# Each entry under `connections` is what a grant may be for. `boundary` and
# `maxAccessTokenLifetime` have no defaults on purpose: a guessed access-token
# maximum invents a residual-access policy, and a guessed boundary silently
# shares one between connections that should not share it. One entry, as a
# deployment writes it:
#
#   connections {
#     files {
#       federation = "entra-files"          # a core.federations.<name> of type oidc
#       scopes = ["openid", "profile", "offline_access", "Files.Read"]
#       boundary = "production"
#       maxAccessTokenLifetime = 3600
#       callbackURL = "https://auth.example/session/federation-grants/callback/files"
#       allowScopeSubsets = false
#       # Verified id_token claims handed to the Store beside the sub; a
#       # callback missing one refuses without asking. None by default.
#       # Immutable identifiers only (never email / upn / preferred_username);
#       # ignored under identityLookup = "unsupported".
#       identityClaims = ["oid", "tid"]
#     }
#   }
#
# `federationGrants`, the section's old path, refuses boot naming this one
# wherever the module is installed; the standalone template installs it
# whenever that path is written. The variables keep their names: each already
# derives from its path here.
federation-grants {
  enabled = false
  enabled = ${?FEDERATION_GRANTS_ENABLED}
  defaultExpiresIn = 2592000
  maxExpiresIn = 2592000
  refreshBuffer = 30
  ineligibleRetryAfter = 300
  refreshFailureBackoff = 30
  upstreamTimeoutMs = 10000
  upstreamHardTimeoutMs = 25000
  refreshLockTtlMs = 30000
  lockWaitMs = 5000
  persistRetryBudgetMs = 3000
  allowKeepOnSubjectRevocation = false
  allowKeepOnSubjectRevocation = ${?FEDERATION_GRANTS_ALLOW_KEEP_ON_SUBJECT_REVOCATION}
  identityLookup = "required"
  identityLookup = ${?FEDERATION_GRANTS_IDENTITY_LOOKUP}
  consent {
    url = ${?FEDERATION_GRANTS_CONSENT_URL}
  }
  connections {}
}
