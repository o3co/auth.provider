# SMTP mail sender defaults -- @o3co/auth-provider-smtp
#
# The single source of truth for the defaults of `smtp-mail-sender`, the SMTP
# mail sender's module's section (ADR 2026-04-30: defaults live in HOCON,
# never in Zod .default()). A composition root layers this file between its
# own application.conf and core's reference.conf; the module declares it, so
# core's moduleReferences(modules) names it.
#
# The relay (the MFA ADR's D5): port 587 with STARTTLS by default; `tls` is
# implicit TLS (port 465, usually), and `none` -- plaintext -- is refused to a
# host that is not loopback. The host, the account and the sender's address
# have no default; the password is read from the environment. Each key has
# its variable, SMTP_MAIL_SENDER_<KEY>.

smtp-mail-sender {
  host = ${?SMTP_MAIL_SENDER_HOST}
  port = 587
  port = ${?SMTP_MAIL_SENDER_PORT}
  secure = "starttls"
  secure = ${?SMTP_MAIL_SENDER_SECURE}
  user = ${?SMTP_MAIL_SENDER_USER}
  password = ${?SMTP_MAIL_SENDER_PASSWORD}
  from = ${?SMTP_MAIL_SENDER_FROM}
}
