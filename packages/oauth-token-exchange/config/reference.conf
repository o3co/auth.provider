# packages/oauth-token-exchange/config/reference.conf
# Default configuration for @o3co/auth-provider-oauth-token-exchange: the
# token-exchange module's own section, `oauth-token-exchange`. A composition
# root layers it because the module declares it.
#
# maxActorChainDepth: the deepest existing RFC 8693 actor chain accepted
# before the current actor is added. Depth 3 allows one current actor plus two
# prior nested actors; lower it for stricter delegation environments.
#
# `oauth.tokenExchange` is the section's old path, which boot refuses naming
# `oauth-token-exchange` wherever the module is installed. Nothing is bound
# there. OAUTH_TOKEN_EXCHANGE_MAX_ACTOR_CHAIN_DEPTH is the name the new path
# derives, so it keeps its name.

oauth-token-exchange {
  maxActorChainDepth = 3
  maxActorChainDepth = ${?OAUTH_TOKEN_EXCHANGE_MAX_ACTOR_CHAIN_DEPTH}
}
