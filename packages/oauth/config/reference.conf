  OAUTH_AUTHORIZATION_GRANTS_CLIENT_CREDENTIALS_ENABLED = ${?OAUTH_AUTHORIZATION_GRANTS_CLIENT_CREDENTIALS_ENABLED}
  OAUTH_GRANTS_JWT_BEARER_ENABLED = null
  OAUTH_GRANTS_JWT_BEARER_ENABLED = ${?OAUTH_GRANTS_JWT_BEARER_ENABLED}
