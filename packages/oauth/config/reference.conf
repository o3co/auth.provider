# packages/oauth/config/reference.conf
# Default configuration for @o3co/auth-provider-oauth: the sections of its
# modules, each named after the module -- `oauth` (the oauth module's: the
# issuer, the token lifetimes and switches, /authorize's acr table, revocation,
# the consent page and the Client ID Metadata Documents), `oauth-session` and
# `oauth-authorization`. A composition root layers it because the modules
# declare it.
#
# Core's reference.conf still sets most of the same `oauth {}` paths, to the
# same values and with the same variables, until core's schema stops declaring
# the section; the order the two are layered in decides nothing.
#
# The modules read their grant switches at boot, from the configuration boot
# parses, so a switch this file binds is read as set.
#
# The paths these keys moved from refuse boot naming the new ones:
# `endpoints.consent.url`, every `oauth.grants.<grant>` and
# `oauth.refreshToken.unknownFamilyPolicy`. The variables renamed with them are
# captured in `renamed-variables` below: an old name set refuses boot unless
# its new name is set to the same value. `oauth.refreshToken.legacyRtPolicy`,
# `oauth.refreshToken.legacyTokenCompat` and
# `oauth.authorize.allowUnmarkedClients` are removed and refuse boot set to
# a value: the behaviour each switched no longer exists.

oauth {
  jwt {
    # REQUIRED. The canonical issuer stamped as `iss` on every token this
    # deployment mints, and the value resource servers pin. Absolute https URL
    # (http only for a loopback host), no query or fragment. There is no
    # default and no fallback: boot fails when it is unset rather than deriving
    # `iss` from the request's Host header.
    issuer = ${?OAUTH_JWT_ISSUER}
    # Whether the central JWT verifier accepts a token whose `typ` header is
    # absent (logging `jwt_verify_legacy_typ`). Off by default: a typ-less
    # token is a hard signal of misconfiguration or a downgrade attack.
    # Operators with v0.4.x tokens still in circulation can turn it on with
    # `OAUTH_JWT_LEGACY_TYP_ACCEPT=true` for their own bounded migration
    # window.
    legacyTypAccept = false
    legacyTypAccept = ${?OAUTH_JWT_LEGACY_TYP_ACCEPT}
  }
  # Access-token lifetime, in whole seconds: positive, at most one year. An
  # exported-but-empty variable fails boot rather than reading as zero.
  #
  #   defaultExpiresIn -- what every grant mints when the request asks for no
  #                       particular lifetime. Only token exchange (RFC 8693)
  #                       lets a request ask, through its optional `expires_in`
  #                       form parameter; every other grant always mints this.
  #   maxExpiresIn     -- the most a token-exchange `expires_in` can obtain; a
  #                       larger request is clamped to it. Unset means the
  #                       default, so nothing is extended unless the operator
  #                       opts in here. It is also the longest window in which
  #                       a resource server validating an exchanged token
  #                       offline cannot observe its revocation.
  #   expiresIn        -- DEPRECATED alias of `defaultExpiresIn`; see below.
  #
  # A default above the max fails boot naming both keys.
  #
  # No literal on `defaultExpiresIn` on purpose. The shipped 3600 stays on the deprecated
  # `expiresIn`, so a layer that still overrides that key -- an
  # application.conf, or OAUTH_ACCESS_TOKEN_EXPIRES_IN -- keeps deciding the
  # default instead of being outranked by a literal here. HOCON cannot alias
  # the two keys in this file: substitutions resolve per file before the layers
  # merge, so a reference to the old key would never see an override of it.
  # `resolveAccessTokenLifetime` resolves the alias instead: `defaultExpiresIn`
  # whenever it is set, otherwise `expiresIn`.
  accessToken {
    defaultExpiresIn = ${?OAUTH_ACCESS_TOKEN_DEFAULT_EXPIRES_IN}
    maxExpiresIn = ${?OAUTH_ACCESS_TOKEN_MAX_EXPIRES_IN}
    # DEPRECATED since v0.14.0: alias of `defaultExpiresIn` (and
    # OAUTH_ACCESS_TOKEN_EXPIRES_IN of OAUTH_ACCESS_TOKEN_DEFAULT_EXPIRES_IN),
    # read only while `defaultExpiresIn` is unset. Move an override to the new
    # key. See CHANGELOG.
    expiresIn = 3600
    expiresIn = ${?OAUTH_ACCESS_TOKEN_EXPIRES_IN}
  }
  refreshToken {
    expiresIn = 86400
    expiresIn = ${?OAUTH_REFRESH_TOKEN_EXPIRES_IN}
  }
  # Require `openid` in /authorize scope by default. `oidcMode` alone says
  # whether this is an OIDC Provider; `oauth.jwt.issuer` is required of every
  # deployment and says nothing about it. Set "dual" for deployments that
  # intentionally serve OAuth-only and OIDC clients from the same
  # authorization endpoint.
  oidcMode = "oidc-required"
  oidcMode = ${?OAUTH_OIDC_MODE}
  # What POST /oauth/revoke does with an ACCESS token.
  #
  #   "denylist"    -- revocation writes the token's `jti` to the
  #                    `accessTokenDenylist` component, which token
  #                    verification and introspection consult. Boot FAILS when
  #                    the composition serves the revocation endpoint and no
  #                    denylist is wired: RFC 7009 forces a 200 response, so an
  #                    unwired denylist means the operator is told the token is
  #                    revoked while it keeps working until it expires.
  #   "unsupported" -- this deployment does not revoke access tokens. The
  #                    endpoint answers `unsupported_token_type` for
  #                    `token_type_hint = access_token` (RFC 7009 §2.2.1)
  #                    instead of a hollow 200, and no denylist is needed.
  #
  # REFRESH-token revocation is governed by neither value: it runs off
  # `refreshTokenFamilyRevocation` and works in both modes.
  #
  # Multi-replica deployments need a SHARED denylist -- the bundled memory one
  # forks per replica, which `core.deployment.mode = "multi"` refuses (see the
  # replica-safety guard). The standalone template wires the Redis-backed
  # denylist off the shared ioredis socket.
  revocation {
    accessToken = "denylist"
    accessToken = ${?OAUTH_REVOCATION_ACCESS_TOKEN}

    # SUBJECT-level revocation -- the pair of stores a credential change
    # needs. `subjectSessionIndex` enumerates the sessions to cascade over;
    # `subjectRevocation` records the not-before watermark that refuses tokens
    # the cascade missed. One key for both because they are one capability: a
    # deployment that has neither has one thing to say.
    #
    #   "watermark"   -- the stores are wired and a credential change actually
    #                    invalidates what was already issued.
    #   "unsupported" -- this deployment has no subject-level revocation, on
    #                    purpose. A password reset leaves existing sessions and
    #                    access tokens working until they expire.
    #
    # Leave it UNSET when the stores are wired -- the guard only reads this key
    # when a slot is unfilled. Boot FAILS on an unfilled slot with no value
    # here: without the stores, the watermark check, the refresh-redemption
    # gate and `revokeAllForSubject` would go quiet with nothing failing and
    # nothing warning.
    #
    # The standalone template wires both on either adapter branch, so it never
    # needs this. REFRESH-token family revocation is governed by neither value:
    # it runs off `refreshTokenFamilyRevocation` and works regardless.
    subject = ${?OAUTH_REVOCATION_SUBJECT}
  }
  # Require a verified email before issuing tokens for an end-user
  # subject. Reads `emailVerified` from the user record the Store returned --
  # issuing, delivering and confirming the verification are the Store's job,
  # not this library's.
  #
  # Off by default: `emailVerified` is Store data many Stores do not model, and
  # defaulting this on would refuse every user of every deployment that has not
  # adopted the field. Enforced at `/authorize` and on the `session` grant --
  # the two points that hold the user's session at issuance. `refresh_token`
  # and token-exchange are deliberately not gated: they derive from an artifact
  # that already passed the gate when it was issued.
  requireEmailVerified = false
  requireEmailVerified = ${?OAUTH_REQUIRE_EMAIL_VERIFIED}
  # Deny-by-absence for the per-client `allowedGrantTypes` allowlist.
  #
  # A DECLARED allowlist restricts which grants a client may use, and absence
  # means "unrestricted", so registrations written without the field keep
  # their grants. The secure posture is therefore opt-in: off, a client whose
  # record omits `allowedGrantTypes` gets every grant.
  #
  # Set this to true once you have audited your registrations and every client
  # names its grants. A client that then omits the field is refused with
  # `unauthorized_client` at /oauth/token and at /authorize, rather than
  # inheriting everything.
  #
  # Independent of the per-grant rule: `client_credentials` and the
  # WebAuthn grant already deny by absence on their own, whatever this is set
  # to. The two compose to the stricter of the pair.
  requireGrantTypeAllowlist = false
  requireGrantTypeAllowlist = ${?OAUTH_REQUIRE_GRANT_TYPE_ALLOWLIST}

  # `/authorize` mints a code with no consent step, which is defensible
  # in a pure first-party OP and only there. It refuses any client not marked
  # `firstParty: true` in its registration -- one with no `firstParty` field
  # and one carrying an explicit `false` alike.
  #
  # This does NOT make /authorize safe against forced navigation for a client
  # that IS first-party -- that is the accepted model, and consent is the
  # step that changes it.
  #
  # The one-time `allowUnmarkedClients` migration flag is removed, and set
  # refuses boot. Core's reference.conf keeps the tombstone that writes a
  # still-exported OAUTH_AUTHORIZE_ALLOW_UNMARKED_CLIENTS at that removed path.
  authorize {
    # The Authentication Context Class References /authorize will vouch
    # for, each mapped to the RFC 8176 `amr` values a session must carry (`pwd`
    # for a password login, `fed` for a federated login, `mfa` once a second
    # factor was verified) -- or to a list of such lists, any ONE of which
    # satisfies it. `acr_values` is answered from this
    # table ALONE: a value it does not carry -- every value, while it is empty
    # -- is `unmet_authentication_requirements` at the redirect_uri, and
    # discovery advertises the keys as `acr_values_supported` only when there
    # are some. An entry, or an alternative, that requires nothing is refused
    # at boot: it would vouch for every session.
    #
    # An entry nothing installed can satisfy is DROPPED at boot -- not
    # advertised, answered `unmet_authentication_requirements` -- and logged
    # once as `acr_value_unsatisfiable`: at warn, or at info when only a second
    # factor is missing and no installed requirement reaches one. What can be
    # satisfied: `pwd`; a second factor's values once MFA is installed (`mfa`
    # when an installed factor adds it); `fed` while a federation is
    # installed; and anything else while an installed federation has
    # `trustUpstreamAmr` on, since its callback then records the upstream
    # IdP's `amr` beside `fed`.
    #
    #   acrValues {
    #     "urn:example:pwd" = ["pwd"]
    #     "urn:example:mfa" = ["pwd", "mfa"]
    #     "urn:example:phr" = [["hwk"], ["swk"]]
    #   }
    acrValues {}
  }
  # Hard ceiling on the OIDC `nonce` query parameter at /authorize.
  # Standard OIDC clients generate 22-44 char base64url nonces; 256 leaves
  # ~2x headroom for non-standard RPs. Operators with stricter requirements
  # set OAUTH_NONCE_MAX_LENGTH.
  nonce {
    maxLength = 256
    maxLength = ${?OAUTH_NONCE_MAX_LENGTH}
  }
  # RFC 8707: opt-in gate for Resource Indicator enforcement.
  # Secure-by-default: off at the library layer. Operators enable via
  # `OAUTH_RESOURCE_INDICATOR_ENABLED=true` or by overriding `enabled = true`
  # in their own application.conf layer.
  # Pattern: literal false + env-override line:
  # the literal provides the anchor so HOCON env-substitution has a binding
  # point; without it ${?VAR} is silently dropped when the env var is unset.
  resourceIndicator {
    enabled = false
    enabled = ${?OAUTH_RESOURCE_INDICATOR_ENABLED}
  }

  # The deployment-owned consent page a client that is not first-party is
  # routed through, with `?challenge=<id>`. The page reads what is being asked
  # from GET /oauth/consent and posts the answer to POST /oauth/consent.
  consentPage {
    url = "/consent"
    url = ${?OAUTH_CONSENT_PAGE_URL}
  }

  # Client ID Metadata Documents -- a client whose client_id is the https URL
  # of its own registration (draft-ietf-oauth-client-id-metadata-document, the
  # registration model MCP 2026-07-28 makes the SHOULD for hosted clients).
  # Off by default. Such a client is public (PKCE S256, no secret), never
  # first-party -- it goes through the consent step -- and every ceiling below
  # is the operator's: a document says who a client is, never what it may
  # reach. The list keys are comma-separated in the environment.
  #
  #   allowedScopes     -- what any such client may obtain (its document's
  #                        `scope` is intersected with this); empty admits none
  #   allowedAudiences  -- the resource servers it may mint for (RFC 8707
  #                        `resource`); empty admits only its own client_id
  #   allowedHosts      -- hosts a document may live on: exact, or `.suffix` for
  #                        a domain and its subdomains; empty admits any public
  #                        host. deniedHosts wins over it.
  #
  # The fetch follows no redirect, times out, caps the document (5 KB is the
  # draft's recommendation), and refuses a host that resolves to any RFC 6890
  # special-use address (loopback, private, link-local, the cloud metadata
  # endpoint) before the socket opens. A valid document is cached per URL for
  # its Cache-Control max-age, bounded by cacheMaxAgeMs.
  clientIdMetadataDocuments {
    enabled = false
    enabled = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_ENABLED}
    allowedScopes = []
    allowedScopes = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_ALLOWED_SCOPES}
    allowedAudiences = []
    allowedAudiences = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_ALLOWED_AUDIENCES}
    # Empty admits a document on any public host; list hosts to confine them.
    allowedHosts = []
    allowedHosts = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_ALLOWED_HOSTS}
    deniedHosts = []
    deniedHosts = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_DENIED_HOSTS}
    maxBytes = 5120
    maxBytes = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_MAX_BYTES}
    timeoutMs = 5000
    timeoutMs = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_TIMEOUT_MS}
    cacheMaxAgeMs = 600000
    cacheMaxAgeMs = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_CACHE_MAX_AGE_MS}
    # How many documents are remembered at once. The keys are chosen by an
    # unauthenticated caller -- every distinct client_id URL that resolves to
    # a valid document would otherwise hold a registration until it expired.
    maxCacheEntries = 256
    maxCacheEntries = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_MAX_CACHE_ENTRIES}
    # How long a registration this server already validated is still served
    # after a revalidation it could not complete -- a DNS blip, a 5xx, a
    # timeout. Refusing a working client because someone else's server is
    # down tells the caller their credential is bad when the truth is an
    # outage. A document this server REJECTED is not this: that entry goes
    # immediately. 0 disables it.
    staleIfErrorMs = 300000
    staleIfErrorMs = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_STALE_IF_ERROR_MS}
    # How long a refusal is remembered, so the same client_id is not
    # resolved and fetched again on every request. Short: a client that
    # fixes its document must not be locked out for the life of the process.
    negativeCacheMs = 60000
    negativeCacheMs = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_NEGATIVE_CACHE_MS}
    # How many documents may be in flight at once, across every client_id.
    # Without it, N slow hosts hold N sockets for the whole timeout each,
    # and an unauthenticated caller chooses N.
    maxConcurrentFetches = 8
    maxConcurrentFetches = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_MAX_CONCURRENT_FETCHES}
  }
}

# The session grant, which the oauth-session module installs. Secure by
# default: off until a deployment turns it on.
oauth-session {
  enabled = false
  enabled = ${?OAUTH_SESSION_ENABLED}
}

# The grants the oauth-authorization module installs, each off until a
# deployment turns it on.
#
# PKCE is mandatory for every authorization-code client and `S256` is the only
# method accepted: that is fixed policy (OAuth 2.1 §4.1.1, RFC 9700 §2.1.1),
# not a setting. A client that cannot compute SHA-256 is opted into `plain`
# one registration at a time (`allowPlainPkce: true`). The authorization-code
# grant's old `pkce` block, and OAUTH_GRANTS_AUTHORIZATION_CODE_PKCE_REQUIRE_S256,
# refuse boot.
oauth-authorization {
  grants {
    authorizationCode {
      enabled = false
      enabled = ${?OAUTH_AUTHORIZATION_GRANTS_AUTHORIZATION_CODE_ENABLED}
    }
    refreshToken {
      enabled = false
      enabled = ${?OAUTH_AUTHORIZATION_GRANTS_REFRESH_TOKEN_ENABLED}
      # Handling for refresh tokens whose family_id is not in the store.
      # "reject" is safe-by-default, and anything but "accept" reads as it.
      # Use "accept" only during a migration window (e.g. moving from v0.4.x
      # in-memory family store to Redis while old tokens are still in
      # circulation).
      unknownFamilyPolicy = "reject"
      unknownFamilyPolicy = ${?OAUTH_AUTHORIZATION_GRANTS_REFRESH_TOKEN_UNKNOWN_FAMILY_POLICY}
    }
    clientCredentials {
      enabled = false
      enabled = ${?OAUTH_AUTHORIZATION_GRANTS_CLIENT_CREDENTIALS_ENABLED}
    }
    # RFC 7523 JWT-bearer (`urn:ietf:params:oauth:grant-type:jwt-bearer`). The
    # public entry point for "present a device credential -> authenticate ->
    # get tokens": the grant verifies POSSESSION of the assertion, then hands
    # the resulting opaque handle to the Store's `authenticateByToken`. Who
    # that handle belongs to -- an existing user, or an anonymous subject for
    # an unlinked device -- is the Store's answer, not this library's.
    #
    # Unlike token exchange, this accepts PUBLIC clients: RFC 7523 §3 makes
    # client authentication optional, which is what a device holding a signed
    # assertion needs.
    #
    # Enabling it REQUIRES an `assertionVerifier` component. There is no
    # default and there will not be one: the only possible default is a
    # verifier that accepts things, and a bare identifier is not
    # authentication. Boot fails if the grant is on without one.
    #
    # The issued access token never outlives the assertion: its lifetime is
    # min(oauth.accessToken.defaultExpiresIn, assertion exp - now), and an
    # assertion with no whole second left is refused as invalid_grant. No
    # refresh token is issued -- a client re-exchanges a fresh assertion.
    jwtBearer {
      enabled = false
      enabled = ${?OAUTH_AUTHORIZATION_GRANTS_JWT_BEARER_ENABLED}
    }
  }
}

# What the resolution saw of each environment variable this package's modules
# renamed: each name null, then its value when set. Boot judges these and
# removes the section before it parses the configuration. Never write it in
# another layer.
renamed-variables {
  ENDPOINTS_CONSENT_URL = null
  ENDPOINTS_CONSENT_URL = ${?ENDPOINTS_CONSENT_URL}
  OAUTH_CONSENT_PAGE_URL = null
  OAUTH_CONSENT_PAGE_URL = ${?OAUTH_CONSENT_PAGE_URL}
  OAUTH_CIMD_ENABLED = null
  OAUTH_CIMD_ENABLED = ${?OAUTH_CIMD_ENABLED}
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_ENABLED = null
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_ENABLED = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_ENABLED}
  OAUTH_CIMD_ALLOWED_SCOPES = null
  OAUTH_CIMD_ALLOWED_SCOPES = ${?OAUTH_CIMD_ALLOWED_SCOPES}
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_ALLOWED_SCOPES = null
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_ALLOWED_SCOPES = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_ALLOWED_SCOPES}
  OAUTH_CIMD_ALLOWED_AUDIENCES = null
  OAUTH_CIMD_ALLOWED_AUDIENCES = ${?OAUTH_CIMD_ALLOWED_AUDIENCES}
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_ALLOWED_AUDIENCES = null
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_ALLOWED_AUDIENCES = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_ALLOWED_AUDIENCES}
  OAUTH_CIMD_ALLOWED_HOSTS = null
  OAUTH_CIMD_ALLOWED_HOSTS = ${?OAUTH_CIMD_ALLOWED_HOSTS}
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_ALLOWED_HOSTS = null
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_ALLOWED_HOSTS = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_ALLOWED_HOSTS}
  OAUTH_CIMD_DENIED_HOSTS = null
  OAUTH_CIMD_DENIED_HOSTS = ${?OAUTH_CIMD_DENIED_HOSTS}
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_DENIED_HOSTS = null
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_DENIED_HOSTS = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_DENIED_HOSTS}
  OAUTH_CIMD_MAX_BYTES = null
  OAUTH_CIMD_MAX_BYTES = ${?OAUTH_CIMD_MAX_BYTES}
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_MAX_BYTES = null
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_MAX_BYTES = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_MAX_BYTES}
  OAUTH_CIMD_TIMEOUT_MS = null
  OAUTH_CIMD_TIMEOUT_MS = ${?OAUTH_CIMD_TIMEOUT_MS}
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_TIMEOUT_MS = null
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_TIMEOUT_MS = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_TIMEOUT_MS}
  OAUTH_CIMD_CACHE_MAX_AGE_MS = null
  OAUTH_CIMD_CACHE_MAX_AGE_MS = ${?OAUTH_CIMD_CACHE_MAX_AGE_MS}
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_CACHE_MAX_AGE_MS = null
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_CACHE_MAX_AGE_MS = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_CACHE_MAX_AGE_MS}
  OAUTH_CIMD_MAX_CACHE_ENTRIES = null
  OAUTH_CIMD_MAX_CACHE_ENTRIES = ${?OAUTH_CIMD_MAX_CACHE_ENTRIES}
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_MAX_CACHE_ENTRIES = null
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_MAX_CACHE_ENTRIES = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_MAX_CACHE_ENTRIES}
  OAUTH_CIMD_STALE_IF_ERROR_MS = null
  OAUTH_CIMD_STALE_IF_ERROR_MS = ${?OAUTH_CIMD_STALE_IF_ERROR_MS}
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_STALE_IF_ERROR_MS = null
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_STALE_IF_ERROR_MS = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_STALE_IF_ERROR_MS}
  OAUTH_CIMD_NEGATIVE_CACHE_MS = null
  OAUTH_CIMD_NEGATIVE_CACHE_MS = ${?OAUTH_CIMD_NEGATIVE_CACHE_MS}
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_NEGATIVE_CACHE_MS = null
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_NEGATIVE_CACHE_MS = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_NEGATIVE_CACHE_MS}
  OAUTH_CIMD_MAX_CONCURRENT_FETCHES = null
  OAUTH_CIMD_MAX_CONCURRENT_FETCHES = ${?OAUTH_CIMD_MAX_CONCURRENT_FETCHES}
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_MAX_CONCURRENT_FETCHES = null
  OAUTH_CLIENT_ID_METADATA_DOCUMENTS_MAX_CONCURRENT_FETCHES = ${?OAUTH_CLIENT_ID_METADATA_DOCUMENTS_MAX_CONCURRENT_FETCHES}
  OAUTH_GRANTS_SESSION_ENABLED = null
  OAUTH_GRANTS_SESSION_ENABLED = ${?OAUTH_GRANTS_SESSION_ENABLED}
  OAUTH_SESSION_ENABLED = null
  OAUTH_SESSION_ENABLED = ${?OAUTH_SESSION_ENABLED}
  OAUTH_GRANTS_AUTHORIZATION_CODE_ENABLED = null
  OAUTH_GRANTS_AUTHORIZATION_CODE_ENABLED = ${?OAUTH_GRANTS_AUTHORIZATION_CODE_ENABLED}
  OAUTH_AUTHORIZATION_GRANTS_AUTHORIZATION_CODE_ENABLED = null
  OAUTH_AUTHORIZATION_GRANTS_AUTHORIZATION_CODE_ENABLED = ${?OAUTH_AUTHORIZATION_GRANTS_AUTHORIZATION_CODE_ENABLED}
  OAUTH_GRANTS_AUTHORIZATION_CODE_PKCE_REQUIRE_S256 = null
  OAUTH_GRANTS_AUTHORIZATION_CODE_PKCE_REQUIRE_S256 = ${?OAUTH_GRANTS_AUTHORIZATION_CODE_PKCE_REQUIRE_S256}
  OAUTH_GRANTS_REFRESH_TOKEN_ENABLED = null
  OAUTH_GRANTS_REFRESH_TOKEN_ENABLED = ${?OAUTH_GRANTS_REFRESH_TOKEN_ENABLED}
  OAUTH_AUTHORIZATION_GRANTS_REFRESH_TOKEN_ENABLED = null
  OAUTH_AUTHORIZATION_GRANTS_REFRESH_TOKEN_ENABLED = ${?OAUTH_AUTHORIZATION_GRANTS_REFRESH_TOKEN_ENABLED}
  OAUTH_REFRESH_TOKEN_UNKNOWN_FAMILY_POLICY = null
