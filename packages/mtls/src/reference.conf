# packages/mtls/src/reference.conf
# Default configuration for @o3co/auth-provider-mtls.
# Concatenated into the application config via the HOCON withFallback chain.
#
# `oauth.tokenBinding.dispatch-policy` is owned by `@o3co/auth-provider-core`
# (single source of truth across DPoP, mTLS, and future binding-mechanism
# modules) since the cross-mechanism dispatch refactor (2026-05-19). It is
# not redeclared here.
#
# Per Wave 2 Phase 3 spec §10.1 + secure-default-opt-in discipline
# (project feedback_secure_default_opt_in.md).

oauth.mtls {
  # Set to true to enable mTLS proof verification at the token endpoint.
  # Default: false — secure-default-opt-in (operators must explicitly enable).
  enabled = false

  # Where the leaf cert comes from.
  #   "tls-layer" — extract from the live TLS handshake via
  #                 req.socket.getPeerCertificate() (default). Requires the
  #                 auth provider's listener to be TLS-terminated with
  #                 requestCert = true. This is the RFC 8705 §3 shape: the
  #                 certificate is proven by the handshake, not asserted by
  #                 a header.
  #   "header"    — extract from a forwarded-cert header set by a reverse
  #                 proxy. Pairs with cert-header + cert-header-dialect, and
  #                 REQUIRES a non-empty trusted-proxies list (see below).
  source = "tls-layer"

  # Header name (lowercased) carrying the forwarded leaf cert.
  cert-header = "x-forwarded-client-cert"

  # Dialect for the forwarded-cert header value.
  #   "envoy"     — Envoy XFCC: By=…;Hash=…;Cert=<urlencoded-pem>;Chain=<urlencoded-pem>
  #   "plain-pem" — header value IS a literal PEM block (possibly URL-encoded).
  #                 Multi-PEM concatenation is REJECTED per spec OQ1 strict —
  #                 use the envoy dialect's Chain= field for chain transport.
  cert-header-dialect = "envoy"

  # Peer addresses allowed to forward a client certificate header.
  # Used only when source = "header"; boot FAILS if that source is selected
  # with an empty list.
  #
  # Checked against the address of the peer that opened the TCP connection
  # (req.socket.remoteAddress) — never req.ip, which X-Forwarded-For can
  # rewrite and an attacker can therefore choose. This is a separate control
  # from http.trustProxy: turning that on for rate limiting must not start
  # accepting forwarded client certificates.
  #
  # Entries use the shared trusted-proxy vocabulary owned by
  # @o3co/auth-provider-core, which is also Express's own `trust proxy`
  # vocabulary (#292):
  #   an IP        — an IPv4 or IPv6 literal. An IPv4 entry also matches the
  #                  IPv4-mapped form (::ffff:10.0.0.7) a dual-stack listener
  #                  reports.
  #   a CIDR range — 10.0.0.0/8, fc00::/7. The shape a pod network has, where
  #                  the ingress replica's address changes on every restart.
  #   a named range — "loopback" (127.0.0.0/8 and ::1 — the sidecar shape:
  #                  Envoy or nginx in the same pod / on the same host),
  #                  "linklocal", or "uniquelocal".
  #
  # A hostname, a typo'd keyword or a malformed prefix length fails at boot
  # rather than becoming a rule that silently never matches.
  #
  # An address allowlist is a network-level control, not a cryptographic one.
  # It is necessary, not sufficient: the proxy must still strip any inbound
  # copy of cert-header, and the hop between proxy and auth provider must not
  # be reachable by anyone able to spoof a source address. See the README
  # section "Trusted-Proxy Security Guidance".
  trusted-proxies = []

  # Trust posture for the leaf cert.
  #   "self-signed" — accept any well-formed cert; bind by SHA-256 of its DER.
  #                   Suitable when the AS controls all client certs
  #                   (RFC 8705 §2.2 Self-Signed Mutual-TLS).
  #   "pki"         — validate the leaf against a configured trust anchor list
  #                   using the narrow check set described in the README's
  #                   "PKI Mode Scope" section (NOT full RFC 5280 path
  #                   validation, and NO revocation). REQUIRES non-empty
  #                   trusted-cas and source = "header".
  #   "full-pki"     — RFC 5280 path validation with revocation (#341):
  #                   name constraints, the policy tree, keyUsage,
  #                   pathLenConstraint, unrecognised critical extensions, a
  #                   signature-algorithm allowlist, and CRL checking.
  #                   REQUIRES non-empty trusted-cas AND an explicit
  #                   full-pki.revocation block (see below). Works with either
  #                   source; under "tls-layer" the chain is read from the TLS
  #                   session.
  mode = "self-signed"

  # Trust anchors for mode = "pki". Empty list when mode = "self-signed".
  # Each entry is either a literal PEM block or a "file:<path>" reference.
  # Boot-time validation rejects:
  #   - source = "header" with an empty trusted-proxies list.
  #   - mode = "pki" with an empty trusted-cas list.
  #   - mode = "pki" with source = "tls-layer" (chain extraction deferred).
  #
  # NOTE: revocation (CRL / OCSP) is NOT checked in mode = "pki". A revoked
  # client certificate keeps binding tokens until it expires. Use
  # mode = "full-pki" for revocation, or rely on short certificate lifetimes.
  trusted-cas = []

  # Settings for mode = "full-pki" only (issue #341). Ignored in other modes.
  full-pki {
    # Maximum certificates in a path, leaf and trust anchor included.
    max-chain-depth = 6

    # Signature algorithms permitted at EVERY hop, not just the leaf — a chain
    # is only as strong as its weakest link. RFC 5280 §6.1.4 leaves this to
    # local policy, and without a policy "acceptable" means whatever the
    # underlying OpenSSL build parses.
    #
    # Legal values: sha256WithRSAEncryption, sha384WithRSAEncryption,
    # sha512WithRSAEncryption, rsassaPss, ecdsaWithSHA256, ecdsaWithSHA384,
    # ecdsaWithSHA512, ed25519, ed448. SHA-1 has no name here, so no
    # configuration can permit it.
    signature-algorithms = [
      "sha256WithRSAEncryption", "sha384WithRSAEncryption", "sha512WithRSAEncryption",
      "rsassaPss",
      "ecdsaWithSHA256", "ecdsaWithSHA384", "ecdsaWithSHA512",
      "ed25519", "ed448"
    ]

    # Minimum RSA modulus in bits. Ignored for EC and EdDSA keys, whose
    # strength the signature-algorithm allowlist already pins.
    min-rsa-key-bits = 2048

    # Revocation. THIS BLOCK HAS NO DEFAULTS: mode = "full-pki" fails boot
    # unless both `mode` and `on-unavailable` are set here.
    #
    # That is deliberate. "The CRL endpoint is unreachable" and "the
    # certificate is not revoked" are different facts, and whether an outage
    # should block logins or be waved through depends on a threat model only
    # the operator has. A library that picks silently picks wrong for half of
    # its deployments, and only during the outage that makes it matter.
    #
    # revocation {
    #   # "crl"      — fetch and check CRLs from each certificate's
    #   #              cRLDistributionPoints.
    #   # "disabled" — do not check revocation. An explicit statement that this
    #   #              deployment accepts that a revoked certificate keeps
    #   #              binding tokens until it expires.
    #   #
    #   # OCSP (RFC 6960) is not implemented; naming it here fails boot rather
    #   # than being accepted and ignored.
    #   mode = "crl"
    #
    #   # What to do when status cannot be determined — the CRL is unreachable,
    #   # unparseable, expired, or the certificate names no distribution point.
    #   #   "reject" — refuse the certificate (fail closed).
    #   #   "allow"  — accept it, logged at warn every time (fail open).
    #   on-unavailable = "reject"
    #
    #   # Hosts revocation material may be fetched from. REQUIRED and non-empty
    #   # when mode = "crl".
    #   #
    #   # A distribution point is a URL inside a certificate, so fetching one
    #   # makes this process issue a request to a destination someone else
    #   # chose — the classic SSRF shape, and `http://169.254.169.254/…` is
    #   # reachable from most cloud workloads. Path validation runs first, so
    #   # only a certificate that already chains to one of your trusted-cas can
    #   # trigger a fetch at all; this list is the second layer, drawing the
    #   # same line trusted-proxies draws: trusting a CA to issue certificates
    #   # is not trusting it to name destinations inside your network.
    #   #
    #   # Entries are "host" or "host:port"; an entry without a port matches
    #   # any port. Redirects are never followed.
    #   allowed-hosts = ["crl.example.com"]
    #
    #   fetch-timeout-ms = 3000
    #   # Upper bound on CRL reuse. The CRL's own nextUpdate wins when sooner.
    #   cache-ttl-seconds = 3600
    #   max-response-bytes = 1048576
    # }
  }
}
