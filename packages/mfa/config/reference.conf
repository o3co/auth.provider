# MFA defaults -- @o3co/auth-provider-mfa
#
# The single source of truth for the defaults of the sections this package's
# modules read (ADR 2026-04-30: defaults live in HOCON, never in Zod
# .default()): `mfa`, the MFA module's; `mfa-totp-factor`, the TOTP factor's
# module's; `mfa-recovery-code-factor`, the recovery-code factor's;
# `mfa-email-factor`, the email factor's. A composition root layers this file
# between its own application.conf and core's reference.conf, as the package
# README shows.
#
# The mode: whether a password login asks for a second factor -- "off",
# "optional" or "required". The MFA module honours "optional" and
# "required", and refuses "off", its default here: installed is on. MFA_MODE
# sets it.
#
# The step-up page: the deployment's page a browser is sent to when a
# request needs a step-up, with `redirect_to` and the `acr_values` a step-up
# can meet. MFA_PAGE_URL sets it. Its old path, `endpoints.mfa.url`, is
# bound nowhere; boot refuses it naming this one wherever the MFA module is
# installed, and its old variable, ENDPOINTS_MFA_URL, is declared renamed on
# the MFA module and captured in `renamed-variables` below.
#
# The key ring: the first key seals every factor's data and every listed key
# opens it. A key is canonical base64 of 32 bytes
# (`openssl rand -base64 32`). There is no default: MFA_ENCRYPTION_KEY feeds
# the first entry, and without it the MFA settings are refused. The published
# development sample key (MFA_DEVELOPMENT_SAMPLE_KEY) is refused where the
# configuration was selected as production or staging, where NODE_ENV is
# either, and under core.deployment.mode = "multi".
#
# An entry written without an id is named by its key's fingerprint, so
# changing MFA_ENCRYPTION_KEY in place leaves what the old key sealed
# "key_unavailable", naming that fingerprint, until the old key is put back.
# An entry written with an id keeps that id: never change its key in place.
# To rotate, write the ring in a deployment-owned layer -- add the new key
# last as an entry of its own (a new id, or none), then move it first -- and
# keep the old key until nothing sealed under it, and no digest naming it, is
# left.
#
# A transaction: one second-factor ceremony lives
# transactionTtlSeconds -- 60 to 1800 seconds; every expiry is derived from it
# alone -- and allows maxAttemptsPerTransaction attempts, 2 to 10: a first
# binding given with the account-email proof spends one on the proof and one
# on the binding. The lock holds guessable proofs for a subject: from the
# threshold-th consecutive failure a backoff of baseSeconds, doubling to
# maxSeconds and forgotten memorySeconds after the last lock ends; at most
# weeklyBudget failures in any rolling seven days, whatever succeeds between
# them; and the hardLimit-th attempt since the last success -- whatever its
# outcome; at least 10, above threshold, and at most 100, NIST SP 800-63B-4's
# cap on failures -- holds them until every guessable factor is bound again
# and the subject releases the hold after a recovery code or a passkey, or an
# operator resets the subject; an exempt success does not lift the hold, and
# no password change clears it.
#
# TOTP, the `mfa-totp-factor` section: on by default, because it
# needs nothing from the deployment. algorithm, digits and period apply to new
# enrollments -- each factor keeps the ones it was enrolled with -- and window
# to every verification: digits 6 to 8, period 15 to 120 seconds, window 0 to
# 2 steps either side of now. The issuer an authenticator app shows defaults
# to the host of the deployment's issuer, which the factor's module reads
# from the oauthTokenSettings slot (the oauth module fills it from
# oauth.jwt.issuer). Each key has its variable, MFA_TOTP_FACTOR_<KEY>.
#
# The MFA routes have no budget here: every /session/mfa POST is limited by
# the deployment's rateLimiter per client address under the prefix `mfa`
# (`mfa:ip:<ip>`), by its own `limits.mfa` or else its `defaultLimit`.
# Without a rateLimiter wired, they pass every request through.
#
# Recent MFA: mfa.manage.maxAgeSeconds, 60 to 3600 seconds, is how long a
# second factor verified in a session stays recent -- what an action that adds
# a way into the account asks of the session: linking an identity, registering
# a passkey, enrolling a factor outside a login, removing one, releasing the
# subject's lock or regenerating recovery codes. A recovery code or a passkey
# verified authorizes that session's release of the lock for as long; 3600 is
# the longest such an authorization lasts.
#
# A subject's records: mfa.maxFactorsPerSubject, 2 to 100, is how many
# factor records a subject may hold -- its recovery codes are one -- before an
# enrollment from its session is refused (409 mfa_factor_limit).
#
# One Store call's time: mfa.storeTimeoutMs, from 1000 ms, which
# MFA_STORE_TIMEOUT_MS sets. Set it to at least every store's own per-call
# timeout -- the factor store's, the MFA transaction store's and the user
# directory's (in the standalone template: repositories.user.http.timeout,
# REPOSITORIES_USER_HTTP_TIMEOUT, 5000 ms; the Redis stores' commandTimeout,
# 1000 ms). Nothing holds the two together: a store with no per-call deadline
# is not bounded by this key, and for it one write at a time does not hold.
# A write to a subject's factor set -- a removal, a binding, a regeneration of
# recovery codes, a witness mark, a release of the lock, the operator reset --
# takes the subject's lease for sixteen of it: the most Store calls one writer
# makes (fourteen), the acquire and one to spare. It gives up before a write
# when less than one is left; one whose lease would pass the longest subject
# lease (600000 ms, so above 37500 ms) refuses the boot. The MFA module builds the lease owner from this
# key and provides it (mfaSubjectLeases); every writer holds a lease of the
# same rules, and the operator reset's module requires it, so the reset is
# there only where the MFA module is installed. The key goes once the stores' ports
# declare their own deadline, or once a subject's factor set is written by
# one conditional or transactional owner.
#
# The first binding's proof: mfa.enrollment.requireEmailProof, which
# MFA_ENROLLMENT_REQUIRE_EMAIL_PROOF sets. "when-mail" asks a subject with no
# counting factor for the account-email proof -- a long code mailed to the
# account's address -- before it binds one, when a mail sender is wired and
# the account has an address; "always" asks for it always, and refuses the
# boot without a mail sender; "never" asks for none. With "when-mail" and no
# mail sender the boot says once that a first binding goes without it
# (mfa_first_binding_without_email_proof). An operator reset's
# requireEmailProof asks for it whatever this says.
#
# Recovery codes, the `mfa-recovery-code-factor` section: on, with
# `count` codes to a set (1 to 20), issued beside a subject's first counting
# factor. Each key has its variable, MFA_RECOVERY_CODE_FACTOR_<KEY>.
#
# The email factor, the `mfa-email-factor` section: off, adding no
# `mfa`, a code -- its six-digit login code and its enrollment code -- living
# codeTtlSeconds (60 to 1800), capped at the transaction's expiry. Switched on,
# it needs a mail sender: without one its module refuses the boot, naming the
# `mailSender` slot. The mail's text, its sending and any limit on sending are
# the mail sender's. Each key has its variable, MFA_EMAIL_FACTOR_<KEY>.
#
# `mfa.factors.totp` is the TOTP factor's old path, which boot refuses naming
# `mfa-totp-factor` wherever the factor's module is installed. Nothing is
# bound there. Its variables, MFA_TOTP_ENABLED and MFA_TOTP_ISSUER, are
# declared renamed on the factor's module (MFA_TOTP_FACTOR_ENABLED,
# MFA_TOTP_FACTOR_ISSUER), and `renamed-variables` below captures them too.
#
# `renamed-variables` captures each renamed variable's old and new name as
# this file is resolved: boot refuses an old name set unless the new one is
# set to the same value.

mfa {
  mode = "off"
  mode = ${?MFA_MODE}
  page {
    url = "/mfa"
    url = ${?MFA_PAGE_URL}
  }
  encryptionKeys = [
    { key = ${?MFA_ENCRYPTION_KEY} }
  ]
  transactionTtlSeconds = 600
  maxAttemptsPerTransaction = 5
  lockout {
    threshold = 5
    baseSeconds = 900
    maxSeconds = 86400
    memorySeconds = 86400
    weeklyBudget = 10
    hardLimit = 100
  }
  manage {
    maxAgeSeconds = 300
  }
  enrollment {
    requireEmailProof = "when-mail"
    requireEmailProof = ${?MFA_ENROLLMENT_REQUIRE_EMAIL_PROOF}
  }
  maxFactorsPerSubject = 10
  storeTimeoutMs = 5000
  storeTimeoutMs = ${?MFA_STORE_TIMEOUT_MS}
}

mfa-totp-factor {
  enabled = true
  enabled = ${?MFA_TOTP_FACTOR_ENABLED}
  algorithm = "SHA1"
  algorithm = ${?MFA_TOTP_FACTOR_ALGORITHM}
  digits = 6
  digits = ${?MFA_TOTP_FACTOR_DIGITS}
  period = 30
  period = ${?MFA_TOTP_FACTOR_PERIOD}
  window = 1
  window = ${?MFA_TOTP_FACTOR_WINDOW}
  issuer = ${?MFA_TOTP_FACTOR_ISSUER}
}

mfa-recovery-code-factor {
  enabled = true
  enabled = ${?MFA_RECOVERY_CODE_FACTOR_ENABLED}
  count = 10
  count = ${?MFA_RECOVERY_CODE_FACTOR_COUNT}
}

mfa-email-factor {
  enabled = false
  enabled = ${?MFA_EMAIL_FACTOR_ENABLED}
  addsMfa = false
  addsMfa = ${?MFA_EMAIL_FACTOR_ADDS_MFA}
  codeTtlSeconds = 600
  codeTtlSeconds = ${?MFA_EMAIL_FACTOR_CODE_TTL_SECONDS}
}

renamed-variables {
  ENDPOINTS_MFA_URL = null
  ENDPOINTS_MFA_URL = ${?ENDPOINTS_MFA_URL}
  MFA_PAGE_URL = null
  MFA_PAGE_URL = ${?MFA_PAGE_URL}
  MFA_TOTP_ENABLED = null
  MFA_TOTP_ENABLED = ${?MFA_TOTP_ENABLED}
  MFA_TOTP_FACTOR_ENABLED = null
  MFA_TOTP_FACTOR_ENABLED = ${?MFA_TOTP_FACTOR_ENABLED}
  MFA_TOTP_ISSUER = null
  MFA_TOTP_ISSUER = ${?MFA_TOTP_ISSUER}
  MFA_TOTP_FACTOR_ISSUER = null
  MFA_TOTP_FACTOR_ISSUER = ${?MFA_TOTP_FACTOR_ISSUER}
}
