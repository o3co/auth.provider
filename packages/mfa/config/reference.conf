# MFA defaults -- @o3co/auth-provider-mfa
#
# The single source of truth for the defaults of the `mfa` keys this package
# reads (ADR 2026-04-30: defaults live in HOCON, never in Zod .default()).
# `mfa.mode` is core's key and stays in core's reference.conf. A composition
# root layers this file between its own application.conf and core's
# reference.conf, as the package README shows.
#
# The key ring (the MFA ADR's D11): the first key seals every factor's data
# and every listed key opens it. A key is canonical base64 of 32 bytes
# (`openssl rand -base64 32`). There is no default: MFA_ENCRYPTION_KEY feeds
# the first entry, and without it the MFA settings are refused. The published
# development sample key (MFA_DEVELOPMENT_SAMPLE_KEY) is refused where the
# configuration was selected as production or staging, where NODE_ENV is
# either, and under deployment.mode = "multi". To rotate, write the ring in a
# deployment-owned layer -- add the new key last, then move it first -- and
# keep a retired key until nothing sealed under it is left.
#
# TOTP (F6, D22): on by default, because it needs nothing from the deployment.
# algorithm, digits and period apply to new enrollments -- each factor keeps
# the ones it was enrolled with -- and window to every verification: digits
# 6 to 8, period 15 to 120 seconds, window 0 to 2 steps either side of now.
# The issuer an authenticator app shows defaults to the host of
# oauth.jwt.issuer; MFA_TOTP_ISSUER names it instead.

mfa {
  encryptionKeys = [
    { id = "default", key = ${?MFA_ENCRYPTION_KEY} }
  ]
  factors {
    totp {
      enabled = true
      enabled = ${?MFA_TOTP_ENABLED}
      algorithm = "SHA1"
      digits = 6
      period = 30
      window = 1
      issuer = ${?MFA_TOTP_ISSUER}
    }
  }
}
