# MFA defaults -- @o3co/auth-provider-mfa
#
# The single source of truth for the defaults of the sections this package's
# modules read (ADR 2026-04-30: defaults live in HOCON, never in Zod
# .default()): `mfa`, the MFA module's; `mfa-totp-factor`, the TOTP factor's
# module's; `mfa-recovery-code-factor`, the recovery-code factor's;
# `mfa-email-factor`, the email factor's. A composition root layers this file
# between its own application.conf and core's reference.conf, as the package
# README shows.
#
# The mode (the MFA ADR's D19, the session-admission ADR's D7): whether a
# password login asks for a second factor -- "off", "optional" or "required".
# The MFA module honours "optional" and "required", and refuses "off", its
# default here: installed is on. MFA_MODE sets it.
#
# The step-up page (the MFA ADR's D6): the deployment's page a browser is
# sent to when a request needs a step-up, with `redirect_to` and the
# `acr_values` a step-up can meet. MFA_PAGE_URL sets it. Its old path,
# `endpoints.mfa.url`, is bound nowhere; boot refuses it naming this one
# wherever the MFA module is installed, and its old variable,
# ENDPOINTS_MFA_URL, is declared renamed on the MFA module and captured in
# `renamed-variables` below.
#
# The key ring (the MFA ADR's D11): the first key seals every factor's data
# and every listed key opens it. A key is canonical base64 of 32 bytes
# (`openssl rand -base64 32`). There is no default: MFA_ENCRYPTION_KEY feeds
# the first entry, and without it the MFA settings are refused. The published
# development sample key (MFA_DEVELOPMENT_SAMPLE_KEY) is refused where the
# configuration was selected as production or staging, where NODE_ENV is
# either, and under core.deployment.mode = "multi".
#
# An entry written without an id is named by its key's fingerprint, so
# changing MFA_ENCRYPTION_KEY in place leaves what the old key sealed
# "key_unavailable", naming that fingerprint, until the old key is put back.
# An entry written with an id keeps that id: never change its key in place.
# To rotate, write the ring in a deployment-owned layer -- add the new key
# last as an entry of its own (a new id, or none), then move it first -- and
# keep the old key until nothing sealed under it, and no digest naming it, is
# left.
#
# A transaction (D8, D21): one second-factor ceremony lives
# transactionTtlSeconds -- 60 to 1800 seconds; every expiry is derived from it
# alone -- and allows maxAttemptsPerTransaction attempts, 1 to 10. The lock (D21) holds guessable proofs for a subject: from the
# threshold-th consecutive failure a backoff of baseSeconds, doubling to
# maxSeconds and forgotten memorySeconds after the last lock ends; at most
# weeklyBudget failures in any rolling seven days, whatever succeeds between
# them; and hardLimit consecutive failures -- at most 100, NIST SP 800-63B-4's
# cap, and never below threshold -- hold them until an exempt success, a
# password change or an operator reset.
#
# TOTP (F6, D22), the `mfa-totp-factor` section: on by default, because it
# needs nothing from the deployment. algorithm, digits and period apply to new
# enrollments -- each factor keeps the ones it was enrolled with -- and window
# to every verification: digits 6 to 8, period 15 to 120 seconds, window 0 to
# 2 steps either side of now. The issuer an authenticator app shows defaults
# to the host of oauth.jwt.issuer. Each key has its variable,
# MFA_TOTP_FACTOR_<KEY>.
#
# The MFA routes' budget (D21): every /session/mfa POST is limited per client
# address under the prefix `mfa` (`mfa:ip:<ip>`), mfa.rateLimit.routes
# requests per window. The MFA module contributes it for every limiter to
# read; a limiter's own `limits.mfa` wins. A budget no limiter can apply
# refuses the boot, naming the key.
#
# Recent MFA (F4, D16): mfa.manage.maxAgeSeconds, 60 to 3600 seconds, is how
# long a second factor verified in a session stays recent -- what an action
# that adds a way into the account asks of the session: linking an identity,
# registering a passkey, enrolling a factor outside a login, removing one or
# regenerating recovery codes.
#
# Recovery codes (D22, D25), the `mfa-recovery-code-factor` section: on, with
# `count` codes to a set (1 to 20). Declared before the codes are built. Each
# key has its variable, MFA_RECOVERY_CODE_FACTOR_<KEY>.
#
# The email factor (F5, D14), the `mfa-email-factor` section: off, adding no
# `mfa`, a code living codeTtlSeconds (60 to 1800). Declared before the factor
# is built: its module refuses the boot while `enabled` is true. The mail's
# text, its sending and any limit on sending are the mail sender's. Each key
# has its variable, MFA_EMAIL_FACTOR_<KEY>.
#
# `mfa.factors.totp` is the TOTP factor's old path, which boot refuses naming
# `mfa-totp-factor` wherever the factor's module is installed. Nothing is
# bound there. Its variables, MFA_TOTP_ENABLED and MFA_TOTP_ISSUER, are
# declared renamed on the factor's module (MFA_TOTP_FACTOR_ENABLED,
# MFA_TOTP_FACTOR_ISSUER), and `renamed-variables` below captures them too.
#
# `renamed-variables` captures each renamed variable's old and new name as
# this file is resolved: boot refuses an old name set unless the new one is
# set to the same value.

mfa {
  mode = "off"
  mode = ${?MFA_MODE}
  page {
    url = "/mfa"
    url = ${?MFA_PAGE_URL}
  }
  encryptionKeys = [
    { key = ${?MFA_ENCRYPTION_KEY} }
  ]
  transactionTtlSeconds = 600
  maxAttemptsPerTransaction = 5
  lockout {
    threshold = 5
    baseSeconds = 900
    maxSeconds = 86400
    memorySeconds = 86400
    weeklyBudget = 10
    hardLimit = 100
  }
  rateLimit {
    routes { limit = 60, windowSeconds = 300 }
  }
  manage {
    maxAgeSeconds = 300
  }
}

mfa-totp-factor {
  enabled = true
  enabled = ${?MFA_TOTP_FACTOR_ENABLED}
  algorithm = "SHA1"
  algorithm = ${?MFA_TOTP_FACTOR_ALGORITHM}
  digits = 6
  digits = ${?MFA_TOTP_FACTOR_DIGITS}
  period = 30
  period = ${?MFA_TOTP_FACTOR_PERIOD}
  window = 1
  window = ${?MFA_TOTP_FACTOR_WINDOW}
  issuer = ${?MFA_TOTP_FACTOR_ISSUER}
}

mfa-recovery-code-factor {
  enabled = true
  enabled = ${?MFA_RECOVERY_CODE_FACTOR_ENABLED}
  count = 10
  count = ${?MFA_RECOVERY_CODE_FACTOR_COUNT}
}

mfa-email-factor {
  enabled = false
  enabled = ${?MFA_EMAIL_FACTOR_ENABLED}
  addsMfa = false
  addsMfa = ${?MFA_EMAIL_FACTOR_ADDS_MFA}
  codeTtlSeconds = 600
  codeTtlSeconds = ${?MFA_EMAIL_FACTOR_CODE_TTL_SECONDS}
}

renamed-variables {
  ENDPOINTS_MFA_URL = null
  ENDPOINTS_MFA_URL = ${?ENDPOINTS_MFA_URL}
  MFA_PAGE_URL = null
  MFA_PAGE_URL = ${?MFA_PAGE_URL}
  MFA_TOTP_ENABLED = null
  MFA_TOTP_ENABLED = ${?MFA_TOTP_ENABLED}
  MFA_TOTP_FACTOR_ENABLED = null
  MFA_TOTP_FACTOR_ENABLED = ${?MFA_TOTP_FACTOR_ENABLED}
  MFA_TOTP_ISSUER = null
  MFA_TOTP_ISSUER = ${?MFA_TOTP_ISSUER}
  MFA_TOTP_FACTOR_ISSUER = null
  MFA_TOTP_FACTOR_ISSUER = ${?MFA_TOTP_FACTOR_ISSUER}
}
