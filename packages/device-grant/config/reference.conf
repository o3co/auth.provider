# packages/device-grant/config/reference.conf
# Default configuration for @o3co/auth-provider-device-grant: the device-grant
# module's own section, `device-grant`, for the RFC 8628 OAuth 2.0 Device
# Authorization Grant. A composition root layers it because the module
# declares it.
#
# These are the section's only defaults: the module's schema fills none, so a
# composition root that builds its configuration by hand layers this file, or
# writes every key of a section it sets.
#
# `oauth.deviceAuthorization` is the section's old path, which boot refuses
# naming `device-grant` wherever the module is installed. No variable binds a
# key of the section.

device-grant {
  # Set to true to enable the device authorization grant.
  # Default: false — secure-default-opt-in. Installing the package must not
  # turn on a grant; the operator says so. Absent, the module reads it as
  # false, and registers nothing.
  #
  # Enabled, it requires the `oauthTokenSettings` component: the issuer, the
  # access-token lifetime and `oauth.requireEmailVerified`, which the oauth
  # module provides; a composition without the oauth module fills it in
  # `bootstrapComponents`. Boot fails if nothing fills it.
  enabled = false

  # REQUIRED when enabled. The page where the end user types the code — the
  # device displays this string verbatim, so it must be reachable by the
  # people looking at the device.
  #
  # There is no default because the page belongs to this deployment. The
  # library ships the JSON API the page calls
  # (POST /oauth/device/verification), not the page: the same boundary
  # /authorize draws when it redirects to a configured login URL rather than
  # rendering a login form.
  #
  # verificationUri = "https://example.com/device"

  # Also return `verification_uri_complete`, which embeds the user code so a
  # QR code can carry it (RFC 8628 §3.3.1).
  #
  # Off by default. §5.4: with it "it is particularly important to confirm
  # that the device is in the user's possession, as the user no longer has to
  # type in the code". The typing IS the proximity check; removing it without
  # replacing it is what makes a phishing link work. Turn this on only if the
  # verification page shows the code and asks the user to confirm the device
  # is displaying the same one.
  verificationUriComplete = false

  # Lifetime of the device_code / user_code pair, in seconds.
  # §5.4 wants this "long enough ... to be useable, but sufficiently short to
  # limit the usability of a code obtained for phishing".
  codeLifetimeSeconds = 600

  # Advertised to the device as `interval`, and enforced: a device that polls
  # faster gets `slow_down`, and the interval it is measured against grows by
  # 5 seconds each time (§3.5).
  pollingIntervalSeconds = 5

  # The verification endpoint's own attempt limit per authenticated subject,
  # `windowSeconds` at most a day. RFC 8628 §5.1 sizes the user code's ~34.5
  # bits AGAINST this: the RFC's own example reaches a 2^-32 attack
  # probability only where "the rate-limiting interval and validity period
  # would need to only allow 5 attempts". Every attempt counts -- lookups and
  # malformed codes included -- keyed on the user rather than the code
  # (`device_verification:user:<subject>`), so an attacker burns their own.
  #
  # Counted on the `attemptCounter` component, so across replicas it is one
  # count; no rate limiter's `limits` or `failMode` changes it, and a counter
  # that cannot answer refuses the attempt (503). Without a counter it is
  # counted per process, which `core.deployment.mode = "multi"` refuses.
  rateLimit {
    limit = 5
    windowSeconds = 300
  }

  # There is no CSRF setting here on purpose. POST /oauth/device/verification
  # accepts JSON only and runs behind the same guard as POST /session/login:
  # a foreign Origin/Referer is refused, the provider's own origin or one in
  # `session.csrf.trustedOrigins` is accepted, and a request with no origin
  # signal must carry the double-submit token from GET /session/csrf. A
  # verification page served from another origin is declared on that list --
  # one trust policy for the product, not a second one. Enabling the grant
  # without a `session` config slice fails boot.

  # Declared absence for the `deviceCodeStore` component. Only
  # "unsupported" is accepted. With the grant off the module registers
  # nothing and needs neither a store nor this declaration; with
  # `enabled = true` it refuses to boot until a store is wired
  # (memoryDeviceCodeStoreModule on a single replica, redisDeviceCodeStoreModule
  # otherwise), whatever this key says.
  #
  # store = "unsupported"
}

# ---------------------------------------------------------------------------
# The attempt limit is not a rate limiter's
# ---------------------------------------------------------------------------
#
# `device-grant.rateLimit` above is counted by core's attempt guard, on the
# `attemptCounter` component (redisAttemptCounterModule across replicas). A
# rate limiter never decides it, and the bundled limiters refuse a
# `limits.device_verification` entry.
#
# POST /oauth/device_authorization is the deployment's abuse control. With a
# `rateLimiter` component it is throttled ahead of client authentication,
# under `device_authorization:ip:<ip>` -- the same guard and the same key
# shape as /oauth/token -- on the adapter's `defaultLimit` unless a spec is
# declared for the prefix, and on the limiter's own `failMode` when its
# backend is down:
#
# core-rate-limiter-memory.limits.device_authorization { limit = 60, windowSeconds = 60 }
#
# Without one, requests pass through, and `core.declaredAbsent` must list
# "rateLimiter". A rate limiter is also what keeps a single caller from
# reaching the in-memory DeviceCodeStore's cap of 10000 resident records.
