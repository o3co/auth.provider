# packages/device-grant/src/reference.conf
# Default configuration for @o3co/auth-provider-device-grant.
# Concatenated into the application config via the HOCON withFallback chain.
#
# RFC 8628 OAuth 2.0 Device Authorization Grant (issue #298).

oauth.deviceAuthorization {
  # Set to true to enable the device authorization grant.
  # Default: false — secure-default-opt-in. Installing the package must not
  # turn on a grant; the operator says so.
  enabled = false

  # REQUIRED when enabled. The page where the end user types the code — the
  # device displays this string verbatim, so it must be reachable by the
  # people looking at the device.
  #
  # There is no default because the page belongs to this deployment. The
  # library ships the JSON API the page calls
  # (POST /oauth/device/verification), not the page: the same boundary
  # /authorize draws when it redirects to a configured login URL rather than
  # rendering a login form.
  #
  # verification-uri = "https://example.com/device"

  # Also return `verification_uri_complete`, which embeds the user code so a
  # QR code can carry it (RFC 8628 §3.3.1).
  #
  # Off by default. §5.4: with it "it is particularly important to confirm
  # that the device is in the user's possession, as the user no longer has to
  # type in the code". The typing IS the proximity check; removing it without
  # replacing it is what makes a phishing link work. Turn this on only if the
  # verification page shows the code and asks the user to confirm the device
  # is displaying the same one.
  verification-uri-complete = false

  # Lifetime of the device_code / user_code pair, in seconds.
  # §5.4 wants this "long enough ... to be useable, but sufficiently short to
  # limit the usability of a code obtained for phishing".
  code-lifetime-seconds = 600

  # Advertised to the device as `interval`, and enforced: a device that polls
  # faster gets `slow_down`, and the interval it is measured against grows by
  # 5 seconds each time (§3.5).
  polling-interval-seconds = 5

  # The verification endpoint's budget per authenticated subject, applied
  # under the rate-limiter key prefix `device_verification`. RFC 8628 §5.1
  # sizes the user code's ~34.5 bits AGAINST this: the RFC's own example
  # reaches a 2^-32 attack probability only where "the rate-limiting interval
  # and validity period would need to only allow 5 attempts". Every attempt
  # counts -- lookups and malformed codes included -- keyed on the user rather
  # than the code, so an attacker burns their own budget.
  #
  # Both bundled limiter adapters seed their `limits.device_verification` from
  # these values (the same way `login` is seeded from `rateLimit.login`), so
  # this block is the single source of truth. Declaring
  # `memoryRateLimiter.limits.device_verification` / `redisRateLimiter.limits.device_verification`
  # on the adapter overrides it -- an explicit statement about that adapter
  # wins -- but restating the numbers there is two values that must agree.
  rateLimit {
    limit = 5
    windowSeconds = 300
  }

  # There is no CSRF setting here on purpose. POST /oauth/device/verification
  # accepts JSON only and runs behind the same guard as POST /session/login:
  # a foreign Origin/Referer is refused, the provider's own origin or one in
  # `session.csrf.trustedOrigins` is accepted, and a request with no origin
  # signal must carry the double-submit token from GET /session/csrf. A
  # verification page served from another origin is declared on that list --
  # one trust policy for the product, not a second one. Enabling the grant
  # without a `session` config slice fails boot.

  # Declared absence for the `deviceCodeStore` component (#363). Only
  # "unsupported" is accepted — it states that this deployment knowingly
  # mounts the module without a store, which means no device can ever be
  # authorized. Leaving both this and the component unset fails boot.
  #
  # store = "unsupported"
}

# ---------------------------------------------------------------------------
# Rate limiting is not optional here
# ---------------------------------------------------------------------------
#
# Enabling this grant requires a `rateLimiter` component. RFC 8628 §5.1 sizes
# the user code's entropy AGAINST a rate limit: 8 base-20 characters is about
# 34.5 bits, which the RFC calls sufficient only where "the rate-limiting
# interval and validity period would need to only allow 5 attempts". Without a
# limiter that argument does not hold, so boot fails rather than serving a code
# that looks strong and is not.
#
# The verification endpoint counts every attempt — lookups included, since a
# lookup answers "is this a real code?" just as an approval does — under the
# key `device_verification:user:<subject>`, keyed on the authenticated user
# rather than the code so an attacker burns their own budget rather than the
# budget of whichever code they happened to hit. The budget itself is
# `oauth.deviceAuthorization.rateLimit` above.
#
# POST /oauth/device_authorization is throttled too, ahead of client
# authentication, under `device_authorization:ip:<ip>` -- the same guard and
# the same key shape as /oauth/token. It falls back to the adapter's
# `defaultLimit` unless a spec is declared for the prefix:
#
# memoryRateLimiter.limits.device_authorization { limit = 60, windowSeconds = 60 }
#
# A rate limiter is also what bounds the in-memory DeviceCodeStore: the store
# caps itself at 10000 resident records and reclaims expired ones as it goes,
# but the limiter is what keeps a single caller from reaching that cap.
