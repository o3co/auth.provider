services:
  app:
    build:
      context: .
      target: develop
    ports:
      - "3000:3000"
    volumes:
      - ./src:/home/node/src
      - ./config:/home/node/config
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # The same coherence the production file states, for the same reason,
      # and it matters MORE here. `config/application.conf` already puts
      # express-session, the authorization codes and the access-token denylist
      # on the Redis this compose runs; only the UserSession stores were left
      # on their `memory` default. That combination survives a restart on one
      # side and not the other, so every browser comes back holding an
      # express-session that still says `isAuthenticated` with no `UserSession`
      # behind it and /authorize loops.
      #
      # A dev container restarts on every save (`target: develop` is hot
      # reload), so the developer meets that loop constantly — and meets it
      # while changing something else, which is the worst possible time to
      # debug it. Redis is already running and already required by three other
      # stores, so this costs nothing: the shared ioredis socket is open
      # either way.
      USER_SESSION_STORES_ADAPTER: redis

  redis:
    # Tag-pinned, not digest-pinned. The Dockerfile argues for digests (#289)
    # and that argument holds here too — a tag is mutable, so two `up`s a month
    # apart can run different Redis builds. Pin the digest for a production
    # deployment you need to reproduce:
    #   image: redis:7.2-alpine@sha256:<digest>
    # Left as a tag in the template because a digest goes stale the week it is
    # written and a scaffold that ships a stale one teaches nothing (#407).
    image: redis:7.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
