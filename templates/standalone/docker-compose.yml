services:
  app:
    build:
      context: .
      target: develop
    ports:
      - "3000:3000"
    volumes:
      - ./src:/home/node/src
      - ./config:/home/node/config
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
