http {
  port = 3000
  port = ${?HTTP_PORT}
  trustProxy = false
  trustProxy = ${?HTTP_TRUST_PROXY}
}

oauth {
  jwt {
    issuer = ${?OAUTH_JWT_ISSUER}
    signingKey {
      provider = "local"
      provider = ${?OAUTH_JWT_SIGNING_KEY_PROVIDER}
      local {
        algorithm = "HS256"
        algorithm = ${?OAUTH_JWT_ALGORITHM}
        kid = "v0"
        kid = ${?OAUTH_JWT_KID}
        secret = ${?OAUTH_JWT_SECRET}
        privateKey = ${?OAUTH_JWT_PRIVATE_KEY}
        privateKeyPath = ${?OAUTH_JWT_PRIVATE_KEY_PATH}
        publicKey = ${?OAUTH_JWT_PUBLIC_KEY}
        publicKeyPath = ${?OAUTH_JWT_PUBLIC_KEY_PATH}
        previousKeys = []
      }
    }
  }
  accessToken {
    expiresIn = 3600
    expiresIn = ${?OAUTH_ACCESS_TOKEN_EXPIRES_IN}
  }
  refreshToken {
    expiresIn = 86400
    expiresIn = ${?OAUTH_REFRESH_TOKEN_EXPIRES_IN}
  }
  grants {
    session { enabled = true, enabled = ${?OAUTH_GRANTS_SESSION_ENABLED} }
    authorization_code {
      enabled = true
      enabled = ${?OAUTH_GRANTS_AUTHORIZATION_CODE_ENABLED}
      pkce {
        requireS256 = false
        requireS256 = ${?OAUTH_GRANTS_AUTHORIZATION_CODE_PKCE_REQUIRE_S256}
      }
    }
    refresh_token { enabled = true, enabled = ${?OAUTH_GRANTS_REFRESH_TOKEN_ENABLED} }
  }
  # OR-9: adapter switch for the OAuth authorization-code repository. When
  # set to "redis", the standalone composition root wires
  # `redisCodeRepositoryModule` against the shared ioredis socket
  # (`standaloneRedisClientsModule`). Memory-only deployments lose codes on
  # restart and across replicas — multi-replica production MUST use "redis".
  # Supersedes the legacy `repositories.code.type` switch (kept below for
  # one release cycle for backward compat).
  code {
    adapter = "redis"
    adapter = ${?OAUTH_CODE_ADAPTER}
  }
}

session {
  secret = ${?SESSION_SECRET}
  maxAge = 3600000
  maxAge = ${?SESSION_MAX_AGE}
  secure = true
  secure = ${?SESSION_SECURE}
  sameSite = "lax"
  sameSite = ${?SESSION_SAME_SITE}
  domain = null
  domain = ${?SESSION_DOMAIN}
  storage {
    type = "redis"
    type = ${?SESSION_STORAGE_TYPE}
    redis {
      url = "redis://localhost:6379"
      url = ${?SESSION_STORAGE_REDIS_URL}
      password = ${?SESSION_STORAGE_REDIS_PASSWORD}
    }
  }
}

# Rate limiting for SESSION routes (e.g. /session/login bruteforce protection).
# Uses windowMs (milliseconds) — consumed by express-rate-limit in Session.mts.
# NOTE (IH-18): this section does NOT govern OAuth endpoint rate limiting.
#       For OAuth rate limiting (/token, /authorize), use the `rateLimiter`
#       component (memoryRateLimiterModule or redisRateLimiterModule) with
#       its own `memoryRateLimiter.*` / `redisRateLimiter.*` config section
#       (uses `windowSeconds` instead of `windowMs`). Switch via
#       `rateLimiter.adapter = "memory" | "redis"` (see below).
rateLimit {
  login { windowMs = 900000, limit = 20 }
  # OR-5: fail-mode for the OAuth-endpoint rate limiter when the limiter
  # backend errors. "open" = allow + `logger.error`. "closed" = HTTP 503
  # + `logger.error` (recommended for security-sensitive deployments).
  failMode = "open"
  failMode = ${?RATE_LIMIT_FAIL_MODE}
}

federations {
  google {
    enabled = false
    enabled = ${?FEDERATIONS_GOOGLE_ENABLED}
    clientId = ${?FEDERATIONS_GOOGLE_CLIENT_ID}
    clientSecret = ${?FEDERATIONS_GOOGLE_CLIENT_SECRET}
    callbackURL = "http://localhost:3000/session/oauth/federation/google/callback"
    callbackURL = ${?FEDERATIONS_GOOGLE_CALLBACK_URL}
  }
}

repositories {
  client {
    type = "yaml"
    type = ${?CLIENT_TYPE}
    yaml {
      path = "./config/clients.yaml"
      path = ${?CLIENT_PATH}
    }
  }
  user {
    type = "http"
    type = ${?CLIENT_USER_TYPE}
    yaml {
      path = "./config/users.yaml"
    }
    http {
      authenticateUrl = ${?CLIENT_USER_AUTHENTICATE_URL}
      authenticateByTokenUrl = ${?CLIENT_USER_AUTHENTICATE_BY_TOKEN_URL}
      timeout = 5000
      timeout = ${?CLIENT_USER_TIMEOUT}
    }
  }
  code {
    type = "redis"
    type = ${?CLIENT_CODE_TYPE}
    memory {
      defaultExpiresIn = 600
      defaultExpiresIn = ${?CLIENT_CODE_DEFAULT_EXPIRES_IN}
    }
    redis {
      defaultExpiresIn = 600
      defaultExpiresIn = ${?CLIENT_CODE_DEFAULT_EXPIRES_IN}
      endpointUri = ${?CLIENT_CODE_ENDPOINT_URI}
      password = ${?CLIENT_CODE_PASSWORD}
    }
  }
}

endpoints {
  login {
    url = "/login"
    url = ${?ENDPOINTS_LOGIN_URL}
  }
  # IH-10: `client { url }` and `authCallback { url }` removed — no
  # production consumer reads them.
}

cors {
  allowedOrigins = []
}

# Wave 5d (IH-14 + OR-M1 + OR-4): adapter switches for the OAuth-endpoint
# rate limiter and the user-session stores (4-store split: userSessionStore
# / sessionRPRegistry / sessionFamilyIndex / sessionFederationIndex).
#
# Multi-replica production MUST set BOTH to `"redis"`. The defaults are
# `"memory"` for backward-compat with single-instance deployments and CI;
# in-memory rate-limit counters / session state are isolated per replica
# and inconsistent under load-balanced traffic.
#
# When `userSessionStores.adapter = "redis"` or `rateLimiter.adapter = "redis"`,
# the standalone composition root opens a single shared ioredis connection
# (via `standaloneRedisClientsModule`) consuming `refreshTokenFamilyStore.redis.url`
# (D-2 v2). One ioredis socket per replica backs ALL Redis-typed clients.
rateLimiter {
  adapter = "memory"
  adapter = ${?RATE_LIMITER_ADAPTER}
}

userSessionStores {
  adapter = "memory"
  adapter = ${?USER_SESSION_STORES_ADAPTER}
}

# D-2 v2 + Wave 5d: ioredis connection-config consumed by the shared
# `standaloneRedisClientsModule` in `templates/standalone/src/modules.mts`.
# One ioredis socket per replica backs ALL Redis-typed clients (RT family
# + 4 user-session stores + rate limiter). Multi-replica deployments MUST
# point this at a shared Redis 7.2+ instance — without it, each replica
# stores RT families in its own ioredis connection against a local-only
# Redis, defeating the cross-replica persistence purpose. Module-internal
# config (keyPrefix / casRetryLimit) lives separately under
# `redisRefreshTokenFamilyStore.*` (consumed by the store module's schema).
redisRefreshTokenFamilyStore {
  keyPrefix = "rtfam:"
  keyPrefix = ${?REFRESH_TOKEN_FAMILY_STORE_KEY_PREFIX}
  casRetryLimit = 3
  casRetryLimit = ${?REFRESH_TOKEN_FAMILY_STORE_CAS_RETRY_LIMIT}
}

# OR-9 (Wave 5d): module-internal config for `redisCodeRepositoryModule`.
# Consumed when `oauth.code.adapter = "redis"`. The shared ioredis socket
# (`standaloneRedisClientsModule`) provides the `codeRepositoryClient`
# slot; this section governs only key namespacing and the default
# expiry-in-seconds the repository uses when /authorize doesn't supply one.
#
# Multi-tenant deployments override `keyPrefix` to isolate tenants in the
# same Redis instance — e.g. `keyPrefix = "tenant-a:code:"` keeps tenant A's
# codes from colliding with tenant B's under the default `oauth:code:`
# prefix (MIN-3 advisory).
redisCodeRepository {
  # keyPrefix = "oauth:code:"
  # keyPrefix = ${?CLIENT_CODE_KEY_PREFIX}
  defaultExpiresIn = 600
  defaultExpiresIn = ${?CLIENT_CODE_DEFAULT_EXPIRES_IN}
}

refreshTokenFamilyStore {
  redis {
    url = "redis://localhost:6379"
    url = ${?REFRESH_TOKEN_FAMILY_STORE_REDIS_URL}
    password = ${?REFRESH_TOKEN_FAMILY_STORE_REDIS_PASSWORD}
  }
}
