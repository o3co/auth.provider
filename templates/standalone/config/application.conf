# Application-level overrides for the standalone template.
#
# Defaults come from config/reference.conf (the template's own modules) and
# from the reference.conf of each package its modules come from, core's last.
# Values omitted here inherit from them; add overrides only for keys this
# deployment intentionally diverges on. Write a value for a key the last
# block of this file binds above that block: one written below it wins over
# the variable.

# #287: where the audit trail goes. Before this block the template wired no
# sink at all, so every security event the routes emit -- token.issued.failure,
# authorize.rejected / authorize.granted, logout.cascade_failed, and the shared
# rate-limit guard's rate_limit.unavailable -- was discarded by the artifact
# operators deploy. Nothing failed and nothing warned: `emitAuditEvent` is a
# no-op when the slot is empty.
#
# "logger" rather than reference.conf's "console": both write newline-delimited
# JSON to stdout, but "logger" writes it through the same pino stream that
# carries every other line this template emits, so a log aggregator ingests
# application logs and audit events with one parser and separates them on
# `name` ("provider" vs "audit"). "console" writes the bare event with no log
# envelope -- no level, no time -- which most pipelines then timestamp by
# ingestion. Set AUDIT_SINK_TYPE=console if that is what your pipeline wants.
#
# The audit stream's level is FIXED at info and `logging.level` does not gate
# it. LOG_LEVEL=warn is an ordinary production setting and LOG_LEVEL=silent a
# legitimate one; either silencing the audit trail would be #287 again, reached
# from the operator's side. Where events go is chosen here, and this selector
# has no "none" -- an unknown type fails boot naming the sinks that exist,
# rather than producing a deployment with no audit trail (#304).
#
# To point this at a real sink (SIEM, log pipeline, message bus): register the
# builder in `auditSinkModule` (src/modules.mts), name it here, and put its
# options in this block -- `sink { type = "splunk-hec", splunk-hec { ... } }`.
audit {
  sink {
    type = "logger"
    type = ${?AUDIT_SINK_TYPE}
  }
}

# The grant switches, each in the section of the module that installs the
# grant. The template is a typical web-app OP, so it turns on the universal
# user-auth path: the session grant (oauth-session) and the authorization-code
# and refresh-token grants (oauth-authorization). client_credentials and the
# jwt-bearer grant stay off; deployments that need M2M flows set
# OAUTH_AUTHORIZATION_GRANTS_CLIENT_CREDENTIALS_ENABLED=true or write
# `oauth-authorization.grants.clientCredentials.enabled = true` in their own
# layer.
#
# The template reads these switches before it chooses its modules, from its
# own files, so this file writes every switch and binds its variable: one set
# only in the package's reference.conf would read as unset there, and a
# variable bound only there would install no grant. The env-override line is
# repeated after each value because a layer's own value wins over a variable
# bound below it.
#
# PKCE is mandatory for every authorization-code client and `S256` is the only
# method the provider accepts -- fixed policy (OAuth 2.1 §4.1.1 / RFC 9700
# §2.1.1), not a deployment setting. A legacy client that genuinely cannot
# compute SHA-256 is opted into `plain` one client at a time, with
# `allowPlainPkce: true` in clients.yaml.
oauth-session {
  enabled = true
  enabled = ${?OAUTH_SESSION_ENABLED}
}

oauth-authorization.grants {
  authorizationCode {
    enabled = true
    enabled = ${?OAUTH_AUTHORIZATION_GRANTS_AUTHORIZATION_CODE_ENABLED}
  }
  refreshToken {
    enabled = true
    enabled = ${?OAUTH_AUTHORIZATION_GRANTS_REFRESH_TOKEN_ENABLED}
  }
  clientCredentials {
    enabled = false
    enabled = ${?OAUTH_AUTHORIZATION_GRANTS_CLIENT_CREDENTIALS_ENABLED}
  }
  jwtBearer {
    enabled = false
    enabled = ${?OAUTH_AUTHORIZATION_GRANTS_JWT_BEARER_ENABLED}
  }
}

oauth {
  # OR-9: adapter switch for the OAuth authorization-code repository. When
  # set to "redis", the standalone composition root wires
  # `redisCodeRepositoryModule` against the shared ioredis socket
  # (`standaloneRedisClientsModule`). Memory-only deployments lose codes on
  # restart and across replicas — multi-replica production MUST use "redis".
  # Supersedes the legacy `repositories.code.type` switch (kept below as
  # deprecated for backward compat — see CHANGELOG for the removal version).
  # #481: the Authentication Context Class References this deployment can
  # vouch for, each mapped to the RFC 8176 `amr` values a session must carry
  # (`pwd` for a password login, `fed` for a federated login) — or to a list
  # of such lists, any one of which satisfies it. `/authorize` answers
  # `acr_values` from this table alone — anything else is
  # `unmet_authentication_requirements` — and discovery advertises the keys.
  #
  #   authorize.acrValues {
  #     "urn:example:pwd" = ["pwd"]
  #   }
  #
  # An entry nothing this deployment installs can satisfy is dropped at boot:
  # not advertised, answered `unmet_authentication_requirements`, and logged
  # once as `acr_value_unsatisfiable`. One that needs `fed` needs a
  # federation installed; one that needs `mfa`, `hwk` or `swk` waits for
  # multi-factor authentication, unless a federation is installed: the
  # upstream IdP's `amr` counts.
  #
  # #267: /authorize refuses any client not marked `firstParty: true` in
  # clients.yaml — the template's example clients are marked. There is no
  # opt-out: the one-time `allowUnmarkedClients` migration flag was removed
  # (#330), and a config or environment still setting it fails at boot with
  # migration instructions (via the tombstone in core's reference.conf).
  code {
    adapter = "redis"
    adapter = ${?OAUTH_CODE_ADAPTER}
  }
  # #277: POST /oauth/revoke revokes access tokens by writing their `jti` to the
  # denylist wired below, and boot FAILS if that denylist is missing — an
  # RFC 7009 endpoint must answer 200, so an unwired denylist would tell every
  # operator their token is revoked while it kept working until expiry.
  #
  # Deployments that genuinely do not revoke access tokens (short-lived tokens
  # plus refresh-token revocation only) set "unsupported" instead, and the
  # endpoint then answers `unsupported_token_type` for
  # `token_type_hint = access_token`. Refresh-token revocation works in both
  # modes and needs no denylist.
  revocation {
    accessToken = "denylist"
    accessToken = ${?OAUTH_REVOCATION_ACCESS_TOKEN}
  }
}

# The session requirements this deployment expects, in core's own section:
# the extensions that change what "logged in" means, each registered by a
# module (the MFA package's is named `mfa`). Boot compares the list with what
# the installed modules register: a name here that nothing registers refuses
# the boot (`session-requirement-missing`), and so does a registered
# requirement the list leaves out (`session-requirements-undeclared`). The
# template installs none; a deployment that adds such a module adds its name
# here. When `mfa.mode` (MFA_MODE, below) is not "off", the template adds
# `mfa` to this list: it installs no MFA module, so such a mode refuses the
# boot rather than let logins through on a password alone. No environment
# variable sets the list.
core.sessionRequirements.expected = []

# Whether a password login asks for a second factor -- "off" (unset),
# "optional" or "required" -- the MFA module's key, whose default is its
# package's. The template reads it itself before it chooses its modules and
# declares `mfa` above from it; it hands the section to no module, since it
# installs none that reads it. Bound here because no file the template reads
# before it chooses its modules binds MFA_MODE. The template installs the MFA
# module at the MFA ADR's build-order step 20, which removes this line and
# the template's reading of the mode.
mfa.mode = ${?MFA_MODE}

# #277: backend for the access-token denylist.
#
# "redis" by default, not "memory": the memory adapter keeps revocations in one
# process, so a token revoked on one replica stays valid on every other — and
# `core.deployment.mode = "multi"` refuses it by name for exactly that reason. It
# shares the ioredis socket configured under `refreshTokenFamilyStore.redis`
# (config/reference.conf), so switching it on costs no extra connection.
#
# Single-instance local development can set ACCESS_TOKEN_DENYLIST_ADAPTER=memory
# to run without Redis.
accessTokenDenylist {
  adapter = "redis"
  adapter = ${?ACCESS_TOKEN_DENYLIST_ADAPTER}
}

# #484: backend for the replay seen-set — the `jti` single-use record behind
# `private_key_jwt` client authentication (a client registered with `jwks` or
# `jwksUri` in config/clients.yaml). Same reasoning as the denylist above:
# "memory" forks per replica, so a captured client assertion would replay
# once per replica, and `core.deployment.mode = "multi"` refuses it by name. It
# shares the ioredis socket, so it costs no extra connection.
#
# Single-instance local development can set REPLAY_SEEN_SET_ADAPTER=memory.
replaySeenSet {
  adapter = "redis"
  adapter = ${?REPLAY_SEEN_SET_ADAPTER}
}

# #593: federation grants — a user's standing consent that a backend or an
# agent may obtain upstream IdP tokens with no session behind the call. Off by
# default; FEDERATION_GRANTS_ENABLED=true installs the routes, the two stores
# below and the subject-revocation service. Enabling it is a statement that
# the deployment has a consent page (FEDERATION_GRANTS_CONSENT_URL, no default),
# a `callbackURL` on every connection, and a user repository that covers each
# connection's registration (or FEDERATION_GRANTS_IDENTITY_LOOKUP=unsupported,
# the recorded decision not to make that check) — each refused at boot when
# missing. Connections and the Redis grant store's key ring have no
# environment form; write them in a deployment-owned HOCON layer (README:
# Federation Grants). The template reads `federation-grants.enabled` before it
# chooses its modules, from its own files, which is why this file binds
# FEDERATION_GRANTS_ENABLED too.
federation-grants {
  enabled = false
  enabled = ${?FEDERATION_GRANTS_ENABLED}
  identityLookup = "required"
  identityLookup = ${?FEDERATION_GRANTS_IDENTITY_LOOKUP}
  consent {
    url = ${?FEDERATION_GRANTS_CONSENT_URL}
  }
}

# The Redis grant store seals every credential; "required" needs its key ring,
# `redis-federation-grant-store.encryptionKeys`.
redis-federation-grant-store {
  encryptionMode = "required"
  encryptionMode = ${?REDIS_FEDERATION_GRANT_STORE_ENCRYPTION_MODE}
}

# "redis" for both, as for the denylist above: a grant is an offline credential
# that must outlive a restart, and every store this file already selects shares
# the same socket. Redis grants need the subject boundary in Redis too
# (USER_SESSION_STORES_ADAPTER=redis, which both compose files set) — boot
# refuses the pairing with a memory boundary, because the grants would outlive
# what ends them. Single-instance local work can set both to "memory".
federationGrantStore {
  adapter = "redis"
  adapter = ${?FEDERATION_GRANT_STORE_ADAPTER}
}

federationGrantIntentStore {
  adapter = "redis"
  adapter = ${?FEDERATION_GRANT_INTENT_STORE_ADAPTER}
}

# #527: where consent to a client that is not first-party is recorded.
# "none" (the default) wires no store and such clients are refused at
# /authorize; "memory" is single-replica only (refused under
# CORE_DEPLOYMENT_MODE=multi by name); "redis" (#561) keeps the consent records and
# the requests parked while the consent page asks on the shared ioredis socket,
# and is what a deployment of more than one replica selects. Its key namespace
# is REDIS_CONSENT_STORE_KEY_PREFIX (default "consent:").
consentStore {
  adapter = "none"
  adapter = ${?CONSENT_STORE_ADAPTER}
}

session {
  secret = ${?SESSION_SECRET}
  # MIN-2: __Host- prefix requires Secure, Path=/, and no Domain attribute.
  # If SESSION_SECURE=false or SESSION_DOMAIN is set, also override
  # SESSION_NAME to a non-__Host- value.
  name = "__Host-auth.session"
  name = ${?SESSION_NAME}
  maxAge = 3600000
  maxAge = ${?SESSION_MAX_AGE}
  secure = true
  secure = ${?SESSION_SECURE}
  sameSite = "lax"
  sameSite = ${?SESSION_SAME_SITE}
  domain = null
  domain = ${?SESSION_DOMAIN}
  # #405: every URL `POST /session/login` may accept as `redirect_to`, matched
  # EXACTLY -- scheme, host, port, path and query all significant. Empty (the
  # default) refuses every `redirect_to`, so leave it alone unless your login
  # page actually posts one.
  #
  #   redirectAllowlist = ["https://app.example.com/welcome"]
  #
  # `http://` is accepted for loopback hosts only. With `domain` set above, an
  # entry outside it fails boot rather than being silently ignored. The
  # federation flow has a separate list per provider (see `federations` below).
  redirectAllowlist = []
  storage {
    type = "redis"
    type = ${?SESSION_STORAGE_TYPE}
    redis {
      url = "redis://localhost:6379"
      url = ${?SESSION_STORAGE_REDIS_URL}
      password = ${?SESSION_STORAGE_REDIS_PASSWORD}
    }
  }
}

# Rate limiting for SESSION routes (e.g. /session/login bruteforce protection).
# Uses windowMs (milliseconds); the session module contributes it as the
# `login` budget.
# This section does NOT govern OAuth endpoint rate limiting. For that, the
# `rateLimiter` component (memoryRateLimiterModule or redisRateLimiterModule)
# reads its own section, `core-rate-limiter-memory` / `redis-rate-limiter`
# (with `windowSeconds` instead of `windowMs`). Switch via
# `rateLimiter.adapter = "memory" | "redis"` (see reference.conf).
rateLimit {
  # `login` is per-deployment tuning (bruteforce-window + limit), kept in
  # this layer so operators can tweak without forking reference.conf.
  login { windowMs = 900000, limit = 20 }
  # The Redis limiter's outage policy is its own key, `redis-rate-limiter.failMode`
  # ("closed" by default; REDIS_RATE_LIMITER_FAIL_MODE sets it).
}

federations {
  # Template ships a Google federation declaration disabled-by-default.
  # Operators enable + populate credentials via env vars.
  google {
    enabled = false
    enabled = ${?FEDERATIONS_GOOGLE_ENABLED}
    clientId = ${?FEDERATIONS_GOOGLE_CLIENT_ID}
    clientSecret = ${?FEDERATIONS_GOOGLE_CLIENT_SECRET}
    callbackURL = "http://localhost:3000/session/oauth/federation/google/callback"
    callbackURL = ${?FEDERATIONS_GOOGLE_CALLBACK_URL}

    # Every URL a `redirect_to` query parameter may name on
    # /session/oauth/federation/google. Matching is EXACT — scheme, host, port,
    # path, query and fragment all count — so list each landing page in full.
    # There is no wildcard and no subdomain matching.
    #
    # An empty list refuses every `redirect_to`, which is the right setting for
    # a deployment that does not use the parameter. It is NOT a way to allow
    # everything: before #278 an unset allowlist accepted any http(s) URL, which
    # made this an open redirect. Nothing falls back to that any more.
    #
    # https is required, except for a loopback host (localhost, 127.0.0.0/8,
    # [::1]) — that carve-out is what lets a local dev front-end and a native
    # client on an ephemeral loopback listener work without a certificate. The
    # port is still part of the match, so list the port the client binds.
    #
    #   redirectAllowlist = [
    #     "https://app.example.com/welcome"
    #     "http://localhost:5173/welcome"
    #   ]
    redirectAllowlist = []

    # Cookie / session domain. When set, every non-loopback redirectAllowlist
    # entry must be inside it, checked at boot — an entry outside it fails
    # startup rather than sitting here looking effective.
    # sessionDomain = ${?FEDERATIONS_GOOGLE_SESSION_DOMAIN}

    # Post-callback bridge page. Required only if `redirect_to` is used at all:
    # the browser lands here as `<authCallbackUrl>?redirect_to=<encoded>`.
    # authCallbackUrl = ${?FEDERATIONS_GOOGLE_AUTH_CALLBACK_URL}

    # Where the browser goes after a callback carrying no `redirect_to`.
    # clientUrl = ${?FEDERATIONS_GOOGLE_CLIENT_URL}

    # RFC 9207: Google always returns `iss` on the callback, so a callback
    # without one is refused. `false` is the way out if Google ever stops
    # sending it. It permits a missing `iss` only — one that is sent and is not
    # Google's is refused either way.
    # requireAuthorizationResponseIss = ${?FEDERATIONS_GOOGLE_REQUIRE_AUTHORIZATION_RESPONSE_ISS}

    # Whether sign-in asks Google for a refresh token. Unset is "offline":
    # every sign-in shows Google's consent screen, because Google issues a
    # refresh token only there, and every session gets one that
    # POST /oauth/federation/google/token can refresh with. "online" shows the
    # consent screen on the first sign-in only and gets no refresh token at
    # all — for a deployment that uses Google to sign in and nothing more.
    accessType = ${?FEDERATIONS_GOOGLE_ACCESS_TYPE}
  }

  # Any OpenID Connect provider (Okta, Entra ID, Auth0, Keycloak, your own
  # tenant) — `@o3co/auth-provider-federation-oidc` (#524). Disabled by
  # default; the env vars below switch this one instance on. The section
  # name is the federation name: the browser starts at
  # /session/oauth/federation/oidc and the identity handed to the Store is
  # "oidc:<sub>". An identity the Store does not know is refused (401);
  # nothing is provisioned. To broker to a second IdP, copy this block under
  # another name (`okta { type = "oidc" ... }`) with its own callbackURL.
  oidc {
    enabled = false
    enabled = ${?FEDERATIONS_OIDC_ENABLED}
    type = "oidc"

    # Issuer identifier, exactly as the IdP writes it into `iss`. Discovery
    # runs at boot from <issuer>/.well-known/openid-configuration and a
    # failure refuses boot. https only (plain http on localhost for dev).
    issuer = ${?FEDERATIONS_OIDC_ISSUER}
    clientId = ${?FEDERATIONS_OIDC_CLIENT_ID}
    # client_secret_basic. For private_key_jwt drop clientSecret and set
    # privateKey (a PEM PKCS#8 key, or { pem, kid, alg }) instead.
    clientSecret = ${?FEDERATIONS_OIDC_CLIENT_SECRET}
    callbackURL = "http://localhost:3000/session/oauth/federation/oidc/callback"
    callbackURL = ${?FEDERATIONS_OIDC_CALLBACK_URL}
    scopes = ["openid", "profile", "email"]

    # Same rules as the Google block above: exact URLs, https except on a
    # loopback host, and an empty list refuses every `redirect_to`.
    redirectAllowlist = []
    # sessionDomain, authCallbackUrl and clientUrl work as for Google.
    #
    # Hand-typed endpoints instead of discovery (the IdP's document is wrong
    # or unreachable from this network):
    #   discovery = false
    #   endpoints { authorizationEndpoint = "...", tokenEndpoint = "...", jwksUri = "..." }
  }
}

repositories {
  client {
    type = "yaml"
    type = ${?CLIENT_TYPE}
    yaml {
      path = "./config/clients.yaml"
      path = ${?CLIENT_PATH}
    }
  }
  user {
    type = "http"
    type = ${?CLIENT_USER_TYPE}
    yaml {
      path = "./config/users.yaml"
    }
    http {
      # Both URLs carry plaintext user credentials, so both must be absolute
      # https URLs. http:// is accepted only for a loopback host (localhost,
      # 127.0.0.0/8, [::1]); a private-range address or a container-network
      # service name still needs https. Boot fails if either is not. Each must
      # also be the endpoint that answers: no request follows a 3xx, so a URL
      # that redirects fails every call.
      authenticateUrl = ${?CLIENT_USER_AUTHENTICATE_URL}
      authenticateByTokenUrl = ${?CLIENT_USER_AUTHENTICATE_BY_TOKEN_URL}
      # #482: optional. When set, a signed-in user can link a second federated
      # identity (GET /session/oauth/federation/<name>?link=1): the Store
      # receives { userId, provider, sub, token, claims } and decides — never on
      # an unverified or relay e-mail. Same https and no-redirect rule as the two URLs above.
      # Also declared in core's reference.conf, so a composition that does not
      # layer this file gets the same override.
      # Without it, link=1 is refused with link_unsupported.
      linkFederatedIdentityUrl = ${?CLIENT_USER_LINK_FEDERATED_IDENTITY_URL}
      # #613: optional. The Store's identity lookup for federation grants —
      # what lets this deployment keep FEDERATION_GRANTS_IDENTITY_LOOKUP=required
      # with a connection configured. Same https and no-redirect rule. Declare what the Store
      # covers, per registration, in a HOCON layer (README: Federation Grants):
      #   federatedIdentityLookupCoverage = [
      #     { provider = "entra-files", issuer = "...", clientId = "...", requiredClaims = ["tid", "oid"] }
      #   ]
      findSubjectByFederatedIdentityUrl = ${?CLIENT_USER_FIND_SUBJECT_BY_FEDERATED_IDENTITY_URL}
      # Optional. Sent on every Store request as `Authorization: Bearer <token>`
      # so the Store can refuse any caller but this deployment; unset, none is
      # sent. A bare token (no "Bearer " prefix), at least 32 bytes of key
      # material -- `openssl rand -hex 32`. Boot fails on a weak, malformed or
      # blank value. One token goes to every URL above: one trust domain. A
      # Store that refuses it with 401 (or 403) + `WWW-Authenticate: Bearer`
      # makes every Store call an outage rather than a wrong password: 503 and
      # a logged error at login, federation callbacks and the jwt-bearer
      # grant; a temporarily_unavailable redirect and
      # federation_grant_callback_unavailable (err.name
      # StoreCredentialRefusedError) at the federation-grants callback. Also
      # declared in core's reference.conf.
      bearerToken = ${?CLIENT_USER_BEARER_TOKEN}
      # Positive integer, milliseconds, <= 2147483647. Boot fails otherwise —
      # including on a blank env override, which HOCON substitutes as "".
      timeout = 5000
      timeout = ${?CLIENT_USER_TIMEOUT}
      # Largest upstream response body accepted, in bytes. Positive integer.
      maxResponseBytes = 1048576
      maxResponseBytes = ${?CLIENT_USER_MAX_RESPONSE_BYTES}
    }
  }
  code {
    type = "redis"
    type = ${?CLIENT_CODE_TYPE}
    memory {
      defaultExpiresIn = 600
      defaultExpiresIn = ${?CLIENT_CODE_DEFAULT_EXPIRES_IN}
    }
    redis {
      defaultExpiresIn = 600
      defaultExpiresIn = ${?CLIENT_CODE_DEFAULT_EXPIRES_IN}
      endpointUri = ${?CLIENT_CODE_ENDPOINT_URI}
      password = ${?CLIENT_CODE_PASSWORD}
    }
  }
}

endpoints {
  login {
    url = "/login"
    url = ${?ENDPOINTS_LOGIN_URL}
  }
  # IH-10: `client { url }` and `authCallback { url }` removed — no
  # production consumer reads them.
}

# The variables that set keys of the template's own modules, bound here, last,
# so each wins over a value this file sets above it. Keep this block last.
# config/reference.conf holds the defaults and binds the same variables.
http {
  port = ${?HTTP_PORT}
  trustProxy = ${?HTTP_TRUST_PROXY}
}
cors {
  allowedOrigins = ${?CORS_ALLOWED_ORIGINS}
}
refreshTokenFamilyStore.redis {
  url = ${?REFRESH_TOKEN_FAMILY_STORE_REDIS_URL}
  password = ${?REFRESH_TOKEN_FAMILY_STORE_REDIS_PASSWORD}
}
