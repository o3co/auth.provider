http {
  port = 3000
  port = ${?HTTP_PORT}
  trustProxy = false
  trustProxy = ${?HTTP_TRUST_PROXY}
}

oauth {
  jwt {
    issuer = ${?OAUTH_JWT_ISSUER}
    signingKey {
      provider = "local"
      provider = ${?OAUTH_JWT_SIGNING_KEY_PROVIDER}
      local {
        algorithm = "HS256"
        algorithm = ${?OAUTH_JWT_ALGORITHM}
        kid = "v0"
        kid = ${?OAUTH_JWT_KID}
        secret = ${?OAUTH_JWT_SECRET}
        privateKey = ${?OAUTH_JWT_PRIVATE_KEY}
        privateKeyPath = ${?OAUTH_JWT_PRIVATE_KEY_PATH}
        publicKey = ${?OAUTH_JWT_PUBLIC_KEY}
        publicKeyPath = ${?OAUTH_JWT_PUBLIC_KEY_PATH}
        previousKeys = []
      }
    }
  }
  accessToken {
    expiresIn = 3600
    expiresIn = ${?OAUTH_ACCESS_TOKEN_EXPIRES_IN}
  }
  refreshToken {
    expiresIn = 86400
    expiresIn = ${?OAUTH_REFRESH_TOKEN_EXPIRES_IN}
  }
  grants {
    session { enabled = true, enabled = ${?OAUTH_GRANTS_SESSION_ENABLED} }
    authorization_code {
      enabled = true
      enabled = ${?OAUTH_GRANTS_AUTHORIZATION_CODE_ENABLED}
      pkce {
        requireS256 = false
        requireS256 = ${?OAUTH_GRANTS_AUTHORIZATION_CODE_PKCE_REQUIRE_S256}
      }
    }
    refresh_token { enabled = true, enabled = ${?OAUTH_GRANTS_REFRESH_TOKEN_ENABLED} }
  }
}

session {
  secret = ${?SESSION_SECRET}
  maxAge = 3600000
  maxAge = ${?SESSION_MAX_AGE}
  secure = true
  secure = ${?SESSION_SECURE}
  sameSite = "lax"
  sameSite = ${?SESSION_SAME_SITE}
  domain = null
  domain = ${?SESSION_DOMAIN}
  storage {
    type = "redis"
    type = ${?SESSION_STORAGE_TYPE}
    redis {
      url = "redis://localhost:6379"
      url = ${?SESSION_STORAGE_REDIS_URL}
      password = ${?SESSION_STORAGE_REDIS_PASSWORD}
    }
  }
}

rateLimit {
  login { windowMs = 900000, limit = 20 }
}

federations {
  google {
    enabled = false
    enabled = ${?FEDERATIONS_GOOGLE_ENABLED}
    clientId = ${?FEDERATIONS_GOOGLE_CLIENT_ID}
    clientSecret = ${?FEDERATIONS_GOOGLE_CLIENT_SECRET}
    callbackURL = "http://localhost:3000/session/oauth/federation/google/callback"
    callbackURL = ${?FEDERATIONS_GOOGLE_CALLBACK_URL}
  }
}

repositories {
  client {
    type = "yaml"
    type = ${?CLIENT_TYPE}
    yaml {
      path = "./config/clients.yaml"
      path = ${?CLIENT_PATH}
    }
  }
  user {
    type = "http"
    type = ${?CLIENT_USER_TYPE}
    yaml {
      path = "./config/users.yaml"
    }
    http {
      authenticateUrl = ${?CLIENT_USER_AUTHENTICATE_URL}
      authenticateByTokenUrl = ${?CLIENT_USER_AUTHENTICATE_BY_TOKEN_URL}
      timeout = 5000
      timeout = ${?CLIENT_USER_TIMEOUT}
    }
  }
  code {
    type = "redis"
    type = ${?CLIENT_CODE_TYPE}
    memory {
      defaultExpiresIn = 600
      defaultExpiresIn = ${?CLIENT_CODE_DEFAULT_EXPIRES_IN}
    }
    redis {
      defaultExpiresIn = 600
      defaultExpiresIn = ${?CLIENT_CODE_DEFAULT_EXPIRES_IN}
      endpointUri = ${?CLIENT_CODE_ENDPOINT_URI}
      password = ${?CLIENT_CODE_PASSWORD}
    }
  }
}

endpoints {
  login {
    url = "/login"
    url = ${?ENDPOINTS_LOGIN_URL}
  }
  client { url = ${?ENDPOINTS_CLIENT_URL} }
  authCallback { url = ${?ENDPOINTS_AUTH_CALLBACK_URL} }
}

cors {
  allowedOrigins = []
}

# D-2 v2: refresh-token-family Redis client connection-config consumed by the
# standalone `refreshTokenFamilyClientModule`. Multi-replica deployments MUST
# point this at a shared Redis 7.2+ instance — without it, each replica
# stores RT families in its own ioredis connection but the underlying Redis
# server is local-only, defeating the cross-replica persistence purpose.
# Module-internal config (keyPrefix / casRetryLimit) lives separately under
# `redisRefreshTokenFamilyStore.*` (consumed by the store module's schema).
redisRefreshTokenFamilyStore {
  keyPrefix = "rtfam:"
  keyPrefix = ${?REFRESH_TOKEN_FAMILY_STORE_KEY_PREFIX}
  casRetryLimit = 3
  casRetryLimit = ${?REFRESH_TOKEN_FAMILY_STORE_CAS_RETRY_LIMIT}
}

refreshTokenFamilyStore {
  redis {
    url = "redis://localhost:6379"
    url = ${?REFRESH_TOKEN_FAMILY_STORE_REDIS_URL}
    password = ${?REFRESH_TOKEN_FAMILY_STORE_REDIS_PASSWORD}
  }
}
