# Environment overlay for production.
# Loaded when CONFIG_ENV (or NODE_ENV) is "production".
# Values here override application.conf.
#
# Most production-sensitive values (SESSION_SECRET, the JWT signing key, REDIS
# URLs, federation client secrets, etc.) should be supplied via environment
# variables — see the ${?VAR} substitutions in application.conf.
#
# #407: this used to name OAUTH_JWT_SECRET as the typical example. That is the
# HMAC secret, and it stopped being the default when EdDSA became one (#282) —
# the shipped path is now a key pair delivered as files
# (OAUTH_JWT_PRIVATE_KEY_PATH / OAUTH_JWT_PUBLIC_KEY_PATH), which
# docker-compose.production.yml mounts as compose secrets.
#
# Override entries here only when a value must be fixed per-environment rather
# than per-deployment (e.g. feature flags turned on only in production).
