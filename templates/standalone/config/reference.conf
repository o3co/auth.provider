# Defaults of the standalone template's own modules (src/modules.mts), each
# at the path its module reads its section from.
#
# Every one of those modules declares this file as its section's reference,
# so `resolveForBoot` layers it beneath application.conf and {env}.conf and
# above core's reference.conf, as `moduleReferences(modules)` orders them.
# Set a deployment's own value in application.conf or {env}.conf, so this
# file keeps only the defaults. An environment variable takes effect through
# the `${?VAR}` line beside each default, as long as no layer above writes a
# literal at the same path.

# The logging module's section (`logging`): the level the composition's
# logger emits at. `trace` and `debug` carry request-shaped detail and are off
# by default; `silent` drops everything but the audit trail, whose level is
# fixed. One of: trace | debug | info | warn | error | fatal | silent.
logging {
  level = "info"
  level = ${?LOG_LEVEL}
}

# The key store's section (`key-store`): the JWT signing key.
oauth.jwt.signingKey {
  provider = "local"
  provider = ${?OAUTH_JWT_SIGNING_KEY_PROVIDER}
  local {
    # The default is asymmetric. HS256 leaves a relying party with two bad
    # options: verify nothing (there is no public key to publish, so
    # /.well-known/jwks.json has nothing to serve), or hold the shared
    # secret, which also lets it mint tokens. EdDSA (Ed25519) publishes a
    # real JWKS and keeps signing capability here.
    #
    # There is no key material default and no fallback: a deployment that
    # configures nothing fails at boot naming the keys to set, rather than
    # quietly signing with a guessable secret.
    #
    #   openssl genpkey -algorithm ed25519 -out jwt-private.pem
    #   openssl pkey -in jwt-private.pem -pubout -out jwt-public.pem
    #
    # HS256 remains selectable (OAUTH_JWT_ALGORITHM=HS256) for deployments
    # that verify in-process and publish no JWKS. It then requires
    # OAUTH_JWT_SECRET with at least 32 bytes (256 bits) of random material
    # (`openssl rand -hex 32`). Hex and base64 values are measured decoded, so
    # a 32-character hex string is only 16 bytes and is refused.
    algorithm = "EdDSA"
    algorithm = ${?OAUTH_JWT_ALGORITHM}
    kid = "v0"
    kid = ${?OAUTH_JWT_KID}
    secret = ${?OAUTH_JWT_SECRET}
    privateKeyPath = ${?OAUTH_JWT_PRIVATE_KEY_PATH}
    publicKeyPath = ${?OAUTH_JWT_PUBLIC_KEY_PATH}
    privateKey = ${?OAUTH_JWT_PRIVATE_KEY}
    publicKey = ${?OAUTH_JWT_PUBLIC_KEY}
    # Key rotation is shaped per algorithm family. Asymmetric algorithms
    # (RS256, ES256, EdDSA) use `previousKeys` (kid, publicKey or
    # publicKeyPath, expiresAt); HS256 uses `previousSecrets` (kid, secret,
    # expiresAt). The schema is a discriminated union and the key store
    # refuses the other family's field, so the wrong shape fails at boot
    # rather than being dropped at verification time. Neither is declared
    # here: the default algorithm is EdDSA, and an empty
    # `previousSecrets = []` under it would be exactly that wrong shape. Add
    # the one matching your algorithm in your own layer.
  }
}

# The shared Redis connection's section (`redis-clients`): one ioredis socket
# per replica backs every Redis-backed store the composition selects (the
# refresh-token families, the user sessions, the rate limiter, the code
# repository, the denylist, the consent and federation stores). A
# deployment of more than one replica points it at a shared Redis 7.2+
# instance: each replica's own Redis would keep its own refresh-token
# families, and rotation would fail on every other replica. The default is
# localhost, which inside a container is the container itself.
refreshTokenFamilyStore.redis {
  url = "redis://localhost:6379"
  url = ${?REFRESH_TOKEN_FAMILY_STORE_REDIS_URL}
  password = ${?REFRESH_TOKEN_FAMILY_STORE_REDIS_PASSWORD}
}
