# Environment overlay for a development run whose mail goes to Mailpit
# (docker-compose.mailpit.yml). Loaded when CONFIG_ENV is "mailpit".
#
# The template installs the sender that logs each code only where the
# configuration is selected as "development", and the SMTP sender under any
# other name. For development only; a deployment names its own relay.
#
# It does not include development.conf, whose one setting is the MFA
# development sample key: the MFA package accepts that key only where every
# environment name set says development or test, and this run is selected as
# "mailpit". The key ring's first key is MFA_ENCRYPTION_KEY, as the MFA
# package's reference.conf binds it: write a key of your own
# (openssl rand -base64 32) into .env; without one the boot is refused.
