# no-mfa:omit-file
# Environment overlay for a development run whose mail goes to Mailpit
# (docker-compose.mailpit.yml). Loaded when CONFIG_ENV is "mailpit".
#
# The development overlay under another name: the template installs the
# sender that logs each code only where the configuration is selected as
# "development", and the SMTP sender under any other name. For development
# only; a deployment names its own relay.
include "development.conf"
