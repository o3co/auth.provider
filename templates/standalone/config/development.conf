# Environment overlay for development.
# Loaded when CONFIG_ENV (or NODE_ENV) is "development" — the default.
# Values here override application.conf.
#
# Most values are controlled via environment variables (see the ${?VAR}
# substitutions in application.conf and reference.conf). Override entries
# here only when you need a fixed development-specific value that cannot come
# from an environment variable.

# The MFA key ring's development key: the MFA package's published sample key
# (MFA_DEVELOPMENT_SAMPLE_KEY), which everyone holds. It stands in for
# MFA_ENCRYPTION_KEY here: to use a key of your own in development, write it
# in place of this one. It is accepted only where the configuration's name and
# NODE_ENV, each where set, say development or test, and is refused under
# `core.deployment.mode = "multi"`; boot warns while it is in use
# (mfa_development_sample_key_in_use). Read only while MFA_MODE installs MFA.
mfa.encryptionKeys = [{ key = "bzNjbzptZmE6ZGV2ZWxvcG1lbnQtc2FtcGxlLWtleSE=" }]
